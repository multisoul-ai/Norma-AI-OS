# cargo-packager 配置（未签名 .app/.dmg）。字段以 cargo-packager 文档为准，
# 若 schema 不符按 https://docs.crabnebula.dev/packager/ 校准。
name = "app"
product-name = "Multisoul"
version = "0.1.0"
identifier = "com.multisoul.desktop"
authors = ["multisoul"]
formats = ["app", "dmg"]
icons = ["assets/AppIcon.icns"]
out-dir = "build"
binaries-dir = "."
before-packaging-command = "cargo build --release -p app"

[dmg]
background = "assets/dmg-background.png"
window-size = { width = 640, height = 400 }
app-position = { x = 180, y = 200 }
application-folder-position = { x = 460, y = 200 }

# 指向 release 二进制
[[binaries]]
path = "target/release/multisoul"
main = true

[[binaries]]
path = "target/release/multisoul-agent-hook"
main = false

[macos]
minimum-system-version = "12.0"
info-plist-path = "packaging/macos/Info.plist"
# 本切片不签名/不公证（Phase 6）。
