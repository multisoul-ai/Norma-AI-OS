# cargo-packager 配置：Developer ID 签名 + notarize（signing-identity 阶段 0 启用）。字段以 cargo-packager 文档为准，
# 若 schema 不符按 https://docs.crabnebula.dev/packager/ 校准。
name = "app"
product-name = "Norma OS"
version = "0.1.15"
identifier = "com.norma.os"
authors = ["multisoul"]
formats = ["app", "dmg"]
resources = [
  "crates/app/assets/wallpapers",
  "sidecars/openai-card-planner/openai-card-planner.mjs",
]
icons = ["assets/AppIcon.icns"]
out-dir = "build"
binaries-dir = "."
before-packaging-command = "scripts/bump-release-version.sh && cargo build --release -p app"

[dmg]
background = "assets/dmg-background.png"
window-size = { width = 640, height = 400 }
app-position = { x = 180, y = 200 }
application-folder-position = { x = 460, y = 200 }

# 指向 release 二进制
[[binaries]]
path = "target/release/norma-os"
main = true

[[binaries]]
path = "target/release/multisoul-agent-hook"
main = false

[macos]
minimum-system-version = "12.0"
info-plist-path = "packaging/macos/Info.plist"
entitlements = "packaging/macos/NormaOS.entitlements"
signing-identity = "Developer ID Application: Shanghai Jieyu Future Intelligent Network Technology Co., Ltd (2BF8G9AN4L)"
