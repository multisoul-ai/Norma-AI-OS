[package]
name = "voice_macos"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-avf-audio = { version = "0.3.2", features = ["AVAudioBuffer", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioTime", "AVAudioTypes", "block2"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFDate", "CFRunLoop"] }
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSLocale", "NSObject", "NSString"] }
objc2-speech = { version = "0.3.2", features = ["SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription", "block2", "objc2-avf-audio"] }
