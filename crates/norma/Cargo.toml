[package]
name = "norma"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "norma"
path = "src/lib.rs"

[[bin]]
name = "norma"
path = "src/bin/norma.rs"

[[bin]]
name = "multisoul-agent-hook"
path = "src/bin/multisoul_agent_hook.rs"

[dependencies]
workspace.workspace = true
mobile_pairing = { path = "../mobile_pairing" }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = { version = "2.6", default-features = false }
url.workspace = true
tungstenite.workspace = true
crossbeam-channel.workspace = true
rustls.workspace = true
# Already used by mobile_pairing/rustls; X25519, HKDF and AES-GCM for opaque relay sessions.
ring = "0.17"
# Self-signed pairing certificates; use the existing ring TLS backend.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring"] }

base64 = "0.22"
axum = "0.8"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile.workspace = true
reqwest = { workspace = true, features = ["json"] }
