[package]
name = "norma"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "norma"
path = "src/lib.rs"

[[bin]]
name = "norma"
path = "src/bin/norma.rs"

[[bin]]
name = "multisoul-agent-hook"
path = "src/bin/multisoul_agent_hook.rs"

[dependencies]
mobile_pairing = { path = "../mobile_pairing" }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rusqlite.workspace = true
md-5 = "0.10"
subtle = { version = "2.6", default-features = false }
url.workspace = true
tungstenite.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
ureq.workspace = true
base64 = "0.22"
libc = "0.2"
rustls.workspace = true
# Already used by mobile_pairing/rustls; X25519, HKDF and AES-GCM for opaque relay sessions.
ring = "0.17"
# Self-signed pairing certificates; use the existing ring TLS backend.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile.workspace = true
