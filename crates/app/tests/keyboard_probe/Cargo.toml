[package]
name = "app-keyboard-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
gpui = { version = "=0.2.2", path = "../../../../vendor/gpui-0.2.2", features = ["test-support"] }
ui = { path = "../../../ui" }
storage = { path = "../../../storage" }
norma = { path = "../../../norma" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
gpui = { path = "../../../../vendor/gpui-0.2.2" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
