[package]
name = "app-platform-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Compile the actual App adapters without pulling GPUI into the OS-resource tests.
[workspace]

[dependencies]
crossbeam-channel = "0.5"
norma = { path = "../../../norma" }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
