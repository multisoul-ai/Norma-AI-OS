[package]
name = "app-platform-probe"
version = "0.1.0"
edition = "2021"
publish = false

# Compile the actual App adapters without pulling GPUI into the OS-resource tests.
[workspace]

[patch.crates-io]
sherpa-onnx-sys = { path = "../../../../vendor/sherpa-onnx-sys-1.13.3" }

[dependencies]
socket2 = "=0.6.4"
crossbeam-channel = "0.5"
norma = { path = "../../../norma" }
tracing = "0.1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
storage = { path = "../../../storage" }
dirs = "6"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
voice_input = { path = "../../../voice_input", features = ["test-support"] }
asr = { path = "../../../asr" }
audio = { path = "../../../audio" }
async-channel = "2"
windows = { version = "=0.61.3", features = ["Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT"] }
uds_windows = "=1.2.1"
workspace = { path = "../../../workspace" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
