[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "norma-os"

[features]
default = []
chromium-browser = ["dep:cef"]
production-data = []
e2e-test-support = [
    "asr/test-support",
    "voice_input/test-support",
    "voice_sherpa/test-support",
]

[[bin]]
name = "norma-os"
path = "src/main.rs"

[[bin]]
name = "multisoul-agent-hook"
path = "src/bin/multisoul_agent_hook.rs"

[[bin]]
name = "norma-browser-auth-host"
path = "src/bin/norma_browser_auth_host.rs"

[dependencies]
gpui = { workspace = true, features = ["test-support"] }
ui.workspace = true
runtime.workspace = true
canvas.workspace = true
storage.workspace = true
terminal.workspace = true
workspace.workspace = true
norma.workspace = true
voice_sherpa.workspace = true
voice_input.workspace = true
dialogue.workspace = true
audio.workspace = true
asr.workspace = true
license.workspace = true
tts.workspace = true
agent.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
url = "2.5"
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
crossbeam-channel.workspace = true
async-channel.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
pulldown-cmark.workspace = true
ureq.workspace = true
rustls.workspace = true
hound = "3.5"
image = "0.25"

# Native file picker for wallpaper import (Task 8). AsyncFileDialog is awaited
# inside a cx.spawn task so it never blocks the GPUI event loop.
rfd = "0.16"

[dev-dependencies]
tempfile.workspace = true

# Video wallpaper spike (Task 1): objc2 + AVAssetReader → 420f CVPixelBuffer.
# All AVFoundation interop is macOS-only; on other targets these crates are
# neither compiled against nor linked.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-video = { version = "=0.4.3", features = ["metal"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "WKHTTPCookieStore",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSView", "NSWindow"] }
objc2-avf-audio = { version = "0.3.2", features = [
    "AVAudioBuffer",
    "AVAudioEngine",
    "AVAudioFormat",
    "AVAudioMixerNode",
    "AVAudioNode",
    "AVAudioPlayerNode",
    "AVAudioTypes",
    "block2",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
screencapturekit = "0.2.8"
objc2-av-foundation = { version = "0.3", features = [
    "AVAsset",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    "AVMediaFormat",
    "objc2-core-media",
] }
block2 = "0.6"
raw-window-handle = "0.6"
wry = { version = "0.55.1", default-features = false, features = ["protocol"] }
cef = { version = "149.3.0", optional = true, default-features = false }
