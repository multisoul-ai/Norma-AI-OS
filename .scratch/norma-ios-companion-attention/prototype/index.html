<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Norma · 工作空间</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #fff;
    --ink: #000;
    --sub: #3c3c43;
    --muted: #8e8e93;
    --line: rgba(60,60,67,.16);
    --fill: rgba(120,120,128,.12);
    --blue: #007aff;
    --ease: cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #111;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { min-height: 100%; display: grid; place-items: center; padding: 28px 12px; }
  .phone {
    width: min(100%, 390px);
    height: min(92vh, 844px);
    background: var(--bg);
    border-radius: 46px;
    box-shadow: 0 0 0 3px #2c2c2e, 0 0 0 11px #0a0a0a, 0 36px 90px rgba(0,0,0,.45);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 36px; background: #000; border-radius: 20px; z-index: 4;
  }
  .status {
    height: 54px; padding: 16px 28px 0;
    display: flex; justify-content: space-between;
    font-size: 15px; font-weight: 600; flex-shrink: 0;
  }
  .scroll {
    flex: 1; overflow: auto; padding: 0 16px 28px;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { display: none; }
  .scroll.with-composer { padding-bottom: 108px; }
  h1 {
    font-size: 34px; line-height: 1.1; letter-spacing: -.03em;
    font-weight: 700; margin: 8px 0 16px;
  }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 40px; margin-bottom: 4px;
  }
  .nav-title { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .text-btn {
    border: 0; background: transparent; color: var(--blue);
    font-size: 17px; padding: 6px 0; cursor: pointer;
  }
  .text-btn:active { opacity: .55; }
  .group {
    background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 16px;
  }
  .row {
    width: 100%; text-align: left; border: 0; background: var(--card);
    display: flex; gap: 12px; align-items: center;
    padding: 12px 14px; cursor: pointer; position: relative;
    font: inherit; color: inherit;
  }
  .row + .row::before, .msg + .msg::before {
    content: ""; position: absolute; left: 62px; right: 0; top: 0; height: 1px; background: var(--line);
  }
  .row:active { background: #ececee; }
  .row .body { flex: 1; min-width: 0; }
  .row .t { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chev { color: #c7c7cc; font-size: 20px; font-weight: 400; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center; color: #fff;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .avatar.sm { width: 28px; height: 28px; font-size: 12px; }
  .members { display: flex; gap: 14px; overflow: auto; padding: 4px 2px 14px; scrollbar-width: none; }
  .members::-webkit-scrollbar { display: none; }
  .member { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 48px; }
  .member span { font-size: 11px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chip {
    font-size: 13px; color: var(--sub); background: var(--fill);
    border-radius: 999px; padding: 4px 10px;
  }
  .chip strong { font-weight: 600; }
  .msg { display: flex; gap: 10px; padding: 12px 2px; position: relative; }
  .msg .who { font-size: 15px; font-weight: 600; }
  .msg .time { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .msg .text { font-size: 16px; line-height: 1.35; margin-top: 2px; white-space: pre-wrap; }
  .msg.system .text { color: var(--sub); }
  .composer {
    position: absolute; left: 12px; right: 12px; bottom: 22px;
    display: flex; gap: 8px; align-items: flex-end;
    background: rgba(255,255,255,.96);
    border-radius: 22px;
    box-shadow: 0 8px 28px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06);
    padding: 6px 6px 6px 14px;
  }
  .composer textarea {
    flex: 1; border: 0; resize: none; outline: none; background: transparent;
    font: 16px/1.35 inherit; max-height: 88px; padding: 8px 0;
  }
  .send {
    width: 34px; height: 34px; border-radius: 50%; border: 0;
    background: var(--blue); color: #fff; font-size: 18px; cursor: pointer;
  }
  .send:disabled { background: #d1d1d6; }
  .send:active { transform: scale(.96); }
  .pri {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .pri.high { background: #ff3b30; }
  .pri.mid { background: #ff9f0a; }
  .pri.low { background: #8e8e93; }
  .section {
    font-size: 13px; font-weight: 600; color: var(--muted);
    margin: 8px 4px;
  }
  .task {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 14px; position: relative; background: #fff;
  }
  .task + .task::before {
    content: ""; position: absolute; left: 32px; right: 0; top: 0; height: 1px; background: var(--line);
  }
  .task .t { font-size: 16px; font-weight: 600; }
  .task .s { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .new-box { display: flex; gap: 8px; margin-bottom: 12px; }
  .new-box input {
    flex: 1; border: 0; background: #fff; border-radius: 12px;
    padding: 12px 14px; font: 16px inherit; outline: none;
  }
  .empty { color: var(--muted); font-size: 15px; padding: 12px 4px 24px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const COLORS = { you: "#007aff", norma: "#1c1c1e", Ada: "#5e5ce6", Cody: "#ff9f0a", Morgan: "#34c759" };
const colorOf = (name) => COLORS[name] || "#636366";
const initialOf = (name) => (name === "你" ? "我" : name.slice(0, 1));

const uid = () => Math.random().toString(36).slice(2, 8);
const nowLabel = () => {
  const d = new Date();
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
};

const seed = () => ({
  screen: "list",
  spaceId: null,
  drafting: false,
  spaces: [
    {
      id: "login",
      title: "登录失败",
      projects: [
        { name: "norma-os", primary: true },
        { name: "mobile-app", primary: false },
      ],
      members: ["你", "Norma", "Ada", "Cody"],
      messages: [
        { id: "m1", author: "你", text: "测试环境登录一直失败。", time: "9:12" },
        { id: "m2", author: "Norma", text: "交给 Ada，放在 norma-os，优先级高。", time: "9:12", system: true },
        { id: "m3", author: "Ada", text: "我先用 mock 稳住测试。@Cody 看一下相关 CI。", time: "9:18" },
        { id: "m4", author: "Norma", text: "已交给 Cody · norma-os · 优先级中。来自 Ada 的任务。", time: "9:18", system: true },
      ],
      tasks: [
        { id: "t1", title: "用 mock 稳住登录测试", agent: "Ada", project: "norma-os", priority: "高", status: "进行中", by: "Norma" },
        { id: "t2", title: "看登录相关 CI", agent: "Cody", project: "norma-os", priority: "中", status: "排队", by: "Ada", parent: "用 mock 稳住登录测试" },
      ],
    },
    {
      id: "pay",
      title: "支付沙箱",
      projects: [{ name: "payments", primary: true }],
      members: ["你", "Norma", "Cody"],
      messages: [
        { id: "m5", author: "你", text: "沙箱回调和文档对不上。", time: "昨天" },
        { id: "m6", author: "Norma", text: "交给 Cody，放在 payments，优先级中。", time: "昨天", system: true },
      ],
      tasks: [
        { id: "t3", title: "核对沙箱回调", agent: "Cody", project: "payments", priority: "中", status: "进行中", by: "Norma" },
      ],
    },
    {
      id: "notes",
      title: "发布说明",
      projects: [
        { name: "norma-os", primary: true },
        { name: "handbook", primary: false },
      ],
      members: ["你", "Norma"],
      messages: [
        { id: "m7", author: "你", text: "这次发布说明要不要写给内部？", time: "周一" },
        { id: "m8", author: "Norma", text: "这是在讨论。还没派任务。", time: "周一", system: true },
      ],
      tasks: [],
    },
  ],
});

let S = seed();
const params = new URLSearchParams(location.search);
if (params.get("space")) {
  S.spaceId = params.get("space");
  S.screen = params.get("page") === "progress" ? "progress" : "space";
}

const space = () => S.spaces.find((s) => s.id === S.spaceId);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const av = (name, sm) => `<div class="avatar ${sm ? "sm" : ""}" style="background:${colorOf(name)}">${esc(initialOf(name))}</div>`;

function openCount(sp) {
  return sp.tasks.filter((t) => t.status !== "完成").length;
}

function renderList() {
  return `
    <div class="scroll">
      <div class="nav"><span></span><button class="text-btn" data-act="draft">${S.drafting ? "取消" : "新建"}</button></div>
      <h1>空间</h1>
      ${S.drafting ? `<form class="new-box" data-new><input name="title" placeholder="这件事情叫什么" autocomplete="off" /><button class="send" type="submit">↑</button></form>` : ""}
      <div class="group">
        ${S.spaces.map((sp) => {
          const n = openCount(sp);
          const projects = sp.projects.map((p) => p.name).join(" · ");
          return `<button class="row" data-act="open" data-id="${sp.id}">
            ${av(sp.title, false)}
            <div class="body"><div class="t">${esc(sp.title)}</div><div class="s">${esc(projects)}${n ? " · " + n + " 项在进行" : ""}</div></div>
            <div class="chev">›</div>
          </button>`;
        }).join("")}
      </div>
    </div>`;
}

function renderSpace(sp) {
  return `
    <div class="scroll with-composer" id="feed">
      <div class="nav">
        <button class="text-btn" data-act="list">‹ 空间</button>
        <button class="text-btn" data-act="progress">进度</button>
      </div>
      <div class="nav-title">${esc(sp.title)}</div>
      <div class="chips">${sp.projects.map((p) => `<span class="chip">${p.primary ? "<strong>主</strong> " : ""}${esc(p.name)}</span>`).join("")}</div>
      <div class="members">${sp.members.map((m) => `<div class="member">${av(m, true)}<span>${esc(m)}</span></div>`).join("")}</div>
      <div class="group" style="padding:0 12px">
        ${sp.messages.map((m) => `
          <div class="msg ${m.system ? "system" : ""}">
            ${av(m.author, true)}
            <div><div class="who">${esc(m.author)}<span class="time">${esc(m.time)}</span></div><div class="text">${esc(m.text)}</div></div>
          </div>`).join("")}
      </div>
    </div>
    <form class="composer" data-compose>
      <textarea name="q" rows="1" placeholder="发到这个空间，用 @ 点名"></textarea>
      <button class="send" type="submit" aria-label="发送">↑</button>
    </form>`;
}

function renderProgress(sp) {
  const order = ["高", "中", "低"];
  const groups = order.map((p) => ({ p, items: sp.tasks.filter((t) => t.priority === p) })).filter((g) => g.items.length);
  return `
    <div class="scroll">
      <div class="nav"><button class="text-btn" data-act="space">‹ ${esc(sp.title)}</button></div>
      <h1>进度</h1>
      ${groups.length ? groups.map((g) => `
        <div class="section">${g.p === "高" ? "高优先级" : g.p === "中" ? "中优先级" : "低优先级"}</div>
        <div class="group">
          ${g.items.map((t) => `
            <div class="task">
              <div class="pri ${t.priority === "高" ? "high" : t.priority === "中" ? "mid" : "low"}"></div>
              <div>
                <div class="t">${esc(t.title)}</div>
                <div class="s">${esc(t.agent)} · ${esc(t.project)} · ${esc(t.status)} · ${esc(t.by)} 派的${t.parent ? " · 父任务「" + esc(t.parent) + "」" : ""}</div>
              </div>
            </div>`).join("")}
        </div>`).join("") : `<div class="empty">这个空间还没有任务。</div>`}
    </div>`;
}

function shell(inner) {
  return `<div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>▮▮</span></div>${inner}</div>`;
}

function render() {
  const sp = space();
  let inner = renderList();
  if (S.screen === "space" && sp) inner = renderSpace(sp);
  if (S.screen === "progress" && sp) inner = renderProgress(sp);
  if ((S.screen === "space" || S.screen === "progress") && !sp) {
    S.screen = "list";
    inner = renderList();
  }
  document.getElementById("stage").innerHTML = shell(inner);
  const feed = document.getElementById("feed");
  if (feed) feed.scrollTop = feed.scrollHeight;
  const draft = document.querySelector("[data-new] input");
  if (draft) draft.focus();
}

function say(sp, author, text, system) {
  sp.messages.push({ id: uid(), author, text, time: nowLabel(), system: !!system });
}

function priorityOf(text) {
  if (/紧急|马上|尽快|优先/.test(text)) return "高";
  if (/不急|稍后|有空/.test(text)) return "低";
  return "中";
}

function isDiscussion(text) {
  const action = /修|做|改|看|跑|查|加|写|实现|处理|核对|排|派|稳住|补|删/.test(text);
  if (action) return false;
  return /吗|怎么|为什么|觉得|聊聊|要不要|？|\?/.test(text) || text.length < 18;
}

function mentionsOf(text) {
  const found = [];
  const re = /@([A-Za-z][A-Za-z]{1,15}|[\u4e00-\u9fff]{2,8})/g;
  let m;
  while ((m = re.exec(text))) found.push(m[1] === "norma" ? "Norma" : m[1]);
  return found;
}

function projectOf(sp, text) {
  const hit = sp.projects.find((p) => text.toLowerCase().includes(p.name.toLowerCase()));
  if (hit) return { project: hit.name, asked: false };
  const primary = sp.projects.find((p) => p.primary) || sp.projects[0];
  if (!primary) return { project: null, asked: true };
  return { project: primary.name, asked: false, assumed: sp.projects.length > 1 };
}

function addTask(sp, task) {
  sp.tasks.push({ id: uid(), status: "排队", ...task });
}

function ensureMember(sp, name) {
  if (!sp.members.includes(name)) sp.members.push(name);
}

function onSend(sp, raw) {
  const text = raw.trim();
  if (!text) return;
  say(sp, "你", text);
  const mentions = mentionsOf(text);
  const agents = mentions.filter((n) => n !== "Norma");
  const bare = text.replace(/@\S+/g, " ").replace(/\s+/g, " ").trim();
  const discussion = isDiscussion(bare || text);

  if (!agents.length) {
    if (discussion && !mentions.includes("Norma")) {
      say(sp, "Norma", "这是在讨论。还没派任务。", true);
      return;
    }
    if (discussion && mentions.includes("Norma")) {
      say(sp, "Norma", "要我派给谁、做什么？说清楚我就排优先级。", true);
      return;
    }
    const pick = projectOf(sp, text);
    if (!pick.project) {
      say(sp, "Norma", "这个空间还没有项目。先告诉我放在哪个仓库。", true);
      return;
    }
    const agent = /CI|e2e|构建|回调|沙箱/.test(text) ? "Cody" : /文档|说明|手册/.test(text) ? "Morgan" : "Ada";
    ensureMember(sp, agent);
    const pri = priorityOf(text);
    const title = bare.replace(/^(请|帮我|把)/, "").slice(0, 28) || "处理这件事";
    addTask(sp, { title, agent, project: pick.project, priority: pri, by: "Norma" });
    const assumed = pick.assumed ? `没写仓库，我放在 ${pick.project}。` : "";
    say(sp, "Norma", `${assumed}交给 ${agent}，放在 ${pick.project}，优先级${pri}。`.trim(), true);
    return;
  }

  if (!bare || discussion && bare.length < 8) {
    agents.forEach((a) => ensureMember(sp, a));
    say(sp, "Norma", `已把 ${agents.join("、")} 加入这个空间。要他们做什么？`, true);
    return;
  }

  const pick = projectOf(sp, text);
  if (!pick.project) {
    agents.forEach((a) => ensureMember(sp, a));
    say(sp, "Norma", "人已经在空间里了。还缺仓库，没有建任务。", true);
    return;
  }
  const pri = priorityOf(text);
  const by = mentions.includes("Norma") ? "Norma" : "你";
  agents.forEach((agent) => {
    ensureMember(sp, agent);
    addTask(sp, { title: bare.slice(0, 32), agent, project: pick.project, priority: pri, by });
  });
  const who = agents.map((a) => `${a} · ${pick.project}`).join("、");
  const assumed = pick.assumed ? `没写仓库，放在 ${pick.project}。` : "";
  say(sp, "Norma", `${assumed}已交给 ${who}，优先级${pri}。请求人是${by}。`.trim(), true);
}

document.getElementById("stage").addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "open") { S.spaceId = t.dataset.id; S.screen = "space"; S.drafting = false; }
  else if (act === "list") { S.screen = "list"; S.spaceId = null; }
  else if (act === "progress") S.screen = "progress";
  else if (act === "space") S.screen = "space";
  else if (act === "draft") S.drafting = !S.drafting;
  render();
});

document.getElementById("stage").addEventListener("submit", (e) => {
  const compose = e.target.closest("[data-compose]");
  const newer = e.target.closest("[data-new]");
  if (compose) {
    e.preventDefault();
    const sp = space();
    if (!sp) return;
    const input = compose.querySelector("textarea");
    onSend(sp, input.value);
    render();
  } else if (newer) {
    e.preventDefault();
    const title = newer.querySelector("input").value.trim();
    if (!title) return;
    const id = uid();
    S.spaces.unshift({
      id, title, projects: [{ name: "norma-os", primary: true }],
      members: ["你", "Norma"], messages: [], tasks: [],
    });
    S.drafting = false;
    S.spaceId = id;
    S.screen = "space";
    say(S.spaces[0], "Norma", "空间建好了，主项目先放 norma-os。直接说要做什么，或 @ 某个人。", true);
    render();
  }
});

render();
</script>
</body>
</html>
