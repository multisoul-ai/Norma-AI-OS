<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Norma iOS 伴侣 · 原型变体</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --ink: #111111;
    --muted: #8e8e93;
    --line: rgba(60, 60, 67, 0.12);
    --accent: #007aff;
    --danger: #ff3b30;
    --warn: #ff9f0a;
    --ok: #34c759;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --radius: 16px;
    --phone-w: 390px;
    --phone-h: 844px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #e8e8ed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 72px 16px 40px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* —— Picker (verbatim from PICKER.md, position top) —— */
  .proto-picker {
    position: fixed;
    bottom: auto;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 8px 24px rgba(0, 0, 0, 0.24),
      0 2px 6px rgba(0, 0, 0, 0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  .proto-picker-highlight {
    position: absolute;
    top: 4px;
    left: 0;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition:
      transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
      width 250ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.4);
    outline-offset: 2px;
  }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider {
    width: 1px; height: 16px; margin: 0 4px;
    background: rgba(255, 255, 255, 0.12);
  }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }

  /* —— Shared phone chrome —— */
  .phone {
    width: min(100%, var(--phone-w));
    height: min(92vh, var(--phone-h));
    background: var(--bg);
    border-radius: 44px;
    box-shadow:
      0 0 0 10px #1c1c1e,
      0 24px 80px rgba(0,0,0,.28);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(8px);
    animation: phone-in 280ms var(--ease-out) forwards;
  }
  @keyframes phone-in {
    to { opacity: 1; transform: translateY(0); }
  }
  .notch {
    height: 54px;
    padding: 14px 28px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .notch .right { display: flex; gap: 6px; font-size: 12px; color: var(--muted); }
  .screen {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px 120px;
  }
  .screen.no-pad-bottom { padding-bottom: 24px; }

  .title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 4px 0 16px;
  }
  .section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: none;
    margin: 18px 0 8px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
  }
  .card.enter {
    animation: card-in 220ms var(--ease-out) both;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .badge.ask { background: #e8f1ff; color: var(--accent); }
  .badge.perm { background: #fff3e0; color: #c65c00; }
  .badge.fail { background: #ffe8e6; color: var(--danger); }
  .card h3 {
    margin: 0 0 4px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .plan {
    font-size: 14px;
    color: #3a3a3c;
    background: #f7f7f9;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
  }
  .row-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    border: 0;
    border-radius: 980px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 120ms ease-out, opacity 120ms ease-out;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: #eef0f4; color: var(--ink); }
  .btn.danger { background: #ffe8e6; color: var(--danger); }

  .composer {
    position: absolute;
    left: 12px; right: 12px; bottom: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    border: 1px solid var(--line);
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
    backdrop-filter: blur(16px);
  }
  .composer.top {
    bottom: auto;
    top: 58px;
    position: sticky;
    z-index: 5;
    margin: 0 0 12px;
  }
  .composer .icon {
    width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: #f0f1f4; cursor: pointer;
    font-size: 18px; line-height: 1;
  }
  .composer input {
    flex: 1; border: 0; outline: none; background: transparent;
    font-size: 16px; color: var(--ink);
  }
  .composer input::placeholder { color: var(--muted); }
  .toast {
    position: absolute; left: 20px; right: 20px; top: 64px;
    background: #1c1c1e; color: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; z-index: 20;
    opacity: 0; transform: translateY(-6px);
    pointer-events: none;
  }
  .toast.show {
    animation: toast-in 220ms var(--ease-out) forwards;
  }
  @keyframes toast-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .hub-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
  }
  .hub-tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
  }
  .hub-tile .n {
    font-size: 28px; font-weight: 700; letter-spacing: -0.04em;
  }
  .hub-tile .l { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .hub-tile.active { outline: 2px solid var(--accent); outline-offset: 0; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
  }
  .empty strong {
    display: block;
    color: var(--ink);
    font-size: 20px;
    margin-bottom: 6px;
  }

  .nav-mini {
    display: flex; gap: 8px; margin-bottom: 8px;
  }
  .nav-mini button {
    border: 0; background: transparent; color: var(--accent);
    font-size: 15px; font-weight: 500; cursor: pointer; padding: 0;
  }

  .lock {
    background: #0b1a12;
    color: #fff;
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 28px 22px;
    z-index: 30;
  }
  .lock .clock {
    font-size: 72px; font-weight: 300; letter-spacing: -0.04em;
    margin-top: 48px; text-align: center;
  }
  .lock .date { text-align: center; opacity: .7; margin-bottom: 40px; }
  .live {
    margin-top: auto;
    margin-bottom: 100px;
    background: rgba(20,20,22,.72);
    border-radius: 22px;
    padding: 14px 16px;
    backdrop-filter: blur(20px);
  }
  .live .top {
    display: flex; justify-content: space-between;
    font-size: 12px; color: rgba(255,255,255,.55); margin-bottom: 6px;
  }
  .live h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .live .next { font-size: 14px; color: rgba(255,255,255,.85); }
  .live .repo { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 8px; }
  .lock .dismiss {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    border: 0; background: rgba(255,255,255,.18); color: #fff;
    border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer;
  }

  .zoom-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .bubble {
    max-width: 86%;
    padding: 10px 12px;
    border-radius: 16px;
    margin-bottom: 8px;
    font-size: 15px;
    line-height: 1.35;
  }
  .bubble.them { background: #e9e9eb; }
  .bubble.me { background: var(--accent); color: #fff; margin-left: auto; }

  .hint {
    position: fixed;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #666;
    background: rgba(255,255,255,.8);
    padding: 4px 10px;
    border-radius: 8px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
  <nav class="proto-picker" data-position="top" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quiet</button>
    <button class="proto-picker-item">Stacked</button>
    <button class="proto-picker-item">Hub</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <div class="hint">1–3 / ←→ 切换变体 · R 重播入场 · ?demo=lock|empty|zoom|agents|digest</div>
  <div id="stage"></div>

<script>
/* Shared domain state — reset on remount via clone */
const INITIAL = () => ({
  screen: "home", // home | zoom | agents | lock
  focusHub: "need",
  continueHint: "继续：修登录失败…",
  toast: "",
  zoomAgent: null,
  inlineClarify: null, // short Norma clarify
  items: [
    {
      id: "q1", badge: "提问", badgeClass: "ask",
      title: "登录失败怎么处理？",
      source: "Ada",
      plan: "下一步：选 mock 还是修真 API",
      evidence: null,
    },
    {
      id: "p1", badge: "权限", badgeClass: "perm",
      title: "批准外发 PR #482",
      source: "Norma",
      plan: "下一步：批准 revert #482 或改 fixture",
      evidence: "github.com/…/pull/482",
    },
    {
      id: "f1", badge: "失败", badgeClass: "fail",
      title: "e2e 在 CI 红了",
      source: "Cody",
      plan: "下一步：重跑 flaky 或开 issue",
      evidence: null,
    },
    {
      id: "d1", badge: "提问", badgeClass: "ask",
      title: "沙箱修复已预备",
      source: "Ada",
      plan: "方案已核验：应用 patch 并跑单测",
      evidence: null,
      prepared: true,
    },
  ],
  digest: [
    { id: "done1", title: "依赖扫描通过", source: "Cody", when: "10:12" },
    { id: "done2", title: "登录页文案已改", source: "Ada", when: "09:40" },
  ],
});

let S = INITIAL();

/** Deep-link demos for evidence screenshots: ?demo=lock|empty|zoom|agents|digest */
function applyDemo() {
  const demo = new URLSearchParams(location.search).get("demo") || "";
  if (demo === "lock") {
    S.screen = "lock";
  } else if (demo === "agents") {
    S.screen = "agents";
  } else if (demo === "zoom") {
    S.zoomAgent = S.items[0] || null;
    S.screen = S.zoomAgent ? "zoom" : "home";
  } else if (demo === "empty") {
    S.items = [];
    S.continueHint = "";
    S.inlineClarify = null;
    S.screen = "home";
  } else if (demo === "digest") {
    S.focusHub = "digest";
    S.screen = "home";
  }
}

function toast(msg) {
  S.toast = msg;
  setTimeout(() => {
    if (S.toast === msg) S.toast = "";
    refresh();
  }, 1600);
  refresh();
}

function approve(id) {
  const i = S.items.findIndex((x) => x.id === id);
  if (i < 0) return;
  const [it] = S.items.splice(i, 1);
  toast(`已处理 · ${it.badge}`);
  if (!S.items.length) S.continueHint = "";
  refresh();
}

function later(id) {
  toast("已稍后 · 仍在「需要你」");
}

function openZoom(item) {
  S.screen = "zoom";
  S.zoomAgent = item;
  refresh();
}

function sendCommand(text) {
  const t = (text || "").trim();
  if (!t) return;
  if (/支付|清理/.test(t)) {
    S.items.unshift({
      id: "n" + Date.now(),
      badge: "提问",
      badgeClass: "ask",
      title: "「支付相关」范围太大",
      source: "Norma",
      plan: "下一步：先只做沙箱，还是包含生产？",
      evidence: null,
    });
    S.inlineClarify = null;
    S.continueHint = "";
    toast("复杂澄清已进「需要你」");
  } else if (/登录|修/.test(t) && !S.inlineClarify) {
    S.inlineClarify = {
      q: "用 mock 还是修真 API？",
      a: "mock",
      b: "真 API",
    };
    toast("短澄清 · 内联");
  } else {
    S.continueHint = "";
    toast("已交给 Norma");
  }
  refresh();
}

function pickInline(choice) {
  S.inlineClarify = null;
  S.continueHint = `继续：修登录（${choice}）…`;
  toast(`已选 ${choice}`);
  refresh();
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/"/g, "&quot;");
}

function statusBar() {
  return `<div class="notch"><span>9:41</span><span class="right">5G · ▮▮▮</span></div>`;
}

function toastEl() {
  return S.toast
    ? `<div class="toast show" role="status">${esc(S.toast)}</div>`
    : `<div class="toast" aria-hidden="true"></div>`;
}

function composer(opts) {
  const top = opts && opts.top;
  const ph = S.continueHint || "对 Norma 说点什么…";
  return `
  <form class="composer ${top ? "top" : ""}" data-composer onsubmit="return false;">
    <button type="button" class="icon" data-act="agents" title="全部 Agent">＋</button>
    <input name="q" placeholder="${esc(ph)}" autocomplete="off" />
    <button type="button" class="icon" data-act="mic" title="语音">🎙</button>
    ${S.continueHint ? `<button type="button" class="icon" data-act="clear-hint" title="清除继续">×</button>` : ""}
  </form>`;
}

function needCards(stagger) {
  if (!S.items.length) {
    return `<div class="empty enter"><strong>暂时没有需要你的事</strong>Norma 会在需要时找你</div>`;
  }
  return S.items
    .map(
      (it, idx) => `
    <article class="card ${stagger ? "enter" : ""}" style="${stagger ? `animation-delay:${idx * 40}ms` : ""}">
      <span class="badge ${it.badgeClass}">${esc(it.badge)}</span>
      <h3>${esc(it.title)}</h3>
      <div class="meta">${esc(it.source)}${it.evidence ? " · " + esc(it.evidence) : ""}${it.prepared ? " · 已核验" : ""}</div>
      <div class="plan">${esc(it.plan)}</div>
      <div class="row-actions">
        <button class="btn primary" data-act="approve" data-id="${it.id}">${it.badge === "权限" ? "批准" : "处理"}</button>
        <button class="btn ghost" data-act="later" data-id="${it.id}">稍后</button>
        <button class="btn ghost" data-act="zoom" data-id="${it.id}">看上下文</button>
      </div>
    </article>`
    )
    .join("");
}

function digestBlock(collapsed) {
  const body = S.digest
    .map(
      (d) =>
        `<div class="meta" style="margin:6px 0">${esc(d.when)} · ${esc(d.title)} · ${esc(d.source)}</div>`
    )
    .join("");
  if (collapsed) {
    return `
    <details class="card">
      <summary class="section-label" style="cursor:pointer;list-style:none">摘要 · ${S.digest.length}</summary>
      ${body}
    </details>`;
  }
  return `
    <div class="section-label">摘要 · ${S.digest.length}</div>
    <div class="card">${body || '<div class="meta">暂无</div>'}</div>`;
}

function inlineBlock() {
  if (!S.inlineClarify) return "";
  const c = S.inlineClarify;
  return `
  <div class="card enter" style="border-color:#cfe0ff">
    <span class="badge ask">提问 · Norma</span>
    <h3 style="font-size:15px">${esc(c.q)}</h3>
    <div class="row-actions" style="margin-top:8px">
      <button class="btn primary" data-act="inline" data-v="${esc(c.a)}">${esc(c.a)}</button>
      <button class="btn ghost" data-act="inline" data-v="${esc(c.b)}">${esc(c.b)}</button>
    </div>
  </div>`;
}

function lockScreen() {
  const top = S.items[0];
  const isRisk = top && (top.badge === "权限" || top.badge === "失败");
  const next = top
    ? isRisk
      ? top.plan
      : top.badge === "提问"
        ? top.title
        : top.plan
    : "暂时没有需要你的事";
  return `
  <div class="lock" data-lock>
    <div class="clock">9:41</div>
    <div class="date">9月25日 周五</div>
    <div class="live">
      <div class="top"><span>需要你${S.items.length ? " · " + S.items.length : ""}</span><span>刚刚</span></div>
      <h2>${top ? esc(top.title) : "Norma"}</h2>
      <div class="next">${esc(next)}</div>
      <div class="repo">Norma-AI-OS</div>
    </div>
    <button class="dismiss" data-act="unlock">打开 App</button>
  </div>`;
}

function zoomScreen() {
  const a = S.zoomAgent;
  if (!a) return "";
  return `
  ${statusBar()}
  <div class="screen">
    <div class="zoom-head">
      <button class="btn ghost" data-act="home">‹ 返回</button>
      <strong>${esc(a.source)}</strong>
    </div>
    <div class="bubble them">我在修登录失败，卡在测试策略上。</div>
    <div class="bubble them">${esc(a.plan)}</div>
    <div class="bubble me">你先列选项，我回来再定。</div>
    <form data-zoom-form onsubmit="return false;" style="margin-top:16px;display:flex;gap:8px">
      <input name="z" style="flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px"
        value="${esc(a.plan.replace(/^下一步：/, ""))}" />
      <button class="btn primary" data-act="zoom-send">发送</button>
    </form>
  </div>`;
}

function agentsScreen() {
  return `
  ${statusBar()}
  <div class="screen">
    <div class="nav-mini"><button data-act="home">‹ 返回</button></div>
    <div class="title">全部 Agent</div>
    <div class="section-label">Working</div>
    <div class="card"><h3>Ada</h3><div class="meta">Working · 修登录</div></div>
    <div class="card"><h3>Cody</h3><div class="meta">Working · CI</div></div>
    <div class="section-label">Idle</div>
    <div class="card"><h3>Morgan</h3><div class="meta">Idle · Norma-AI-OS</div></div>
  </div>`;
}

function wirePhone(root) {
  root.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.getAttribute("data-act");
    const id = t.getAttribute("data-id");
    if (act === "approve") approve(id);
    else if (act === "later") later(id);
    else if (act === "zoom") {
      const it = S.items.find((x) => x.id === id);
      if (it) openZoom(it);
    } else if (act === "home") {
      S.screen = "home";
      refresh();
    } else if (act === "agents") {
      S.screen = "agents";
      refresh();
    } else if (act === "lock") {
      S.screen = "lock";
      refresh();
    } else if (act === "unlock") {
      S.screen = "home";
      refresh();
    } else if (act === "clear-hint") {
      S.continueHint = "";
      refresh();
    } else if (act === "mic") toast("语音录入（示意）");
    else if (act === "inline") pickInline(t.getAttribute("data-v"));
    else if (act === "hub") {
      S.focusHub = t.getAttribute("data-hub");
      refresh();
    } else if (act === "zoom-send") toast("已发到会话");
  });
  const form = root.querySelector("[data-composer]");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = form.querySelector("input");
      sendCommand(input.value);
      input.value = "";
    });
    form.querySelector(".icon[data-act=mic]")?.addEventListener(
      "click",
      () => {},
      { once: false }
    );
    // Enter from input
    form.querySelector("input")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendCommand(e.target.value);
        e.target.value = "";
      }
    });
  }
}

/* —— Variants —— */

function renderQuiet() {
  // Axis: Cursor-like quiet list + bottom composer
  if (S.screen === "lock") return `<div class="phone">${lockScreen()}</div>`;
  if (S.screen === "zoom") {
    const el = `<div class="phone">${zoomScreen()}</div>`;
    return el;
  }
  if (S.screen === "agents") return `<div class="phone">${agentsScreen()}</div>`;
  return `
  <div class="phone" data-variant="Quiet">
    ${toastEl()}
    ${statusBar()}
    <div class="screen">
      <div class="nav-mini">
        <button data-act="lock">锁屏示意</button>
        <button data-act="agents">全部 Agent</button>
      </div>
      <div class="title">需要你${S.items.length ? " · " + S.items.length : ""}</div>
      ${inlineBlock()}
      ${needCards(true)}
      ${digestBlock(true)}
    </div>
    ${composer({ top: false })}
  </div>`;
}

function renderStacked() {
  // Axis: command bar sticky top + dual stacked zones (需要你 / 摘要)
  if (S.screen === "lock") return `<div class="phone">${lockScreen()}</div>`;
  if (S.screen === "zoom") return `<div class="phone">${zoomScreen()}</div>`;
  if (S.screen === "agents") return `<div class="phone">${agentsScreen()}</div>`;
  return `
  <div class="phone" data-variant="Stacked">
    ${toastEl()}
    ${statusBar()}
    <div class="screen no-pad-bottom" style="padding-top:0">
      ${composer({ top: true })}
      <div class="nav-mini">
        <button data-act="lock">锁屏示意</button>
        <button data-act="agents">全部 Agent</button>
      </div>
      <div class="title" style="font-size:28px">需要你</div>
      ${inlineBlock()}
      ${needCards(true)}
      ${digestBlock(false)}
      <div style="height:24px"></div>
    </div>
  </div>`;
}

function renderHub() {
  // Axis: hub tiles (需要你 / 摘要 / Agent) then filtered list + bottom bar
  if (S.screen === "lock") return `<div class="phone">${lockScreen()}</div>`;
  if (S.screen === "zoom") return `<div class="phone">${zoomScreen()}</div>`;
  if (S.screen === "agents") return `<div class="phone">${agentsScreen()}</div>`;
  const need = S.focusHub === "need";
  const dig = S.focusHub === "digest";
  return `
  <div class="phone" data-variant="Hub">
    ${toastEl()}
    ${statusBar()}
    <div class="screen">
      <div class="title">今日</div>
      <div class="hub-grid">
        <button class="hub-tile ${need ? "active" : ""}" data-act="hub" data-hub="need">
          <div class="n" style="color:var(--warn)">${S.items.length}</div>
          <div class="l">需要你</div>
        </button>
        <button class="hub-tile ${dig ? "active" : ""}" data-act="hub" data-hub="digest">
          <div class="n">${S.digest.length}</div>
          <div class="l">摘要</div>
        </button>
        <button class="hub-tile" data-act="agents">
          <div class="n" style="color:var(--accent)">2</div>
          <div class="l">全部 Agent</div>
        </button>
        <button class="hub-tile" data-act="lock">
          <div class="n" style="font-size:20px;padding-top:8px">锁屏</div>
          <div class="l">Live Activity</div>
        </button>
      </div>
      ${inlineBlock()}
      ${need ? needCards(true) : ""}
      ${dig ? digestBlock(false) : ""}
      ${!need && !dig ? needCards(true) : ""}
    </div>
    ${composer({ top: false })}
  </div>`;
}

const variants = [renderQuiet, renderStacked, renderHub];

/* —— Picker wiring (verbatim behavior) —— */
const stage = document.getElementById("stage");
const picker = document.querySelector(".proto-picker");
const highlight = picker.querySelector(".proto-picker-highlight");
const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
const replay = picker.querySelector(".proto-picker-replay");
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + "px";
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  S = INITIAL(); // fresh session per remount so entrances + demo state reset
  applyDemo();
  stage.innerHTML = "";
  requestAnimationFrame(() => {
    stage.innerHTML = variants[i]();
    const phone = stage.querySelector(".phone");
    if (phone) wirePhone(phone);
  });
}

function refresh() {
  stage.innerHTML = variants[current]();
  const phone = stage.querySelector(".phone");
  if (phone) wirePhone(phone);
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute("data-active", j === i);
    if (j === i) el.setAttribute("aria-current", "true");
    else el.removeAttribute("aria-current");
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set("v", i + 1);
  // preserve ?demo= when flipping variants for evidence capture
  history.replaceState(null, "", url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
replay?.addEventListener("click", () => mount(current));
window.addEventListener("resize", moveHighlight);

document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
  else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === "r" || e.key === "R") mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
requestAnimationFrame(() =>
  requestAnimationFrame(() => picker.setAttribute("data-ready", ""))
);
</script>
</body>
