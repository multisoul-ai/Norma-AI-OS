[versions]
# Verified against Meta-Spatial-SDK-Samples/StarterSample, 2026-09-08.
spatial = "0.13.2"
agp = "8.11.1"
kotlin = "2.1.0"
composeBom = "2024.09.03"
activity = "1.9.2"
coreKtx = "1.13.1"
serialization = "1.7.3"
okhttp = "4.12.0"
junit = "4.13.2"

[libraries]
spatial-base = { module = "com.meta.spatial:meta-spatial-sdk", version.ref = "spatial" }
spatial-toolkit = { module = "com.meta.spatial:meta-spatial-sdk-toolkit", version.ref = "spatial" }
spatial-vr = { module = "com.meta.spatial:meta-spatial-sdk-vr", version.ref = "spatial" }
spatial-compose = { module = "com.meta.spatial:meta-spatial-sdk-compose", version.ref = "spatial" }
spatial-isdk = { module = "com.meta.spatial:meta-spatial-sdk-isdk", version.ref = "spatial" }
spatial-uiset = { module = "com.meta.spatial:meta-spatial-sdk-uiset", version.ref = "spatial" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
