# Local Keygate spike (not for production).
# Upstream image ghcr.io/tabloy/keygate is currently private/unauthorized for anonymous pull,
# so we build from the public GitHub source (tag pin).
services:
  keygate:
    build:
      context: https://github.com/tabloy/keygate.git#v0.1.1
      dockerfile: Dockerfile
    image: keygate-spike:v0.1.1
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      # development: enables /auth/dev-login on localhost
      ENVIRONMENT: development
      BASE_URL: http://localhost:9000
      DATABASE_URL: postgres://keygate:keygate@postgres:5432/keygate?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LICENSE_SIGNING_KEY: ${LICENSE_SIGNING_KEY:?Set LICENSE_SIGNING_KEY in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    # 16 avoids Postgres 18's /var/lib/postgresql mount layout change.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keygate
      POSTGRES_PASSWORD: keygate
      POSTGRES_DB: keygate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keygate"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
