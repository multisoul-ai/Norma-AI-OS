# Include inside the existing soulvoiceai.com HTTPS server block.
# The longer prefix takes precedence over the existing /norma/ push relay.
location ^~ /norma/voice/ {
    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    # 60min exceeds the gateway's 35min call limit, including muted/idle tool channels.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    access_log off;
}
