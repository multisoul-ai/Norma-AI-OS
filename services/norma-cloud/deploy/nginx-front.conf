# Include inside the existing soulvoiceai.com HTTPS server block.
# Both public prefixes share one process and port. Keep push limited to its own routes.
location ^~ /norma/voice/v1/admin/ { return 404; }
location ^~ /norma/voice/ {
    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    # 60min exceeds the gateway's 35min call limit, including muted/idle tool channels.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_request_buffering off;
    proxy_buffering off;
    # Text context accepts 32 KiB; voice/claim keep their smaller limits in the gateway.
    client_max_body_size 32k;
    client_body_timeout 10s;
    access_log off;
}

location ^~ /norma/ {
    # Prevent /norma/v1/admin/... from bypassing the voice prefix's administrative block.
    if ($uri !~ ^/norma/(v1/notifications|healthz)$) { return 404; }
    proxy_pass http://127.0.0.1:8789/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_next_upstream off;
    proxy_intercept_errors off;
    error_page 502 504 =503 @norma_push_unavailable;
    proxy_connect_timeout 2s;
    # 12s = the existing 10s APNs wait + 2s processing allowance.
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    client_max_body_size 4k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log off;
}

location @norma_push_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 503 '{"error":"push_unavailable"}';
}
