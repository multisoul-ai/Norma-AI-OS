# Include inside the public soulvoiceai.com HTTPS server block.
# Preserve /norma/: the origin removes it before forwarding to the local relay.
location ^~ /norma/ {
    proxy_pass https://118.31.118.73;
    proxy_http_version 1.1;
    proxy_set_header Host soulvoiceai.com;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name soulvoiceai.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_ssl_verify_depth 3;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    error_page 502 504 =503 @norma_front_unavailable;
    proxy_connect_timeout 3s;
    # Origin waits up to 12s; 15s leaves 3s for cross-host transport.
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    client_max_body_size 4k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    access_log off;
}

location @norma_front_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 503 '{"error":"push_unavailable"}';
}
