# Include inside the existing soulvoiceai.com HTTPS server block.
# If HTTPS is on another host, deploy this service there or use a verified TLS/private upstream.
location ^~ /norma/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_next_upstream off;
    proxy_intercept_errors off;
    # Keep a missing backend from falling into the website HTML error pages.
    error_page 502 504 =503 @norma_push_unavailable;
    proxy_connect_timeout 2s;
    # Relay waits 10s for APNs; 12s leaves 2s for processing.
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    client_max_body_size 4k;
    client_body_timeout 5s;
    proxy_request_buffering off;
    proxy_buffering off;
    # Never log request bodies, Authorization or device tokens at this entry.
    access_log off;
}

location @norma_push_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    access_log off;
    return 503 '{"error":"push_unavailable"}';
}
