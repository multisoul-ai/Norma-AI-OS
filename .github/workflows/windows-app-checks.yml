name: Windows complete App gates
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths: ['.github/workflows/windows-app-checks.yml']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
jobs:
  app-gates:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-keyboard
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Record the actual compiler
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/app-gates
          rustc -vV | tee artifacts/app-gates/rustc.log
      - name: Require the complete Windows App unit test harness
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p app --lib -- --nocapture 2>&1 | tee artifacts/app-gates/app-tests.log
      - name: Require strict production App Clippy
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p app --lib --bin norma-os -- -D warnings 2>&1 | tee artifacts/app-gates/clippy.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-app-gates-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/app-gates/
          if-no-files-found: error
          retention-days: 3
