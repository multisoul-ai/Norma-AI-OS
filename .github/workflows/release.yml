name: Release macOS with Sparkle

on:
  workflow_dispatch:

concurrency:
  group: norma-os-macos-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.91.1
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  release:
    runs-on: macos-15
    environment: release
    timeout-minutes: 180
    steps:
      - name: Reject release dispatch outside main
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$DISPATCH_REF" = "refs/heads/main" ] || {
            echo "release workflow may only run from main; got $DISPATCH_REF" >&2
            exit 1
          }

      - name: Checkout main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Resolve release version and validate monotonicity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(scripts/release-version.sh)
          TAG="v$VERSION"
          LATEST_TAG=$(curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'User-Agent: norma-os-release-workflow' \
            https://api.github.com/repos/multisoul-ai/norma-os-releases/releases/latest \
            | jq -er '.tag_name')
          scripts/release-version.sh --require-newer-than "$LATEST_TAG" >/dev/null
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "source provenance tag already exists: $TAG" >&2
            exit 1
          fi
          printf 'version=%s\ntag=%s\n' "$VERSION" "$TAG" >>"$GITHUB_OUTPUT"

      - name: Install pinned Rust and cargo-packager
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
          cargo-packager --version | grep -F "cargo-packager $CARGO_PACKAGER_VERSION"

      - name: Build, sign, notarize, and staple
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          RELEASE_TMP=$(mktemp -d "${RUNNER_TEMP}/norma-release.XXXXXX")
          KEYCHAIN="$RELEASE_TMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          ORIGINAL_KEYCHAINS="$RELEASE_TMP/original-keychains.txt"
          security list-keychains -d user | tr -d ' "' >"$ORIGINAL_KEYCHAINS"
          cleanup() {
            original=()
            while IFS= read -r keychain; do
              [ -n "$keychain" ] && original+=("$keychain")
            done <"$ORIGINAL_KEYCHAINS"
            if [ "${#original[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${original[@]}" || true
            fi
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            find "$RELEASE_TMP" -depth -delete
          }
          trap cleanup EXIT

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D >"$RELEASE_TMP/developer-id.p12"
          API_KEY_PATH="$RELEASE_TMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" >"$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "${HOME}/Library/Keychains/login.keychain-db"
          security import "$RELEASE_TMP/developer-id.p12" \
            -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          export APP_STORE_CONNECT_API_KEY_PATH="$API_KEY_PATH"
          ./scripts/release-local.sh --notarize

      - name: Generate signed Sparkle appcast from notarized DMG
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          DMG=""
          DMG_COUNT=0
          while IFS= read -r candidate; do
            DMG="$candidate"
            DMG_COUNT=$((DMG_COUNT + 1))
          done < <(find build -maxdepth 1 -type f -name '*.dmg' -print)
          [ "$DMG_COUNT" -eq 1 ] || {
            echo "expected exactly one notarized DMG, found $DMG_COUNT" >&2
            exit 1
          }
          ./scripts/finalize-sparkle-release.sh \
            --tag "$TAG" \
            --app "build/Norma OS.app" \
            --dmg "$DMG"

      - name: Verify local release assets
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/verify-release-artifacts.sh \
            --tag "$TAG" \
            --app "build/Norma OS.app" \
            --assets build/release-assets

      # Installation tokens expire after roughly one hour, so this must remain
      # after the long Rust build, Apple notarization, and local appcast checks.
      - name: Create short-lived GitHub App token
        id: release-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          owner: multisoul-ai
          repositories: |
            norma-os-releases
            ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish verified Draft Release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/publish-github-release.sh \
            --repo multisoul-ai/norma-os-releases \
            --tag "$TAG" \
            --assets build/release-assets \
            --plist "build/Norma OS.app/Contents/Info.plist"

      - name: Create source provenance tag and next patch pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "norma-release[bot]"
          git config user.email "norma-release[bot]@users.noreply.github.com"
          gh auth setup-git
          git tag -a "$TAG" -m "Norma OS $TAG release provenance"
          git push origin "$TAG"

          scripts/bump-release-version.sh
          NEXT_VERSION=$(scripts/release-version.sh)
          cargo check -p app
          BRANCH="chore/next-version-$NEXT_VERSION"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "next-version branch already exists: $BRANCH" >&2
            exit 1
          fi
          git switch -c "$BRANCH"
          git add Cargo.toml Cargo.lock Packager.toml
          git commit -m "chore(release): prepare $NEXT_VERSION"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): prepare $NEXT_VERSION" \
            --body "Advances manifests to the next patch after publishing $TAG."
