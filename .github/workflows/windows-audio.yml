name: Windows native audio contracts
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths: ['crates/voice_input/**', 'crates/voice_sherpa/**', 'crates/audio/**', 'crates/app/src/app/voice/**', 'crates/app/tests/unit/windows_playback_tests.rs', 'crates/app/tests/unit/recognition_capture_tests.rs', 'crates/app/tests/platform_probe/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/windows-audio.yml']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  native-audio:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-audio
          cache-on-failure: true
      - name: Check actual Windows audio service and software APIs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-audio | Out-Null
          foreach ($name in @('AudioEndpointBuilder', 'Audiosrv')) {
            $service = Get-Service $name -ErrorAction Stop
            if ($service.Status -ne 'Running') { Start-Service $name -ErrorAction Stop }
          }
          Get-Service AudioEndpointBuilder, Audiosrv | Format-List | Out-File artifacts/windows-audio/services.log
          rustc -vV | Tee-Object artifacts/windows-audio/rustc.log
          cargo test --locked -p voice_input --test windows_platform -- --nocapture 2>&1 | Tee-Object artifacts/windows-audio/platform.log
          $platform = $LASTEXITCODE
          cargo test --locked --no-fail-fast -p voice_input -- --nocapture 2>&1 | Tee-Object artifacts/windows-audio/voice-input.log
          $regression = $LASTEXITCODE
          cargo test --locked -p voice_sherpa --lib 2>&1 | Tee-Object artifacts/windows-audio/voice-sherpa.log
          $sherpa = $LASTEXITCODE
          cargo clippy --locked -p voice_input -p voice_sherpa --all-targets -- -D warnings 2>&1 | Tee-Object artifacts/windows-audio/clippy.log
          $clippy = $LASTEXITCODE
          cargo test --locked -p voice_input --features test-support --test app_audio_platform playback -- --nocapture 2>&1 | Tee-Object artifacts/windows-audio/playback.log
          $playback = $LASTEXITCODE
          cargo test --locked -p voice_input --features test-support --test app_audio_platform recognition::capture_tests -- --nocapture 2>&1 | Tee-Object artifacts/windows-audio/capture-failure.log
          $captureFailure = $LASTEXITCODE
          @{ sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; platform_exit = $platform; regression_exit = $regression; sherpa_exit = $sherpa; clippy_exit = $clippy; playback_exit = $playback; capture_failure_exit = $captureFailure; physical_audio = 'NOT_RUN: no physical audio is injected by this workflow' } | ConvertTo-Json | Set-Content artifacts/windows-audio/report.json
          if ($platform -ne 0 -or $regression -ne 0 -or $sherpa -ne 0 -or $clippy -ne 0 -or $playback -ne 0 -or $captureFailure -ne 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-audio-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-audio/
          if-no-files-found: error
          retention-days: 3
  macos-audio-regression:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-audio-macos-regression
          cache-on-failure: true
      - name: Test affected capture callers on macOS
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/macos-audio
          rustc -vV | tee artifacts/macos-audio/rustc.log
          cargo test --locked --no-fail-fast -p voice_input -p voice_sherpa --lib 2>&1 | tee artifacts/macos-audio/tests.log
          cargo test --locked -p voice_input --features test-support --test app_audio_platform recognition::capture_tests -- --nocapture 2>&1 | tee artifacts/macos-audio/capture-failure.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-audio-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/macos-audio/
          if-no-files-found: error
          retention-days: 3
