name: Node session persistence
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths:
      - 'crates/storage/src/node_session_store.rs'
      - 'crates/storage/tests/unit/node_session*'
      - '.github/workflows/node-session-persistence.yml'
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-contracts
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Require reconciliation to own write intent before reading history
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/node-session-persistence
          rustc -vV | tee artifacts/node-session-persistence/rustc.log
          cargo test --locked -p storage --lib node_session_store::concurrency_tests::node_session_reconcile_owns_write_intent_before_reading_history -- --exact --nocapture 2>&1 | tee artifacts/node-session-persistence/concurrency.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/node-session-persistence/concurrency.log
      - name: Require the complete storage test harness
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p storage -- --nocapture 2>&1 | tee artifacts/node-session-persistence/storage.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: node-session-persistence-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/node-session-persistence/
          if-no-files-found: error
          retention-days: 3
