name: Windows native window lifecycle
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths:
      - 'crates/app/tests/keyboard_probe/src/window_lifecycle.rs'
      - 'vendor/gpui-0.2.2/src/platform/windows/window.rs'
      - 'vendor/gpui-0.2.2/src/platform/windows/events.rs'
      - '.github/workflows/windows-window-lifecycle.yml'
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
jobs:
  native-window:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-keyboard
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Build the actual GPUI window fixture with product dependency identities
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/window-lifecycle
          rustc -vV | tee artifacts/window-lifecycle/rustc.log
          python3 scripts/check-probe-lock.py Cargo.lock crates/app/tests/keyboard_probe/Cargo.lock
          cargo build --locked --manifest-path crates/app/tests/keyboard_probe/Cargo.toml --target-dir target --bin norma-window-lifecycle 2>&1 | tee artifacts/window-lifecycle/build.log
      - name: Require native close, queued activation and App removal
        shell: pwsh
        run: |
          $results=@{}
          foreach ($mode in @('native-close', 'queued-active-close', 'queued-window-ops-close', 'remove-window')) {
            $process=Start-Process ./target/debug/norma-window-lifecycle.exe -ArgumentList $mode -PassThru -RedirectStandardOutput "artifacts/window-lifecycle/$mode-stdout.log" -RedirectStandardError "artifacts/window-lifecycle/$mode-stderr.log"
            try {
              if ($process.WaitForExit(15000)) { $results[$mode]=$process.ExitCode }
              else { $results[$mode]=124; $process.Kill($true); $process.WaitForExit(5000) | Out-Null }
            } finally { $process.Dispose() }
          }
          @{ source_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; exits=$results } | ConvertTo-Json -Depth 4 | Set-Content artifacts/window-lifecycle/report.json
          if (@($results.Values | Where-Object { $_ -ne 0 }).Count -ne 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-window-lifecycle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/window-lifecycle/
          if-no-files-found: error
          retention-days: 3
