name: Sherpa native cache contract

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-feasibility-*']
    paths:
      - '.github/workflows/sherpa-cache-contracts.yml'
      - 'vendor/sherpa-onnx-sys-1.13.3/**'

permissions:
  contents: read

jobs:
  missing-native-library:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sherpa-native-cache-contract
          cache-on-failure: true
      - name: Build the real native dependency
        shell: bash
        run: |
          mkdir -p artifacts/sherpa-cache
          rustc -vV | tee artifacts/sherpa-cache/rustc.log
          cargo build --locked -p sherpa-onnx-sys 2>&1 | tee artifacts/sherpa-cache/initial-build.log
      - name: Simulate native archive and Rust artifact pruning while retaining build script outputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('target')
          libraries = list((root / 'sherpa-onnx-prebuilt').glob('*/lib'))
          artifacts = [p for p in (root / 'debug/deps').glob('libsherpa_onnx_sys*') if p.suffix in ('.rlib', '.rmeta')]
          assert libraries and artifacts, 'The initial build must produce real native and Rust libraries'
          for library in libraries:
              shutil.rmtree(library)
          for artifact in artifacts:
              artifact.unlink()
          Path('artifacts/sherpa-cache/pruned.txt').write_text('\n'.join(str(p) for p in libraries + artifacts) + '\n')
          PY
      - name: Require rebuild to restore the missing native libraries
        shell: bash
        run: |
          cargo build --locked -p sherpa-onnx-sys 2>&1 | tee artifacts/sherpa-cache/rebuild.log
          python3 - <<'PY'
          from pathlib import Path
          assert list(Path('target/sherpa-onnx-prebuilt').glob('*/lib/libsherpa-onnx-c-api.a')), 'The native library must actually be restored'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sherpa-cache-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sherpa-cache/
          if-no-files-found: error
          retention-days: 14
