name: Windows platform follow-up probes
on:
  push:
    branches: ['codex/windows-audio-*']
    paths:
      - '.github/workflows/windows-native-probes.yml'
      - 'crates/terminal/**'
      - 'vendor/portable-pty-0.9.0/**'
      - 'scripts/windows/**'
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  conpty-and-sync:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-followup
          cache-on-failure: true
      - name: Record actual runner CRT layout and bounded native regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/native-followup | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/*" -Directory | Where-Object { $_.Name -like '*.CRT' } | ForEach-Object { @{ path = $_.FullName; files = @(Get-ChildItem $_.FullName -File | Select-Object -ExpandProperty Name) } }
          @{ sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; attempt = $env:GITHUB_RUN_ATTEMPT; image = $env:ImageVersion; vs = $vs; crt = @($crt) } | ConvertTo-Json -Depth 6 | Set-Content artifacts/native-followup/environment.json
          cargo test --locked -p terminal --test sync_output -- --nocapture 2>&1 | Tee-Object artifacts/native-followup/sync.log
          $sync = $LASTEXITCODE
          cargo test --locked -p terminal --test windows_pty -- --nocapture 2>&1 | Tee-Object artifacts/native-followup/conpty.log
          $conpty = $LASTEXITCODE
          @{ sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; sync_exit = $sync; conpty_exit = $conpty } | ConvertTo-Json | Set-Content artifacts/native-followup/report.json
          if ($sync -ne 0 -or $conpty -ne 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-followup-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-followup/
          if-no-files-found: error
          retention-days: 3
