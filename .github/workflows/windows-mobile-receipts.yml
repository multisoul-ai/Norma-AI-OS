name: Windows mobile command receipts
on:
  push:
    branches: ['codex/windows-mobile-receipt-*']
    paths: ['.github/workflows/windows-mobile-receipts.yml']
  workflow_dispatch:
    inputs:
      historical:
        description: Compare the original passing and failing commits on the same runner
        type: boolean
        default: true
      repeats:
        description: Number of unchanged mobile_commands runs per source
        type: number
        default: 10
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  RUST_BACKTRACE: '1'
jobs:
  historical:
    if: github.event_name == 'workflow_dispatch' && inputs.historical
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-contracts
          cache-on-failure: true
      - name: Repeat the unchanged receipt test suite for both sources on this machine
        shell: pwsh
        env:
          RECEIPT_REPEATS: ${{ inputs.repeats }}
        run: |
          $count=[int]$env:RECEIPT_REPEATS
          if ($count -lt 1 -or $count -gt 100) { throw 'Repeat count must be 1..100' }
          $output=Join-Path $env:GITHUB_WORKSPACE 'artifacts/mobile-receipts'
          New-Item -ItemType Directory -Force $output | Out-Null
          $compiler=(& rustc -vV) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler identity unavailable' }
          $report=@{ probe_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; image=$env:ImageVersion; os=[Environment]::OSVersion.VersionString; processors=[Environment]::ProcessorCount; compiler=$compiler; runs=@() }
          $failed=$false
          $sources=[ordered]@{ baseline='f232ac0b7af551d2bf3899dc60c6b91964f50559'; observed_failure='7cf61b94a846c750f6355e1465d1d4d275eb27b8' }
          try {
            foreach ($entry in $sources.GetEnumerator()) {
              $source=Join-Path $env:RUNNER_TEMP "receipt-$($entry.Key)"
              git worktree add --detach $source $entry.Value
              if ($LASTEXITCODE -ne 0) { throw 'Historical source checkout failed' }
              $folder=Join-Path $output $entry.Key
              New-Item -ItemType Directory -Force $folder | Out-Null
              for ($i=1; $i -le $count; $i++) {
                $log=Join-Path $folder ("run-{0:D3}.log" -f $i)
                cargo test --locked --manifest-path "$source/Cargo.toml" -p storage --test mobile_commands -- --nocapture 2>&1 | Tee-Object $log
                $code=$LASTEXITCODE
                $text=Get-Content $log -Raw
                $match=[regex]::Match($text,'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;')
                $valid=$match.Success -and ([int]$match.Groups[1].Value+[int]$match.Groups[2].Value -eq 3) -and [int]$match.Groups[3].Value -eq 0
                $report.runs+=@{ source=$entry.Value; label=$entry.Key; iteration=$i; exit_code=$code; valid_test_counts=$valid; passed=$match.Groups[1].Value; failed=$match.Groups[2].Value; ignored=$match.Groups[3].Value; log="$($entry.Key)/$(Split-Path $log -Leaf)" }
                if ($code -ne 0 -or -not $valid) { $failed=$true }
                $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $output 'comparison.json') -Encoding utf8
              }
            }
          } finally { $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $output 'comparison.json') -Encoding utf8 }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-receipts-history-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mobile-receipts/
          if-no-files-found: error
          retention-days: 3

  focused:
    if: github.event_name == 'workflow_dispatch' && !inputs.historical
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-contracts
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Isolate the original two-thread reservation and immutable receipt case
        shell: pwsh
        env:
          RECEIPT_REPEATS: ${{ inputs.repeats }}
        run: |
          $count=[int]$env:RECEIPT_REPEATS
          if ($count -lt 1 -or $count -gt 100) { throw 'Repeat count must be 1..100' }
          $output='artifacts/mobile-receipts'
          New-Item -ItemType Directory -Force $output | Out-Null
          $compiler=(& rustc -vV) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler identity unavailable' }
          $report=@{ source_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; image=$env:ImageVersion; os=[Environment]::OSVersion.VersionString; processors=[Environment]::ProcessorCount; compiler=$compiler; runs=@() }
          $failed=$false
          try {
            for ($i=1; $i -le $count; $i++) {
              $log=Join-Path $output ("focused-{0:D3}.log" -f $i)
              cargo test --locked -p storage --test mobile_commands mobile_command_is_reserved_once_and_receipt_is_immutable -- --exact --nocapture 2>&1 | Tee-Object $log
              $code=$LASTEXITCODE
              $text=Get-Content $log -Raw
              $match=[regex]::Match($text,'test result: (?:ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;')
              $valid=$match.Success -and ([int]$match.Groups[1].Value+[int]$match.Groups[2].Value -eq 1) -and [int]$match.Groups[3].Value -eq 0
              $report.runs+=@{ iteration=$i; exit_code=$code; valid_test_counts=$valid; passed=$match.Groups[1].Value; failed=$match.Groups[2].Value; ignored=$match.Groups[3].Value; log=(Split-Path $log -Leaf) }
              if ($code -ne 0 -or -not $valid) { $failed=$true }
              $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $output 'focused.json') -Encoding utf8
            }
          } finally { $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $output 'focused.json') -Encoding utf8 }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-receipts-focused-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mobile-receipts/
          if-no-files-found: error
          retention-days: 3
