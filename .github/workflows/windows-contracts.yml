name: Windows native contracts

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-feasibility-*']
    paths:
      - '.github/workflows/windows-contracts.yml'
      - 'crates/norma/**'
      - 'crates/workspace/**'
      - 'crates/terminal/**'
      - 'crates/app/src/preview/content_copy.rs'
      - 'crates/app/tests/unit/content_i18n_tests.rs'
      - 'crates/app/src/settings/voice/view/gpt_live.rs'
      - 'crates/ui/locales/**'
      - 'scripts/*i18n.py'
      - 'vendor/portable-pty-0.9.0/**'
      - 'vendor/sherpa-onnx-sys-1.13.3/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  PYTHONUTF8: '1'

jobs:
  socket-diagnostics:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-contracts
          cache-on-failure: true
      - name: Isolate queued close and clone behavior
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/socket-diagnostics | Out-Null
          cargo test --locked -p norma --test socket_close_platform -- --nocapture --test-threads=1 2>&1 | Tee-Object artifacts/socket-diagnostics/test.log
          $code = $LASTEXITCODE
          $ran = Select-String -Path artifacts/socket-diagnostics/test.log -Pattern 'test result: ok\. 2 passed; 0 failed; 0 ignored;' -Quiet
          if ($code -ne 0 -or -not $ran) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: socket-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/socket-diagnostics/
          if-no-files-found: error
          retention-days: 14

  native-contracts:
    concurrency:
      group: windows-native-contracts-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-contracts
          cache-on-failure: true
      - name: Record environment and execute bounded native regressions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-contracts | Out-Null
          rustc -vV | Tee-Object artifacts/windows-contracts/rustc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
          $results = [ordered]@{}
          cargo test --locked -p norma --test bundled_helpers_platform -- --nocapture 2>&1 | Tee-Object artifacts/windows-contracts/bundled-helpers.log
          $results.bundled_helpers = $LASTEXITCODE
          cargo test --locked -p norma --test socket_close_platform -- --nocapture 2>&1 | Tee-Object artifacts/windows-contracts/socket-diagnostics.log
          $results.socket_diagnostics = $LASTEXITCODE
          cargo test --locked --no-fail-fast -p workspace --lib --test content_platform --test review_platform --test scoped_directory -- --nocapture 2>&1 | Tee-Object artifacts/windows-contracts/workspace.log
          $results.workspace = $LASTEXITCODE
          cargo test --locked --no-fail-fast -p norma --lib --test codex_control_shutdown --test codex_question_relay_backpressure --test protocol_tests -- --nocapture 2>&1 | Tee-Object artifacts/windows-contracts/relay.log
          $results.relay = $LASTEXITCODE
          cargo test --locked -p terminal --test windows_pty -- --nocapture 2>&1 | Tee-Object artifacts/windows-contracts/conpty.log
          $results.conpty = $LASTEXITCODE
          @{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; os = [Environment]::OSVersion.VersionString; commands = $results } | ConvertTo-Json -Depth 4 | Set-Content artifacts/windows-contracts/report.json
          if (@($results.Values | Where-Object { $_ -ne 0 }).Count -gt 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-contracts/
          retention-days: 14
          if-no-files-found: error

  macos-regression:
    concurrency:
      group: windows-port-macos-regression-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-port-macos-regression-native-watch-v2
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-1.13.3-static
      - name: Rebuild retained Sherpa outputs when native archives are missing
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          root = Path('target')
          native = list((root / 'sherpa-onnx-prebuilt').glob('*/lib/libsherpa-onnx-c-api.a'))
          if not native:
              patterns = ('debug/build/sherpa-onnx-sys-*', 'debug/.fingerprint/sherpa-onnx-sys-*',
                          'debug/deps/libsherpa_onnx_sys*', 'debug/deps/sherpa_onnx_sys-*.d')
              for pattern in patterns:
                  for path in root.glob(pattern):
                      print(f'Rebuilding missing native dependency: {path}')
                      if path.is_dir():
                          shutil.rmtree(path)
                      else:
                          path.unlink()
                      assert not path.exists(), f'Stale native build output remains: {path}'
          PYCODE
      - name: Record toolchain and run affected domain regressions
        shell: bash
        run: |
          mkdir -p artifacts/macos-regression
          rustc -vV | tee artifacts/macos-regression/rustc.log
          cargo test --locked --no-fail-fast -p agent -p brain -p canvas -p norma -p runtime -p storage -p terminal -p ui -p workspace 2>&1 | tee artifacts/macos-regression/domain-tests.log
      - name: Run App regression tests
        if: always()
        shell: bash
        run: cargo test --locked --no-fail-fast -p app --lib 2>&1 | tee artifacts/macos-regression/app-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/macos-regression/
          retention-days: 14
          if-no-files-found: error

  conpty-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: conpty-compatibility-${{ matrix.os }}
          cache-on-failure: true
      - name: Require actual full-pipe close and product terminal exit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/conpty-compatibility | Out-Null
          rustc -vV | Tee-Object artifacts/conpty-compatibility/rustc.log
          cargo test --locked --manifest-path vendor/portable-pty-0.9.0/Cargo.toml --target-dir target --lib abandoned_reader_does_not_deadlock_full_pipe_close -- --nocapture 2>&1 | Tee-Object artifacts/conpty-compatibility/close.log
          $close = $LASTEXITCODE
          $closeRan = Select-String -Path artifacts/conpty-compatibility/close.log -Pattern 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' -Quiet
          cargo test --locked -p terminal --test windows_pty -- --nocapture 2>&1 | Tee-Object artifacts/conpty-compatibility/session.log
          $session = $LASTEXITCODE
          $sessionRan = Select-String -Path artifacts/conpty-compatibility/session.log -Pattern 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' -Quiet
          @{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; os = [Environment]::OSVersion.VersionString; close_exit = $close; session_exit = $session; close_tests_observed = $closeRan; session_tests_observed = $sessionRan } | ConvertTo-Json | Set-Content artifacts/conpty-compatibility/report.json
          if ($close -ne 0 -or $session -ne 0 -or -not $closeRan -or -not $sessionRan) { exit 1 }
      - name: Require exact PTY process tree cleanup
        if: always()
        shell: pwsh
        run: |
          cargo test --locked -p terminal --test windows_process_tree -- --nocapture 2>&1 | Tee-Object artifacts/conpty-compatibility/process-tree.log
          $code = $LASTEXITCODE
          $ran = Select-String -Path artifacts/conpty-compatibility/process-tree.log -Pattern 'test result: ok\. 3 passed; 0 failed; 0 ignored;' -Quiet
          if ($code -ne 0 -or -not $ran) { exit 1 }
      - name: Require native Agent binary and environment boundaries
        if: always()
        shell: pwsh
        run: |
          cargo test --locked -p terminal --lib windows_launch::tests -- --nocapture 2>&1 | Tee-Object artifacts/conpty-compatibility/agent-command.log
          $code = $LASTEXITCODE
          $ran = Select-String -Path artifacts/conpty-compatibility/agent-command.log -Pattern 'test result: ok\. 6 passed; 0 failed; 0 ignored;' -Quiet
          if ($code -ne 0 -or -not $ran) { exit 1 }
      - name: Require platform PTY fixtures
        if: always()
        shell: pwsh
        run: |
          cargo test --locked -p terminal --lib pty::tests -- --nocapture 2>&1 | Tee-Object artifacts/conpty-compatibility/native-pty-fixtures.log
          $code = $LASTEXITCODE
          $ran = Select-String -Path artifacts/conpty-compatibility/native-pty-fixtures.log -Pattern 'test result: ok\. 3 passed; 0 failed; 0 ignored;' -Quiet
          if ($code -ne 0 -or -not $ran) { exit 1 }
      - name: Require the complete default terminal crate suite
        if: always()
        shell: pwsh
        run: |
          cargo test --locked -p terminal -- --nocapture 2>&1 | Tee-Object artifacts/conpty-compatibility/terminal-crate.log
          $code = $LASTEXITCODE
          $ran = Select-String -Path artifacts/conpty-compatibility/terminal-crate.log -Pattern 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' -Quiet
          if ($code -ne 0 -or -not $ran) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: conpty-compatibility-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/conpty-compatibility/
          retention-days: 14
          if-no-files-found: error

  macos-content-copy:
    concurrency:
      group: windows-port-content-copy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-port-content-copy-native-watch-v2
          cache-on-failure: true
          cache-workspace-crates: true
          env-vars: CARGO_PROFILE_TEST_OPT_LEVEL
      - uses: actions/cache@v4
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-1.13.3-static
      - name: Rebuild retained Sherpa outputs when native archives are missing
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          root = Path('target')
          native = list((root / 'sherpa-onnx-prebuilt').glob('*/lib/libsherpa-onnx-c-api.a'))
          if not native:
              patterns = ('debug/build/sherpa-onnx-sys-*', 'debug/.fingerprint/sherpa-onnx-sys-*',
                          'debug/deps/libsherpa_onnx_sys*', 'debug/deps/sherpa_onnx_sys-*.d')
              for pattern in patterns:
                  for path in root.glob(pattern):
                      print(f'Rebuilding missing native dependency: {path}')
                      if path.is_dir():
                          shutil.rmtree(path)
                      else:
                          path.unlink()
                      assert not path.exists(), f'Stale native build output remains: {path}'
          PYCODE
      - name: Validate bilingual keys and guard semantics
        run: |
          python3 scripts/test-i18n.py
          python3 scripts/check-i18n.py
      - name: Run focused actual App copy boundary test
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/content-copy
          rustc -vV | tee artifacts/content-copy/rustc.log
          cargo test --locked -p app --lib drawer_i18n_restored_draft_retains_attribute_warning -- --nocapture 2>&1 | tee artifacts/content-copy/test.log
          python3 -c "import pathlib,re; log=pathlib.Path('artifacts/content-copy/test.log').read_text(); assert re.search(r'test result: ok\. 1 passed; 0 failed; 0 ignored;',log), 'Expected one actual App bilingual copy test'"
      - name: Record native link state on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts/content-copy
          python3 - <<'PY'
          from pathlib import Path
          lines = []
          for output in Path('target/debug/build').glob('sherpa-onnx-sys-*/output'):
              lines.append(str(output))
              lines.extend(line for line in output.read_text().splitlines()
                           if line.startswith(('cargo:rustc-link-search=', 'cargo:rerun-if-changed=')))
          lines.extend(str(path) for path in Path('target/sherpa-onnx-prebuilt').glob('*/lib/*'))
          Path('artifacts/content-copy/native-link-state.txt').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: content-copy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/content-copy/
          retention-days: 14
          if-no-files-found: error
