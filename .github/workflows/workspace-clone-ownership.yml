name: Workspace clone ownership
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths:
      - 'crates/workspace/src/git_clone/**'
      - 'crates/workspace/tests/unit/git_clone_target_ownership.rs'
      - '.github/workflows/workspace-clone-ownership.yml'
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-contracts
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Record the actual compiler
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/clone-ownership
          rustc -vV | tee artifacts/clone-ownership/rustc.log
      - name: Require clone target ownership independently of integration test compilation
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p workspace --lib clone_target_cleanup -- --nocapture 2>&1 | tee artifacts/clone-ownership/ownership.log
      - name: Require the complete workspace test harness
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p workspace -- --nocapture 2>&1 | tee artifacts/clone-ownership/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clone-ownership-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/clone-ownership/
          if-no-files-found: error
          retention-days: 3
