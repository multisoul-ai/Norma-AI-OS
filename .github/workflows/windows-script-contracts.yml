name: Windows script contracts

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-feasibility-*', 'codex/windows-audio-*']
    paths:
      - '.github/workflows/windows-script-contracts.yml'
      - 'scripts/windows/**'
      - 'scripts/test-windows-*.py'
      - '.gitattributes'
      - 'scripts/prepare-release-media.py'
      - 'scripts/check-i18n.py'
      - 'packaging/media/**'

permissions:
  contents: read

concurrency:
  group: windows-script-contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  script-contracts:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test report and package validation through their public interfaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-script-contracts | Out-Null
          python scripts/test-windows-probe.py 2>&1 | Tee-Object artifacts/windows-script-contracts/report-tests.log
          $report = $LASTEXITCODE
          python scripts/test-windows-package.py 2>&1 | Tee-Object artifacts/windows-script-contracts/package-tests.log
          $package = $LASTEXITCODE
          python scripts/test-windows-release-media.py 2>&1 | Tee-Object artifacts/windows-script-contracts/media-tests.log
          $media = $LASTEXITCODE
          python -X utf8=0 scripts/check-i18n.py 2>&1 | Tee-Object artifacts/windows-script-contracts/i18n-native-encoding.log
          $i18n = $LASTEXITCODE
          pwsh -NoProfile -File scripts/windows/test-desktop-driver.ps1 2>&1 | Tee-Object artifacts/windows-script-contracts/desktop-driver.log
          $desktop = $LASTEXITCODE
          @{ source_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; report_exit = $report; package_exit = $package; media_exit = $media; i18n_exit = $i18n; desktop_exit = $desktop } | ConvertTo-Json | Set-Content artifacts/windows-script-contracts/report.json
          if ($report -ne 0 -or $package -ne 0 -or $media -ne 0 -or $i18n -ne 0 -or $desktop -ne 0) { exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-script-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/windows-script-contracts/
          retention-days: 14
          if-no-files-found: error

