name: Freeze product-feature keyboard probe lock
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths: ['.github/workflows/windows-keyboard-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - name: Resolve the changed feature graph without upgrading product dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/keyboard-lock
          cargo update --workspace --manifest-path crates/app/tests/keyboard_probe/Cargo.toml 2>&1 | tee artifacts/keyboard-lock/resolution.log
          python3 scripts/check-probe-lock.py Cargo.lock crates/app/tests/keyboard_probe/Cargo.lock
          cp crates/app/tests/keyboard_probe/Cargo.lock artifacts/keyboard-lock/Cargo.lock
          git diff -- crates/app/tests/keyboard_probe/Cargo.lock > artifacts/keyboard-lock/lock.diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: keyboard-product-lock-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/keyboard-lock/
          if-no-files-found: error
          retention-days: 3
