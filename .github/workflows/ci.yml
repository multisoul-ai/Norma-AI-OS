name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-checks:
    name: rust checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Max Rust source file line count
        run: bash scripts/check-max-file-lines.sh

      - name: No #[allow] in Rust source
        run: bash scripts/check-no-allow.sh

      - name: Agent guide line count
        run: bash scripts/check-agent-guide-lines.sh

      - name: Agent guide lint tests
        run: bash scripts/test-check-agent-guide-lines.sh

      - name: Video wallpaper performance guardrail
        run: python3 scripts/check-video-wallpaper-performance.py

      - name: SOCKS proxy support
        run: bash scripts/check-socks-proxy-support.sh

      - name: Domain contract consistency
        run: |
          python3 scripts/test-check-domain-contracts.py
          python3 scripts/check-domain-contracts.py

      - name: Check
        run: cargo check --workspace

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
