name: GPUI test context resource contracts
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths: ['crates/ui/tests/gpui_test_lifecycle.rs', 'vendor/gpui-0.2.2/src/app/test_context.rs', '.github/workflows/gpui-test-context.yml']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  lifecycle:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-port-macos-regression-native-watch-v2
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Require window resource release at root test scope exit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/lifecycle
          cargo test --locked -p ui --test gpui_test_lifecycle -- --nocapture 2>&1 | tee artifacts/lifecycle/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gpui-lifecycle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lifecycle/
          if-no-files-found: error
          retention-days: 3
