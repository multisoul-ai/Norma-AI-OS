name: Native browser event generation contracts
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-audio-*']
    paths: ['crates/app/src/app/browser/generation.rs', 'crates/norma/tests/app_browser_generation_platform.rs', '.github/workflows/windows-browser-contracts.yml']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  generation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-native-audio
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Reject queued stale browser deliveries at consumption
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/browser-generation
          cargo test --locked -p norma --test app_browser_generation_platform -- --nocapture 2>&1 | tee artifacts/browser-generation/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-generation-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-generation/
          if-no-files-found: error
          retention-days: 3
