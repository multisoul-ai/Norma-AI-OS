name: Windows port macOS regression fixes
on:
  workflow_dispatch:
    inputs:
      full_app:
        description: Run the complete macOS App test harness after the focused regressions
        type: boolean
        default: false
  push:
    branches: ['codex/windows-audio-*']
    paths: ['crates/app/tests/unit/voice_settings_redesign_tests.rs', 'vendor/gpui-0.2.2/src/app/test_context.rs', 'scripts/check-norma-qr.swift', 'crates/app/src/mobile/qr.rs', 'crates/runtime/tests/opencode_foreground.rs', 'crates/runtime/tests/support/opencode_foreground.rs']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
jobs:
  focused-regression:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          lfs: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-port-macos-regression-native-watch-v2
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt-${{ runner.os }}-${{ runner.arch }}-1.13.3-static
      - name: Require original foreground and exact QR round trip
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/macos-fixes
          rustc -vV | tee artifacts/macos-fixes/rustc.log
          cargo test --locked -p app --lib native_qr_pixels_round_trip_through_vision -- --nocapture 2>&1 | tee artifacts/macos-fixes/qr.log
      - name: Require original foreground session and receipt history
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p runtime --test opencode_foreground -- --nocapture 2>&1 | tee artifacts/macos-fixes/foreground.log
      - name: Reproduce Azure source click independently of the full suite
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p app --lib voice_redesign_task_layout_and_mode_persistence -- --nocapture 2>&1 | tee artifacts/macos-fixes/azure.log
      - name: Require the complete macOS App regression harness
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_app
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast -p app --lib 2>&1 | tee artifacts/macos-fixes/app-full.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-fixes-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/macos-fixes/
          if-no-files-found: error
          retention-days: 3
