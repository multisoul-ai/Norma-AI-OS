# 本地签名测试配置：ad-hoc 签名（"-"），不 bump 版本；before-packaging-command 会重新构建 production-data 二进制，禁止复用 target/release 里可能是 Test 数据的旧产物。
# 用法：cargo packager -c Packager.dev.toml
# 真实发版走 Packager.toml（阶段 0 启用 signing-identity 后）。
name = "app"
product-name = "Norma OS"
version = "0.1.77"
identifier = "com.norma.os"
authors = ["multisoul"]
formats = ["app", "dmg"]
icons = ["assets/AppIcon.icns"]
out-dir = "build/dev"
binaries-dir = "."
before-packaging-command = "scripts/prepare-release-media.sh --local-test && scripts/prepare-sparkle.sh && scripts/prepare-app-icon.sh && scripts/prepare-release-info-plist.sh && cargo build --release -p app --no-default-features --features production-data && cargo build --release -p norma --bins"
resources = [
  "THIRD_PARTY_NOTICES.md",
  "build/icons/Assets.car",
  { src = "packaging/macos/en.lproj", target = "en.lproj" },
  { src = "packaging/macos/zh-CN.lproj", target = "zh-CN.lproj" },
  { src = "crates/app/assets/home", target = "home" },
  { src = "crates/app/assets/boot", target = "boot" },
  { src = "build/release-media/wallpapers", target = "wallpapers" },
  { src = "build/release-media/feature-guide", target = "feature-guide" },
  { src = "build/release-media/wallpaper-previews", target = "wallpaper-previews" },
  "build/release-media/media-catalog.json",
  "crates/app/assets/browser-auth-extension",
]

[dmg]
background = "assets/dmg-background.png"
window-size = { width = 640, height = 400 }
# Finder renders 16pt item labels below these anchors. y=175 keeps both labels
# inside their wells without touching the bottom border; y=200 overlaps it.
app-position = { x = 180, y = 175 }
application-folder-position = { x = 460, y = 175 }

[[binaries]]
path = "target/release/norma-os"
main = true

[[binaries]]
path = "target/release/multisoul-agent-hook"
main = false

[[binaries]]
path = "target/release/norma"
main = false

[[binaries]]
path = "target/release/norma-browser-auth-host"
main = false

[macos]
frameworks = ["build/sparkle/Sparkle.framework"]
minimum-system-version = "12.0"
info-plist-path = "build/packaging/Info.plist"
signing-identity = "-"
entitlements = "packaging/macos/NormaOS.entitlements"
