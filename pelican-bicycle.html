<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鹈鹕的海边骑行</title>
    <style>
      :root {
        color-scheme: light;
        background: #e7e0d2;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      svg {
        display: block;
        width: min(100vw, 1500px, 157.89vh);
        height: auto;
        filter: drop-shadow(0 24px 40px #385d6140);
      }

      .outline { stroke: #24515a; stroke-linecap: round; stroke-linejoin: round; }
      .clouds { animation: drift 32s linear infinite alternate; }
      .wind { animation: breeze 2.4s ease-in-out infinite; }
      .wind-two { animation-delay: -1.2s; }
      .scarf { transform-origin: 602px 297px; animation: flutter 1.7s ease-in-out infinite; }
      .road-mark { animation: roll-road 1.7s linear infinite; }

      @keyframes drift { to { transform: translateX(85px); } }
      @keyframes breeze {
        0%, 100% { opacity: .15; transform: translateX(18px); }
        45% { opacity: .7; transform: translateX(-18px); }
      }
      @keyframes flutter {
        0%, 100% { transform: rotate(-5deg); }
        50% { transform: rotate(7deg); }
      }
      @keyframes roll-road { to { stroke-dashoffset: -100; } }

      @media (prefers-reduced-motion: reduce) {
        .clouds, .wind, .scarf, .road-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="scene-title scene-description">
      <title id="scene-title">鹈鹕骑自行车</title>
      <desc id="scene-description">一只戴着围巾的白色鹈鹕沿海边骑车，车轮和脚踏持续转动，远处是灯塔、海浪与缓缓飘动的云。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1">
          <stop offset="0" stop-color="#add9de" />
          <stop offset="1" stop-color="#d9ebe2" />
        </linearGradient>
        <linearGradient id="road" x2="0" y2="1">
          <stop offset="0" stop-color="#e6ca9d" />
          <stop offset="1" stop-color="#d4aa7e" />
        </linearGradient>
        <g id="wheel-art">
          <circle r="96" fill="#fbf8ed" stroke="#24515a" stroke-width="14" />
          <circle r="80" fill="none" stroke="#8caeaa" stroke-width="3" />
          <path d="M-79 0H79 M0-79V79 M-56-56 56 56 M-56 56 56-56 M-30-74 30 74 M-74-30 74 30 M-74 30 74-30 M-30 74 30-74" fill="none" stroke="#90aaa4" stroke-width="2.4" />
          <circle r="13" fill="#f2a96e" stroke="#24515a" stroke-width="5" />
        </g>
      </defs>

      <rect width="1200" height="760" fill="url(#sky)" />
      <circle cx="945" cy="133" r="69" fill="#f6d994" opacity=".94" />
      <circle cx="945" cy="133" r="90" fill="none" stroke="#fff1c8" stroke-width="2" opacity=".65" />

      <g class="clouds" fill="#fbf8ed" opacity=".82">
        <path d="M97 159c18-18 47-17 61 0 14-29 57-31 75-4 26-7 49 8 51 28H85c-9-8-3-19 12-24Z" />
        <path d="M809 231c14-13 33-12 43 1 13-21 45-23 59-2 19-5 36 8 37 21H795c-7-7 0-17 14-20Z" />
      </g>

      <path d="M0 395c111-42 198-36 309 10 87-48 204-51 312 11 133-46 259-39 385 5 67-34 131-41 194-31v180H0Z" fill="#93b9a3" />
      <path d="M0 453c139-29 261-6 387 27 147-57 271-42 412 16 129-40 264-25 401 9v116H0Z" fill="#6f9f98" />
      <path d="M0 504c213 13 330 40 473 15 170-27 325 33 475 11 102-15 180-8 252 6v84H0Z" fill="#76afb3" />
      <path d="M0 553c192-9 358 17 533 9 214-11 456-21 667 13" fill="none" stroke="#e5f0dc" stroke-width="5" opacity=".72" />
      <path d="M62 574c81-8 121-5 178 0m521-18c73-10 107-10 155-2m123 23c46-2 69-1 100 2" fill="none" stroke="#e5f0dc" stroke-width="4" stroke-linecap="round" opacity=".65" />

      <g transform="translate(105 315)">
        <path d="M-24 183h75l-8-146h-59Z" fill="#fff6df" class="outline" stroke-width="5" />
        <path d="M-16 99h58l-3-62h-52Z" fill="#e8866e" />
        <path d="M-26 38 13 9l42 29Z" fill="#d0675b" class="outline" stroke-width="5" />
        <rect x="2" y="-13" width="22" height="22" rx="2" fill="#fff6df" class="outline" stroke-width="4" />
        <path d="M-22 183h80" fill="none" class="outline" stroke-width="7" />
        <circle cx="13" cy="68" r="9" fill="#6a9a9a" class="outline" stroke-width="3" />
      </g>

      <path d="M0 584c135-28 228-24 325 10 128-32 259-19 377 12 178-32 349-37 498-3v157H0Z" fill="#e0c393" />
      <path d="M0 615c150-14 293-6 400 21 185-21 301-13 438 15 128-13 246-11 362 13v96H0Z" fill="url(#road)" />
      <path d="M0 652H1200" fill="none" stroke="#b67f62" stroke-width="5" opacity=".45" />
      <path class="road-mark" d="M-100 707H1300" fill="none" stroke="#fff5d9" stroke-width="7" stroke-linecap="round" stroke-dasharray="55 45" opacity=".84" />
      <g fill="none" stroke="#4a8175" stroke-width="4" stroke-linecap="round" opacity=".85">
        <path d="M42 588q-10-20-15-24m15 24q7-27 18-34m1002 49q-10-25-19-33m19 33q13-28 24-33m83 44q-7-16-15-22m15 22q8-25 17-29" />
      </g>

      <ellipse cx="592" cy="662" rx="330" ry="15" fill="#805d4f" opacity=".22" />
      <g class="wind" fill="none" stroke="#fff8e7" stroke-width="5" stroke-linecap="round" opacity=".7">
        <path d="M264 300h-58m39 19h-79" />
      </g>
      <g class="wind wind-two" fill="none" stroke="#fff8e7" stroke-width="4" stroke-linecap="round" opacity=".65">
        <path d="M341 265h-55m-12 17h-39" />
      </g>

      <g id="rear-wheel" transform="translate(424 556)"><use href="#wheel-art" /></g>
      <g id="front-wheel" transform="translate(758 556)"><use href="#wheel-art" /></g>

      <g fill="none" class="outline" stroke-width="11">
        <path d="M424 556 526 446 560 552 424 556M526 446 680 450 560 552" stroke="#19818b" />
        <path d="M680 450 758 556" stroke="#e98768" stroke-width="12" />
        <path d="M680 450 665 414h32" stroke="#24515a" stroke-width="9" />
        <path d="M526 446 519 427" stroke="#24515a" stroke-width="8" />
      </g>
      <path d="M491 429q30-10 62-2c-2 10-13 16-26 16h-29q-10-3-7-14Z" fill="#24515a" />
      <path d="M693 404q11 0 12 10" fill="none" class="outline" stroke-width="7" />
      <circle cx="560" cy="552" r="27" fill="#f4c771" class="outline" stroke-width="6" />

      <path id="far-leg" d="" fill="none" stroke="#d98069" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <g id="far-foot"><path d="M-15-5q14-8 31 0l6 8q-13 9-34 3Z" fill="#e7a17c" class="outline" stroke-width="4" /></g>

      <g id="pelican">
        <path d="M465 366q-41-17-69-5 21 9 31 25-13 4-22 16 27 6 62-7" fill="#f7f0df" class="outline" stroke-width="5" />
        <path d="M451 338c35-31 92-34 131-3 28 22 35 62 14 83-24 25-81 30-124 10-41-20-56-62-21-90Z" fill="#fff9e9" class="outline" stroke-width="6" />
        <path d="M546 358c37-15 63-37 66-68 3-17-6-29-5-45" fill="none" class="outline" stroke-width="54" />
        <path d="M546 358c37-15 63-37 66-68 3-17-6-29-5-45" fill="none" stroke="#fff9e9" stroke-width="47" stroke-linecap="round" />
        <ellipse cx="635" cy="237" rx="47" ry="43" fill="#fff9e9" class="outline" stroke-width="6" />
        <path d="M674 258q41 17 144 5c-7 18-24 23-39 38-11 11-13 40-39 46-27 7-45-38-66-89Z" fill="#e99270" class="outline" stroke-width="5" />
        <path d="M664 237q87-4 171 25-39 15-89 13-51-1-83-12Z" fill="#f4bd76" class="outline" stroke-width="5" />
        <path d="M750 270q45 4 83-8" fill="none" stroke="#cf8064" stroke-width="3" stroke-linecap="round" />
        <circle cx="653" cy="232" r="7" fill="#24515a" />
        <circle cx="655" cy="229" r="2" fill="#fff9e9" />
        <path d="M599 205q-1-16 10-27 0 15 10 21m3-7q8-16 18-19-4 16-2 22" fill="#fff9e9" class="outline" stroke-width="4" />
        <g class="scarf">
          <path d="M585 286q25 12 47 2l6 16q-29 17-57-1Z" fill="#d97563" class="outline" stroke-width="4" />
          <path d="M591 298q-34 4-64-23 8 30 42 41 14 4 30-1Z" fill="#e98768" class="outline" stroke-width="4" />
          <path d="M546 287q11 11 24 14" fill="none" stroke="#f7c08e" stroke-width="4" stroke-linecap="round" />
        </g>
        <path d="M496 346c24-11 51 2 69 24 20 24 55 34 91 35q12 0 12 10-1 8-14 9-65 3-110-25-45-2-60-26c-8-13-4-22 12-27Z" fill="#f5eddc" class="outline" stroke-width="5" />
        <path d="M514 359q35 22 47 48m-60-34q16 18 34 23" fill="none" stroke="#d9d7c8" stroke-width="4" stroke-linecap="round" />
      </g>

      <path id="near-leg" d="" fill="none" stroke="#e89570" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      <g id="crank" fill="none" class="outline" stroke-width="7">
        <path d="M560 552V514m0 38v38" />
        <path d="M542 514h36m-36 76h36" stroke-width="8" />
      </g>
      <g id="near-foot"><path d="M-16-5q17-8 33 0l8 9q-17 9-38 3Z" fill="#f2a176" class="outline" stroke-width="4" /></g>

      <text x="60" y="82" fill="#24515a" font-family="Georgia, 'Times New Roman', serif" font-size="37" font-style="italic" letter-spacing="-1">The long way home</text>
      <text x="62" y="108" fill="#48777b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4">A PELICAN ON TWO WHEELS</text>
      <text x="1080" y="724" fill="#7c6654" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" text-anchor="end">a seaside loop · 01</text>
    </svg>

    <script>
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const rearWheel = document.getElementById('rear-wheel');
      const frontWheel = document.getElementById('front-wheel');
      const crank = document.getElementById('crank');
      const pelican = document.getElementById('pelican');
      const nearLeg = document.getElementById('near-leg');
      const farLeg = document.getElementById('far-leg');
      const nearFoot = document.getElementById('near-foot');
      const farFoot = document.getElementById('far-foot');
      let started = performance.now();
      let frame = 0;

      function draw(now) {
        const angle = reduceMotion.matches ? -Math.PI / 2 : (now - started) * Math.PI * 2 / 1700 - Math.PI / 2;
        const degrees = (angle + Math.PI / 2) * 180 / Math.PI;
        const bob = reduceMotion.matches ? 0 : Math.sin(angle * 2) * 3;
        const foot = (phase) => ({ x: 560 + Math.cos(phase) * 38, y: 552 + Math.sin(phase) * 38 });
        const near = foot(angle);
        const far = foot(angle + Math.PI);

        rearWheel.setAttribute('transform', `translate(424 556) rotate(${degrees})`);
        frontWheel.setAttribute('transform', `translate(758 556) rotate(${degrees})`);
        crank.setAttribute('transform', `rotate(${degrees} 560 552)`);
        pelican.setAttribute('transform', `translate(0 ${bob})`);
        farLeg.setAttribute('d', `M548 ${412 + bob} Q${far.x - 20} ${461 + bob} ${far.x} ${far.y}`);
        nearLeg.setAttribute('d', `M520 ${414 + bob} Q${near.x + 26} ${464 + bob} ${near.x} ${near.y}`);
        farFoot.setAttribute('transform', `translate(${far.x} ${far.y})`);
        nearFoot.setAttribute('transform', `translate(${near.x} ${near.y})`);
        frame = reduceMotion.matches ? 0 : requestAnimationFrame(draw);
      }

      draw(started);
      reduceMotion.addEventListener('change', () => {
        cancelAnimationFrame(frame);
        started = performance.now();
        draw(started);
      });
    </script>
  </body>
</html>
