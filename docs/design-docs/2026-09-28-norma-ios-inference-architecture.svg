<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">已否定的 Mac 推理方案，仅供历史参考</title>
  <desc id="desc">这张旧图让 Mac 承担手机 Norma 推理，用户已提出改为手机端对接云模型。旧图不作为实施依据。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="17" flood-color="#25384c" flood-opacity=".09"/>
    </filter>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#2876c7"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#21846d"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #17263a; }
      .muted { fill: #5e6e81; }
      .card { fill: #fff; stroke: #dce5ef; stroke-width: 1.5; filter: url(#shadow); }
      .inner { fill: #f5f8fc; stroke: #e8eef5; stroke-width: 1; }
      .small { font-size: 17px; }
      .body { font-size: 18px; }
      .strong { font-size: 20px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#f8fafc"/>
  <circle cx="1382" cy="18" r="205" fill="#eaf3ff" opacity=".72"/>
  <circle cx="-36" cy="956" r="210" fill="#e9f6f2" opacity=".7"/>

  <text x="70" y="87" class="ink" font-size="38" font-weight="730">Norma 如何在 iPhone 与 Mac 之间工作</text>
  <text x="72" y="127" class="muted" font-size="20">旧方案，仅供历史参考：手机保存状态；每轮选择 Mac 推理。当前已转向手机对接云模型。</text>
  <rect x="1141" y="62" width="229" height="43" rx="21.5" fill="#e9f2ff" stroke="#c9dffb"/>
  <circle cx="1167" cy="83.5" r="6" fill="#2876c7"/>
  <text x="1183" y="90" fill="#245f9e" font-size="17" font-weight="650">旧推理方案 · 已否定</text>

  <!-- Mac A -->
  <rect class="card" x="70" y="180" width="370" height="390" rx="28"/>
  <rect x="94" y="207" width="55" height="55" rx="16" fill="#e9f2ff"/>
  <text x="112" y="243" fill="#2876c7" font-size="27" font-weight="760">A</text>
  <text x="164" y="228" class="ink" font-size="27" font-weight="700">Mac A</text>
  <text x="164" y="255" class="muted small">移动端项目所在电脑</text>
  <rect class="inner" x="94" y="287" width="322" height="94" rx="17"/>
  <text x="113" y="318" class="ink strong">可承担 Norma 推理</text>
  <text x="113" y="349" class="muted small">在线、已授权且已配置模型时</text>
  <rect class="inner" x="94" y="394" width="322" height="99" rx="17"/>
  <text x="113" y="425" class="ink strong">执行 iOS 项目任务</text>
  <text x="113" y="456" class="muted small">Agent 会话、终端与真实回执留本机</text>
  <text x="96" y="538" fill="#2876c7" font-size="17" font-weight="600">项目身份：Mac A + iOS 项目 ID</text>

  <!-- iPhone -->
  <rect class="card" x="510" y="180" width="420" height="440" rx="30"/>
  <rect x="535" y="207" width="55" height="55" rx="16" fill="#e7f6f0"/>
  <rect x="553" y="218" width="19" height="34" rx="4" fill="none" stroke="#21846d" stroke-width="3"/>
  <circle cx="562.5" cy="247" r="1.8" fill="#21846d"/>
  <text x="606" y="228" class="ink" font-size="27" font-weight="700">这部 iPhone</text>
  <text x="606" y="255" class="muted small">用户的协作中枢</text>
  <rect x="535" y="287" width="370" height="96" rx="17" fill="#eff8f4" stroke="#d9ede5"/>
  <text x="554" y="318" class="ink strong">长期保存在手机</text>
  <text x="554" y="348" class="muted small">想法、Workspace、线程、Norma 对话</text>
  <rect class="inner" x="535" y="396" width="370" height="87" rx="17"/>
  <text x="554" y="427" class="ink strong">每轮选择推理 Mac</text>
  <text x="554" y="457" class="muted small">发送有界上下文，接收回复和派工意图</text>
  <rect class="inner" x="535" y="496" width="370" height="87" rx="17"/>
  <text x="554" y="527" class="ink strong">按项目路由并核对</text>
  <text x="554" y="557" class="muted small">待发操作、真实回执与同步游标</text>

  <!-- Mac B -->
  <rect class="card" x="1000" y="180" width="370" height="390" rx="28"/>
  <rect x="1024" y="207" width="55" height="55" rx="16" fill="#f0eefe"/>
  <text x="1042" y="243" fill="#7565c7" font-size="27" font-weight="760">B</text>
  <text x="1094" y="228" class="ink" font-size="27" font-weight="700">Mac B</text>
  <text x="1094" y="255" class="muted small">服务端项目所在电脑</text>
  <rect class="inner" x="1024" y="287" width="322" height="94" rx="17"/>
  <text x="1043" y="318" class="ink strong">执行 API 项目任务</text>
  <text x="1043" y="349" class="muted small">Agent、项目文件与真实回执留本机</text>
  <rect class="inner" x="1024" y="394" width="322" height="99" rx="17"/>
  <text x="1043" y="425" class="ink strong">也可承担 Norma 推理</text>
  <text x="1043" y="456" class="muted small">前提同样是在线、授权、模型可用</text>
  <text x="1026" y="538" fill="#7565c7" font-size="17" font-weight="600">项目身份：Mac B + API 项目 ID</text>

  <!-- Direction of communication; numbered circles map to the example below. -->
  <path d="M 504 325 H 448" stroke="#2876c7" stroke-width="3" fill="none" marker-end="url(#blue-arrow)"/>
  <circle cx="476" cy="308" r="15" fill="#e9f2ff" stroke="#c9dffb"/>
  <text x="470.5" y="314" fill="#245f9e" font-size="16" font-weight="700">1</text>
  <path d="M 448 443 H 504" stroke="#21846d" stroke-width="3" fill="none" marker-end="url(#green-arrow)"/>
  <circle cx="476" cy="426" r="15" fill="#e7f6f0" stroke="#cce8dc"/>
  <text x="470.5" y="432" fill="#1c725e" font-size="16" font-weight="700">2</text>
  <path d="M 936 345 H 994" stroke="#2876c7" stroke-width="3" fill="none" marker-end="url(#blue-arrow)"/>
  <circle cx="965" cy="328" r="15" fill="#e9f2ff" stroke="#c9dffb"/>
  <text x="959.5" y="334" fill="#245f9e" font-size="16" font-weight="700">3</text>
  <path d="M 994 463 H 936" stroke="#21846d" stroke-width="3" fill="none" marker-end="url(#green-arrow)"/>
  <circle cx="965" cy="446" r="15" fill="#e7f6f0" stroke="#cce8dc"/>
  <text x="959.5" y="452" fill="#1c725e" font-size="16" font-weight="700">4</text>

  <!-- Concrete scenario -->
  <rect x="70" y="662" width="1300" height="237" rx="28" fill="#fff" stroke="#dce5ef" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="704" class="ink" font-size="24" font-weight="700">例子：在「移动端体验」工作线程说“改进首屏交接，iOS 和 API 都要处理”</text>
  <text x="101" y="732" class="muted small">手机先落消息；Mac A 返回 Norma 的回复与派工意图；手机再把两项任务分别送给项目所属电脑。</text>

  <rect x="99" y="753" width="279" height="111" rx="17" fill="#eff8f4" stroke="#d9ede5"/>
  <text x="117" y="783" fill="#1c725e" class="small" font-weight="720">① 手机 → Mac A</text>
  <text x="117" y="811" class="ink" font-size="17">发送目标、约束及线程摘要</text>
  <text x="117" y="839" class="muted" font-size="16">只取本轮需要的上下文</text>

  <rect x="406" y="753" width="279" height="111" rx="17" fill="#eef5ff" stroke="#dceafb"/>
  <text x="424" y="783" fill="#245f9e" class="small" font-weight="720">② Mac A → 手机</text>
  <text x="424" y="811" class="ink" font-size="17">返回 Norma 回复和派工意图</text>
  <text x="424" y="839" class="muted" font-size="16">意图不是任务已完成</text>

  <rect x="713" y="753" width="279" height="111" rx="17" fill="#eef5ff" stroke="#dceafb"/>
  <text x="731" y="783" fill="#245f9e" class="small" font-weight="720">③ 手机 → Mac A / B</text>
  <text x="731" y="811" class="ink" font-size="17">iOS 交给 A，API 交给 B</text>
  <text x="731" y="839" class="muted" font-size="16">各自重新校验授权与约束</text>

  <rect x="1020" y="753" width="321" height="111" rx="17" fill="#eff8f4" stroke="#d9ede5"/>
  <text x="1038" y="783" fill="#1c725e" class="small" font-weight="720">④ Mac A / B → 手机</text>
  <text x="1038" y="811" class="ink" font-size="17">回传真实接收、进展和成果</text>
  <text x="1038" y="839" class="muted" font-size="16">手机归入同一线程并长期保存</text>

  <rect x="70" y="927" width="1300" height="49" rx="15" fill="#eaf0f7"/>
  <circle cx="100" cy="951.5" r="6" fill="#607892"/>
  <text x="117" y="958" fill="#42576d" font-size="17">Mac A 离线而 Mac B 可推理：改选 B；两台都不可用：手机保留消息并显示待发送，不能显示已回复或已派工。</text>
</svg>
