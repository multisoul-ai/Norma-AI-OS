      agentD: { type: 'agent', title: 'Agent D', branch: 'release', engine: 'Codex', lines: ['Optimizing performance…', '☑ Lighthouse audit', '☑ Fix image optimization', '□ Deploy to production'] },
      previewD: { type: 'preview', title: 'Preview', url: 'https://norma.dev', hero: 'AI workspaces', sub: 'For real work.' },
      agentF: { type: 'agent', title: 'Agent F', branch: 'content', engine: 'Claude Code', lines: ['Updating content pipeline…', '☑ Process new blog posts', '□ Publish to production'] },
      terminalF: { type: 'terminal', title: 'Terminal', lines: ['~/projects/content (main) $', 'npm run publish', '✓ 12 posts published', '✓ Sitemap updated'] },
      agentH: { type: 'agent', title: 'Agent H', branch: 'research', engine: 'Codex', lines: ['Analyzing research papers…', '✓ Process 127 papers', '✓ Generate embeddings', '□ Create summaries'] },
      dataH: { type: 'data', title: 'Data', lines: ['Embedding space (127 / 127)', '6 clusters · 3 outliers'] },
      agentI: { type: 'agent', title: 'Agent I', branch: 'lab', engine: 'OpenCode', lines: ['Running experiments…', '✓ Train model variant', '□ Evaluate results', '□ Compare baseline'] },
      notebookI: { type: 'notebook', title: 'Notebook', lines: ['Agent Behavior Analysis', 'baseline → experiment'] },
      agentJ: { type: 'agent', title: 'Agent J', branch: 'notes', engine: 'Gemini', lines: ['Organizing notes…', '✓ Extract key ideas', '□ Build knowledge graph'] },
      notesJ: { type: 'notes', title: 'Notes', lines: ['Ideas for Norma', 'Workspace overview', 'Agent memory', 'Cross-workspace search'] },
      agentK: { type: 'agent', title: 'Agent K', branch: 'personal', engine: 'Claude Code', lines: ['Planning next trip…', '✓ Research destinations', '□ Book flights'] },
      todoK: { type: 'todo', title: 'Todo', lines: ['Gym', 'Read', 'Plan Japan trip', 'Renew passport'] }
    };
    const workspaces = [
      { id: 'w1', title: 'Norma OS', color: '#28decd', projects: [
        { id: 'a', title: 'Project A', path: 'norma-ai-os', color: '#9868f4', cards: ['agentA','terminalA','browserA'] },
        { id: 'b', title: 'Project B', path: 'ai-core', color: '#4edc82', cards: ['agentC','previewB'] }
      ]},
      { id: 'w2', title: 'Launch', color: '#438df5', projects: [
        { id: 'a', title: 'Project A', path: 'norma-ai-os', color: '#9868f4', cards: ['agentE','terminalE'] },
        { id: 'c', title: 'Project C', path: 'marketing-site', color: '#e6bd4c', cards: ['agentG','previewC'] }
      ]},
      { id: 'w3', title: 'Website Release', color: '#9763ef', projects: [
        { id: 'd', title: 'Project Web', path: 'norma.dev', color: '#4edc82', cards: ['agentD','previewD'] },
        { id: 'e', title: 'Project CMS', path: 'content', color: '#f5894d', cards: ['agentF','terminalF'] }
      ]},
      { id: 'w4', title: 'Research Lab', color: '#f0c84d', projects: [
        { id: 'f', title: 'Project Papers', path: 'research', color: '#9868f4', cards: ['agentH','dataH'] },
        { id: 'g', title: 'Project Experiments', path: 'lab', color: '#4edc82', cards: ['agentI','notebookI'] }
      ]},
      { id: 'w5', title: 'Personal', color: '#f37082', projects: [
        { id: 'h', title: 'Project Notes', path: 'knowledge', color: '#62abff', cards: ['agentJ','notesJ'] },
        { id: 'i', title: 'Project Life', path: 'personal', color: '#f5894d', cards: ['agentK','todoK'] }
      ]}
    ];
    const scene = document.getElementById('scene');
    const world = document.getElementById('world');
    const note = document.getElementById('viewNote');
    const toast = document.getElementById('toast');
    const motionReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const camera = { x: 0, y: 0, s: 1, vx: 0, vy: 0, vs: 0, tx: 0, ty: 0, ts: 1, raf: 0, last: 0 };
    const state = { mode: 'overview', workspace: 'w1', project: 'a', card: null, previousMode: 'project' };
    let toastTimer;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    }
    function layoutFor(count, index) {
      const base = count === 3 ? [
        [0,0,380,290], [392,0,268,139], [392,151,268,139]
      ] : count === 2 ? [
        [0,0,324,290], [336,0,324,290]
      ] : [[0,0,660,290]];
      const expose = count === 3 ? [
        [0,15,210,250], [225,15,210,250], [450,15,210,250]
      ] : count === 2 ? [
        [16,15,305,250], [339,15,305,250]
      ] : [[95,15,470,250]];
      const [x,y,w,h] = base[index];
      const [ex,ey,ew,eh] = expose[index];
      return `--x:${x}px;--y:${y}px;--w:${w}px;--h:${h}px;--ex:${ex}px;--ey:${ey}px;--ew:${ew}px;--eh:${eh}px`;
    }
    function cardBody(card) {
      if (card.type === 'browser' || card.type === 'preview') {
        const pageName = card.url.includes('localhost:5173') ? 'ai-core' : 'Norma';
        return `<div class="browser-chrome"><span>‹ &nbsp; › &nbsp; ⟳</span><span>⌕ ${escapeHtml(card.url)}</span></div><div class="preview-page"><div class="page-nav"><b>${pageName}</b><span>Product &nbsp; Docs &nbsp; About</span></div><div class="page-hero">${escapeHtml(card.hero).replace(/capable|models|generation|workspaces/gi, match => `<em>${match}</em>`)}</div><div class="page-sub">${escapeHtml(card.sub)}</div></div>`;
      }
      if (card.type === 'data' || card.type === 'notebook') {
        return `<p class="lead">${escapeHtml(card.lines[0])}</p><p class="muted">${escapeHtml(card.lines[1])}</p><div class="data-bars">${[32,47,40,65,53,72,85,64].map(n => `<i style="--bar:${n}px"></i>`).join('')}</div>`;
      }
      if (card.type === 'notes' || card.type === 'todo') {
        return `<p class="lead">${escapeHtml(card.lines[0])}</p><div class="check-list">${card.lines.slice(1).map(line => `<div>${escapeHtml(line)}</div>`).join('')}</div>`;
      }
      const lines = card.type === 'agent' ? [card.engine, ...card.lines] : card.lines;
      return `<div class="term-rows">${lines.map((line, index) => `<p class="${index === 0 ? 'lead' : line.includes('✓') || line.includes('☑') ? 'green' : line.includes('$') ? 'blue' : ''}">${escapeHtml(line)}</p>`).join('')}</div>${card.type === 'agent' ? `<label class="agent-prompt"><span>›</span><input aria-label="${escapeHtml(card.title)} TUI 输入" placeholder="直接在 Agent TUI 输入…" disabled></label>` : ''}`;
    }
    function renderCard(id, count, index) {
      const card = cards[id];
      const color = ({ agent:'#8d67ed',terminal:'#67a8ff',browser:'#f29a54',preview:'#f29a54',data:'#dd9465',notebook:'#af91f3',notes:'#6ba5f2',todo:'#ef9b62' })[card.type];
      return `<article class="live-card" tabindex="0" data-card="${id}" data-kind-label="${escapeHtml(card.type.toUpperCase())}" style="${layoutFor(count,index)};--card-color:${color}"><div class="card-head"><i class="card-icon"></i><span class="card-title">${escapeHtml(card.title)}</span>${card.type === 'agent' ? `<span class="worktree">⌁ ${escapeHtml(card.branch)}</span>` : ''}<span class="ellipsis">···</span></div><div class="card-body">${cardBody(card)}</div></article>`;
    }
    function renderWorld() {
      const sources = [workspaces[0].projects[0], workspaces[0].projects[1], workspaces[1].projects[1]];
      world.innerHTML = workspaces.map((workspace, wi) => {
        const projects = workspace.projects.map((project, pi) => {
          const contents = project.cards.length
            ? project.cards.map((id,ci) => renderCard(id,project.cards.length,ci)).join('')
            : '<div class="empty-project-cards"><strong>空的项目画布</strong><span>此处的卡片与其他工作空间独立</span></div>';
          return `<section class="project" role="button" aria-label="展开 ${escapeHtml(workspace.title)} 中的 ${escapeHtml(project.title)} 画布" tabindex="0" data-project="${project.id}" data-index="${pi}" data-card-count="${project.cards.length}" style="--project-color:${project.color}"><div class="project-head"><i class="project-dot"></i><span class="project-title">${escapeHtml(project.title)}</span><span class="project-path">${escapeHtml(project.path)}</span><button class="project-expand" type="button" aria-label="展开 ${escapeHtml(project.title)}" title="展开项目画布">⤢</button></div><div class="card-stage">${contents}</div></section>`;
        }).join('');
        const available = sources.filter(source => !workspace.projects.some(project => project.id === source.id));
        const addProject = workspace.projects.length < 2
          ? `<div class="project-add" data-index="${workspace.projects.length}"><strong>＋ 添加项目区域</strong><span>选择项目，建立这个工作空间专属的空画布</span><div class="project-add-options">${available.map(source => `<button type="button" data-add-project="${source.id}">${escapeHtml(source.title)} · ${escapeHtml(source.path)}</button>`).join('')}</div></div>`
          : '';
        return `<section class="workspace" role="button" aria-label="进入 W${wi+1} · ${escapeHtml(workspace.title)} 工作空间" tabindex="0" data-workspace="${workspace.id}" style="left:${(wi%3)*1600}px;top:${Math.floor(wi/3)*700}px;--accent:${workspace.color}"><div class="workspace-header"><i class="workspace-dot"></i><div><div class="workspace-name">W${wi+1} · ${escapeHtml(workspace.title)}</div><div class="workspace-meta">${workspace.projects.length} 个项目 · ${workspace.projects.reduce((n,p) => n+p.cards.length,0)} 张实时卡片</div></div><span class="workspace-status">${workspace.projects.length ? wi===0 ? '当前工作空间' : '运行中' : '空画布'}</span></div>${projects}${addProject}<div class="workspace-footer"><strong>一张工作空间画布</strong><span class="line"></span><span>项目区域固定排列 · 卡片保留原位</span></div></section>`;
      }).join('') + (workspaces.length < 6 ? '<button type="button" class="new-workspace" id="newWorkspace"><span class="plus">+</span><strong>新建工作空间</strong><small>从空画布开始</small></button>' : '');
    }
    function workspaceData() { return workspaces.find(w => w.id === state.workspace); }
    function workspaceElement() { return world.querySelector(`[data-workspace="${state.workspace}"]`); }
    function projectElement() { return workspaceElement()?.querySelector(`[data-project="${state.project}"]`); }
    function fit(rect, limit) {
      const width = scene.clientWidth, height = scene.clientHeight;
      const padding = state.mode === 'overview' ? 65 : 0;
      const s = Math.min((width-padding*2)/rect.w, (height-padding*2)/rect.h, limit);
      return { s, x: width/2-(rect.x+rect.w/2)*s, y: height/2-(rect.y+rect.h/2)*s };
    }
    function cameraTarget() {
      if (state.mode === 'overview') return fit({x:0,y:0,w:4720,h:1320},1);
      const ws = workspaceElement();
      const wx = ws.offsetLeft, wy = ws.offsetTop;
      if (state.mode !== 'project') return fit({x:wx,y:wy,w:ws.offsetWidth,h:parseFloat(document.body.style.getPropertyValue('--focus-workspace-height'))},Infinity);
      const project = projectElement();
      const workspaceHeight=parseFloat(document.body.style.getPropertyValue('--focus-workspace-height'));
      const projectHeight=parseFloat(document.body.style.getPropertyValue('--focus-project-height'));
      return fit({x:wx+project.offsetLeft,y:wy+(workspaceHeight-projectHeight)/2,w:870,h:projectHeight},Infinity);
    }
    function paintCamera() { world.style.transform = `translate3d(${camera.x}px,${camera.y}px,0) scale(${camera.s})`; }
    function animateCamera(time) {
      const dt = Math.min((time-(camera.last||time))/1000,.032);
      camera.last = time;
      const omega = 15;
      for (const [value, velocity, target] of [['x','vx','tx'],['y','vy','ty'],['s','vs','ts']]) {
        camera[velocity] += (omega*omega*(camera[target]-camera[value])-2*omega*camera[velocity])*dt;
        camera[value] += camera[velocity]*dt;
      }
      paintCamera();
      if (Math.abs(camera.x-camera.tx)+Math.abs(camera.y-camera.ty) < .2 && Math.abs(camera.s-camera.ts)<.0004 && Math.abs(camera.vx)+Math.abs(camera.vy)<2 && Math.abs(camera.vs)<.01) {
        camera.x=camera.tx; camera.y=camera.ty; camera.s=camera.ts; camera.vx=camera.vy=camera.vs=0; camera.raf=0; paintCamera(); return;
      }
      camera.raf=requestAnimationFrame(animateCamera);
    }
    function aim(immediate=false) {
      const target=cameraTarget(); camera.tx=target.x; camera.ty=target.y; camera.ts=target.s;
      if (immediate || motionReduced.matches) {
        if (camera.raf) cancelAnimationFrame(camera.raf);
        Object.assign(camera,{x:target.x,y:target.y,s:target.s,vx:0,vy:0,vs:0,raf:0,last:0}); paintCamera(); return;
      }
      if (!camera.raf) { camera.last=0; camera.raf=requestAnimationFrame(animateCamera); }
    }
    function showToast(message) {
      toast.textContent=message; toast.classList.add('visible'); clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>toast.classList.remove('visible'),2900);
    }
    function updateView(immediate=false) {
      const ws=workspaceData(); const project=ws.projects.find(p=>p.id===state.project) || ws.projects[0];
      if (!project && state.mode==='project') state.mode='workspace';
      if (!ws.projects.some(p=>p.id===state.project)) state.project=project?.id || null;
      document.body.style.setProperty('--focus-workspace-height',`${1520*scene.clientHeight/scene.clientWidth}px`);
      document.body.style.setProperty('--focus-project-height',`${870*scene.clientHeight/scene.clientWidth}px`);
      document.querySelectorAll('.workspace').forEach(el=>{
        el.classList.toggle('active',el.dataset.workspace===state.workspace);
        el.classList.toggle('show-all-cards',state.mode==='cards' && el.dataset.workspace===state.workspace);
        el.inert=state.mode!=='overview' && el.dataset.workspace!==state.workspace;
      });
      document.querySelectorAll('.project').forEach(el=>{
        const active=state.mode==='project' && el.closest('.workspace').dataset.workspace===state.workspace && el.dataset.project===state.project;
        el.classList.toggle('active',active);
        el.inert=state.mode==='project' && !active;
      });
      document.querySelectorAll('.project-add').forEach(el=>el.inert=state.mode==='project');
      const newWorkspace=document.getElementById('newWorkspace');
      if (newWorkspace) newWorkspace.inert=state.mode!=='overview';
      document.querySelectorAll('.live-card').forEach(el=>el.classList.toggle('selected',state.mode==='project' && el.dataset.card===state.card && el.closest('.workspace').dataset.workspace===state.workspace));
      document.querySelectorAll('.agent-prompt input').forEach(input=>input.disabled=state.mode!=='project' || input.closest('.workspace').dataset.workspace!==state.workspace || input.closest('.project').dataset.project!==state.project);
      const names={overview:'所有工作空间',workspace:`${ws.title} · 工作空间画布`,project:`${ws.title} / ${project?.title} · ${project?.path}`,cards:`${ws.title} · 所有卡片`};
      document.getElementById('breadcrumb').textContent=names[state.mode];
      note.textContent=({overview:'点击工作空间，镜头会进入同一张画布',workspace:'点击项目区域展开；项目与卡片始终留在当前画布',project:'项目画布已展开 · Agent 在卡片内直接输入',cards:'所有卡片在各自项目区域内展开 · 点击卡片返回'})[state.mode];
      document.getElementById('back').disabled=state.mode==='overview';
      document.getElementById('cards').disabled=state.mode==='overview' || ws.projects.every(p=>p.cards.length===0);
      document.getElementById('cards').classList.toggle('active',state.mode==='cards');
      document.getElementById('overview').classList.toggle('active',state.mode==='overview');
      document.getElementById('previous').disabled=state.mode==='overview' || workspaces.indexOf(ws)===0;
      document.getElementById('next').disabled=state.mode==='overview' || workspaces.indexOf(ws)===workspaces.length-1;
      document.getElementById('projectStrip').innerHTML=state.mode==='overview' ? '' : ws.projects.map(p=>`<button type="button" class="project-chip ${state.mode==='project' && state.project===p.id ? 'active':''}" data-quick-project="${p.id}">${escapeHtml(p.title)}</button>`).join('');
      document.body.dataset.view=state.mode;
      aim(immediate);
    }
    function openWorkspace(id) { state.workspace=id; state.project=workspaceData().projects[0]?.id || null; state.card=null; state.mode='workspace'; updateView(); }
    function openProject(id, card=null) { state.project=id; state.card=card; state.mode='project'; updateView(); }
    function showCards() {
      if (state.mode==='overview' || workspaceData().projects.every(p=>p.cards.length===0)) return;
      if (state.mode==='cards') { state.mode=state.previousMode; updateView(); return; }
      state.previousMode=state.mode; state.mode='cards'; updateView();
    }
    function back() {
      if (state.mode==='project') state.mode='workspace';
      else if (state.mode==='cards') state.mode=state.previousMode;
      else if (state.mode==='workspace') state.mode='overview';
      updateView();
    }
    function stepWorkspace(delta) {
      const next=workspaces.indexOf(workspaceData())+delta;
      if (next>=0 && next<workspaces.length) openWorkspace(workspaces[next].id);
    }
    world.addEventListener('click', event=>{
      if (event.target.closest('.agent-prompt')) return;
      if (event.target.closest('#newWorkspace')) {
        const id='w'+(workspaces.length+1);
        workspaces.push({id,title:'新工作空间',color:'#91adca',projects:[]});
        renderWorld(); openWorkspace(id); showToast('已创建空工作空间（仅原型内有效）'); return;
      }
      const wsEl=event.target.closest('.workspace'); if (!wsEl) return;
      const addProject=event.target.closest('[data-add-project]');
      if (addProject) {
        const ws=workspaces.find(item=>item.id===wsEl.dataset.workspace);
        const source=[workspaces[0].projects[0],workspaces[0].projects[1],workspaces[1].projects[1]].find(item=>item.id===addProject.dataset.addProject);
        ws.projects.push({...source,cards:[]});
        renderWorld(); openWorkspace(ws.id); showToast(`${source.title} 已加入；这是独立的空项目画布`); return;
      }
      const projectEl=event.target.closest('.project');
      const cardEl=event.target.closest('.live-card');
      const wsId=wsEl.dataset.workspace;
      if (state.mode==='overview' || wsId!==state.workspace) { openWorkspace(wsId); return; }
      if (state.mode==='cards' && cardEl) { openProject(projectEl.dataset.project,cardEl.dataset.card); return; }
      if (projectEl && state.mode==='workspace') { openProject(projectEl.dataset.project,cardEl?.dataset.card||null); return; }
      if (projectEl && state.mode==='project' && projectEl.dataset.project!==state.project) { openProject(projectEl.dataset.project,cardEl?.dataset.card||null); return; }
      if (cardEl && state.mode==='project') { state.card=cardEl.dataset.card; updateView(); }
    });
    world.addEventListener('keydown',event=>{
      if (event.key!=='Enter' && event.key!==' ') return;
      if (event.target.matches('input')) return;
      if (event.target.matches('.workspace,.project,.live-card')) { event.preventDefault(); event.target.click(); }
    });
    world.addEventListener('keydown',event=>{
      if (!event.target.matches('.agent-prompt input') || event.key!=='Enter') return;
      const value=event.target.value.trim(); if (!value) return;
      const body=event.target.closest('.card-body').querySelector('.term-rows');
      const line=document.createElement('p'); line.className='blue'; line.textContent='› '+value; body.append(line);
      event.target.value=''; showToast('TUI 演示：输入已显示在当前 Agent 卡片中');
    });
    document.getElementById('back').addEventListener('click',back);
    document.getElementById('overview').addEventListener('click',()=>{state.mode='overview';updateView();});
    document.getElementById('cards').addEventListener('click',showCards);
    document.getElementById('previous').addEventListener('click',()=>stepWorkspace(-1));
    document.getElementById('next').addEventListener('click',()=>stepWorkspace(1));
    document.getElementById('projectStrip').addEventListener('click',event=>{const button=event.target.closest('[data-quick-project]');if(button)openProject(button.dataset.quickProject);});
    document.getElementById('shortcutHelp').addEventListener('click',()=>showToast('Esc 返回 · C 显示卡片 · 1–6 切换工作空间 · ← / → 切换相邻工作空间'));
    document.getElementById('normaInput').addEventListener('keydown',event=>{
      if(event.key!=='Enter'||!event.target.value.trim())return;
      event.target.value=''; showToast('跨项目派工交互演示：没有连接真实 Agent');
    });
    document.addEventListener('keydown',event=>{
      if(event.target.matches('input'))return;
      if(event.key==='Escape'){back();return;}
      if(event.key.toLowerCase()==='c'){showCards();return;}
      if(event.key>='1'&&event.key<='6'){const ws=workspaces[Number(event.key)-1];if(ws)openWorkspace(ws.id);return;}
      if(event.key==='ArrowLeft'&&state.mode!=='overview')stepWorkspace(-1);
      if(event.key==='ArrowRight'&&state.mode!=='overview')stepWorkspace(1);
      if((event.metaKey||event.ctrlKey)&&event.shiftKey&&event.key.toLowerCase()==='k'){event.preventDefault();state.mode='overview';updateView();}
    });
    window.addEventListener('resize',()=>updateView(true));
    motionReduced.addEventListener('change',()=>aim(true));
    renderWorld(); updateView(true);
  </script>
</body>
</html>
