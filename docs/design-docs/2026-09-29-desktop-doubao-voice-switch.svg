<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Norma OS 桌面语音模式切换与豆包全双工接入示意</title>
  <desc id="desc">左侧展示 Voice Setup 页面顶部在现有语音与豆包全双工之间切换，选中豆包后展示麦克风、豆包凭据和 Norma Agent 三项设置。右侧对比现有 ASR 到 Agent 到 TTS 链路与豆包实时对话链路，豆包需要操作项目时调用 Norma Agent。</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .ink { fill: #202925; }
      .muted { fill: #68736d; }
      .green { fill: #187a58; }
      .small { font-size: 16px; }
      .body { font-size: 19px; }
      .strong { font-weight: 650; }
      .node { fill: #ffffff; stroke: #cddbd3; stroke-width: 2; }
      .arrow { fill: none; stroke: #518b72; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
      .soft-arrow { fill: none; stroke: #889990; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#gray-arrowhead); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#518b72"/>
    </marker>
    <marker id="gray-arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#889990"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="#f5f7f3"/>
  <text x="50" y="68" class="ink strong" font-size="34">Voice 保留现有模式，新增豆包全双工</text>
  <text x="50" y="103" class="muted body">设置里选一种模式；快捷键使用所选模式；项目任务始终由 Norma Agent 执行。</text>

  <!-- Left: Voice Setup mock-up based on the current desktop settings page. -->
  <rect x="48" y="135" width="702" height="770" rx="24" fill="#ffffff" stroke="#e0e6df" stroke-width="2"/>
  <text x="77" y="184" class="ink strong" font-size="24">设置页面：选择语音模式</text>
  <rect x="77" y="209" width="644" height="665" rx="18" fill="#fafbf9" stroke="#e3e9e3"/>
  <text x="105" y="251" class="ink strong" font-size="25">Voice Setup</text>
  <text x="105" y="280" class="muted small">选择使用快捷键启动哪一种语音体验</text>

  <text x="105" y="327" class="ink strong body">语音模式</text>
  <rect x="105" y="347" width="588" height="72" rx="15" fill="#e9eee9"/>
  <rect x="111" y="353" width="282" height="60" rx="12" fill="#ffffff" stroke="#d9e1d9"/>
  <text x="252" y="391" text-anchor="middle" class="ink strong body">现有语音</text>
  <rect x="401" y="353" width="286" height="60" rx="12" fill="#d9f3e5" stroke="#48a778" stroke-width="2"/>
  <circle cx="431" cy="383" r="12" fill="#279462"/>
  <path d="M 425 383 L 430 388 L 438 379" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="547" y="391" text-anchor="middle" class="green strong body">豆包全双工</text>
  <text x="105" y="452" class="muted small">当前选中豆包。切换后先结束旧通话，原设置会保留。</text>
  <line x1="105" y1="475" x2="693" y2="475" stroke="#e3e9e3" stroke-width="2"/>

  <circle cx="127" cy="523" r="18" fill="#e4f5e9" stroke="#65ae83"/>
  <text x="127" y="529" text-anchor="middle" class="green strong small">1</text>
  <text x="160" y="523" class="ink strong body">麦克风</text>
  <text x="160" y="548" class="muted small">沿用现有设备与权限</text>
  <rect x="586" y="500" width="107" height="37" rx="10" fill="#e4f5e9"/>
  <text x="639" y="524" text-anchor="middle" class="green small">已授权</text>

  <circle cx="127" cy="600" r="18" fill="#e4f5e9" stroke="#65ae83"/>
  <text x="127" y="606" text-anchor="middle" class="green strong small">2</text>
  <text x="160" y="600" class="ink strong body">豆包实时语音</text>
  <text x="160" y="625" class="muted small">API Key 仅存 macOS Keychain；选择音色并测试连接</text>
  <rect x="160" y="647" width="397" height="47" rx="11" fill="#ffffff" stroke="#d9e2d9"/>
  <text x="178" y="677" class="muted small">API Key  ••••••••••••••••</text>
  <rect x="569" y="647" width="124" height="47" rx="11" fill="#e4f5e9" stroke="#7fbc99"/>
  <text x="631" y="677" text-anchor="middle" class="green strong small">测试连接</text>

  <circle cx="127" cy="750" r="18" fill="#e4f5e9" stroke="#65ae83"/>
  <text x="127" y="756" text-anchor="middle" class="green strong small">3</text>
  <text x="160" y="750" class="ink strong body">Norma Agent</text>
  <text x="160" y="775" class="muted small">项目任务和工具仍交给当前项目中的 Norma</text>
  <rect x="586" y="729" width="107" height="37" rx="10" fill="#e4f5e9"/>
  <text x="639" y="753" text-anchor="middle" class="green small">已就绪</text>
  <line x1="105" y1="804" x2="693" y2="804" stroke="#e3e9e3" stroke-width="2"/>
  <text x="105" y="834" class="muted small">切回“现有语音”后，本地／Azure ASR 和 TTS 配置原样保留。</text>

  <!-- Right: two runtimes, one selected at a time. -->
  <rect x="777" y="135" width="774" height="770" rx="24" fill="#ffffff" stroke="#e0e6df" stroke-width="2"/>
  <text x="806" y="184" class="ink strong" font-size="24">运行方式：两条链路互不混用</text>

  <rect x="806" y="211" width="716" height="220" rx="18" fill="#f8faf8" stroke="#e0e7e0"/>
  <text x="833" y="249" class="ink strong body">现有语音</text>
  <text x="963" y="249" class="muted small">单次指令／连续监听，保持原样</text>
  <rect x="830" y="291" width="115" height="75" rx="13" class="node"/>
  <text x="887" y="335" text-anchor="middle" class="ink strong small">麦克风</text>
  <path d="M 948 328 L 972 328" class="soft-arrow"/>
  <rect x="976" y="291" width="105" height="75" rx="13" class="node"/>
  <text x="1029" y="335" text-anchor="middle" class="ink strong small">ASR</text>
  <path d="M 1085 328 L 1105 328" class="soft-arrow"/>
  <rect x="1109" y="291" width="151" height="75" rx="13" class="node"/>
  <text x="1185" y="323" text-anchor="middle" class="ink strong small">Norma Agent</text>
  <text x="1185" y="346" text-anchor="middle" class="muted" font-size="14">理解并执行</text>
  <path d="M 1264 328 L 1284 328" class="soft-arrow"/>
  <rect x="1288" y="291" width="105" height="75" rx="13" class="node"/>
  <text x="1340" y="335" text-anchor="middle" class="ink strong small">TTS</text>
  <path d="M 1397 328 L 1417 328" class="soft-arrow"/>
  <rect x="1421" y="291" width="76" height="75" rx="13" class="node"/>
  <text x="1459" y="335" text-anchor="middle" class="ink strong" font-size="15">扬声器</text>
  <text x="833" y="405" class="muted small">沿用已配置的识别模型、Agent 和朗读音色。</text>

  <rect x="806" y="451" width="716" height="352" rx="18" fill="#f1faf4" stroke="#86c5a1" stroke-width="2"/>
  <text x="833" y="489" class="green strong body">豆包全双工</text>
  <text x="970" y="489" class="muted small">本次新增的实时会话</text>
  <rect x="833" y="530" width="119" height="88" rx="14" class="node"/>
  <text x="892" y="580" text-anchor="middle" class="ink strong small">麦克风</text>
  <path d="M 956 574 L 1000 574" class="arrow"/>
  <rect x="1005" y="530" width="267" height="88" rx="14" fill="#dbf2e4" stroke="#59ab7f" stroke-width="2"/>
  <text x="1138" y="568" text-anchor="middle" class="green strong body">豆包实时语音</text>
  <text x="1138" y="594" text-anchor="middle" class="muted small">听、对话、生成语音</text>
  <path d="M 1277 574 L 1384 574" class="arrow"/>
  <rect x="1389" y="530" width="106" height="88" rx="14" class="node"/>
  <text x="1442" y="580" text-anchor="middle" class="ink strong small">扬声器</text>

  <path d="M 1085 621 L 1085 664 L 1105 664 L 1105 699" class="arrow"/>
  <text x="1008" y="665" class="green" font-size="15">要操作项目</text>
  <rect x="1021" y="704" width="237" height="65" rx="13" class="node"/>
  <text x="1139" y="734" text-anchor="middle" class="ink strong small">Norma Agent</text>
  <text x="1139" y="754" text-anchor="middle" class="muted" font-size="14">执行项目任务并给回执</text>
  <path d="M 1211 700 L 1211 666 L 1192 666 L 1192 622" class="arrow"/>
  <text x="1221" y="665" class="green" font-size="15">结果返回</text>
  <text x="833" y="789" class="muted small">聊天由豆包直接说；文件、终端等项目动作只由 Norma 执行一次。</text>

  <rect x="806" y="821" width="716" height="58" rx="13" fill="#edf1ed"/>
  <text x="833" y="857" class="ink small">一次只运行一种模式；切换时停止旧通话，保留两边的设置。</text>
</svg>
