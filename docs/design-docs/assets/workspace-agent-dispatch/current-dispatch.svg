0" width="650" height="105" rx="15" fill="#ffffff" stroke="#376dac" stroke-width="2.2"/><polygon points="605,1575.0 890.0,1650 605,1725.0 320.0,1650" fill="#f3f7fa" stroke="#376dac" stroke-width="2.2"/><rect x="280" y="1785" width="650" height="105" rx="15" fill="#ffffff" stroke="#376dac" stroke-width="2.2"/><rect x="280" y="1960" width="650" height="105" rx="15" fill="#ffffff" stroke="#376dac" stroke-width="2.2"/><rect x="280" y="2140" width="650" height="105" rx="15" fill="#ffffff" stroke="#376dac" stroke-width="2.2"/><rect x="280" y="2300" width="650" height="105" rx="15" fill="#ffffff" stroke="#376dac" stroke-width="2.2"/><rect x="1120" y="720" width="480" height="100" rx="15" fill="#ffffff" stroke="#667e92" stroke-width="2.2"/><rect x="1120" y="1040" width="480" height="120" rx="15" fill="#fff5f3" stroke="#ae4f49" stroke-width="2.2"/><rect x="1120" y="1372" width="480" height="120" rx="15" fill="#f1f6fd" stroke="#376dac" stroke-width="2.2"/><rect x="1120" y="1585" width="480" height="130" rx="15" fill="#ffffff" stroke="#667e92" stroke-width="2.2"/><rect x="1120" y="1950" width="480" height="120" rx="15" fill="#ffffff" stroke="#667e92" stroke-width="2.2"/><rect x="1120" y="240" width="480" height="345" rx="18" fill="#f0f5fa" stroke="#376dac" stroke-width="1.6"/><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#376dac" text-anchor="start" font-weight="650"><tspan x="80" y="75.0">NORMA OS  /  01  CURRENT</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="47" fill="#182b3c" text-anchor="start" font-weight="700"><tspan x="80" y="139.0">当前任务指派逻辑</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="23" fill="#617386" text-anchor="start" font-weight="450"><tspan x="82" y="181.0">正式桌面 Dock 路径 · 项目内名称解析 · 项目运行实例执行</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="278.94">用户在 Dock 下达指令</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="316.94">例如：让 Alan 修复登录</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="431.44">绑定当前 App 的项目上下文</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="469.44">current_root + 本项目 Agent roster / canvas</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="591.44">Norma 处理用户输入</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="629.44">直接点名路由，或模型调用 typed tool</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="27" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605" y="774.72">是否产生新任务派工请求？</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="931.44">在当前项目中解析 Agent 名称</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="969.44">名称 / 语音别名 → Agent 定义 ID</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="27" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605" y="1109.72">定义存在且满足派工约束？</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="1266.44">复用或激活定义对应的卡片</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="1304.44">按 definition_id 定位本画布中的会话</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="1426.44">协调器接收任务并关联定义</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="1464.44">生成 task_id / task_ref，保存待提交记录</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="27" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605" y="1659.72">CLI 当前允许提交？</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="1831.44">分阶段输入正文与发送 Enter</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="1869.44">成功后记录 submitted；不等待前一任务完成</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="2006.44">目标卡片内的 Provider CLI 执行</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="2044.44">Claude / Codex 等管理自己的消息队列</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="2186.44">可信 Hook / 回合事件返回</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="2224.44">按定义关联本地任务的状态与正文结果</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="605.0" y="2346.44">更新本项目任务账本与界面</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="605.0" y="2384.44">Done / Failed / Interrupted；不以回复文本判成功</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#667e92" text-anchor="middle" font-weight="650"><tspan x="1360.0" y="763.94">普通回复或续聊处理</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="1360.0" y="801.94">本图只展开正式新任务派工支路</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#ae4f49" text-anchor="middle" font-weight="650"><tspan x="1360.0" y="1077.44">拒绝派工并返回原因</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="1360.0" y="1115.44">未知 / 禁用 / 未跟踪且忙碌等</tspan><tspan x="1360.0" y="1148.44">明确反馈；不产生成功回执</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#376dac" text-anchor="middle" font-weight="650"><tspan x="1360.0" y="1409.44">返回 accepted / queued 回执</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="1360.0" y="1447.44">表示协调器已接收或等待提交</tspan><tspan x="1360.0" y="1480.44">不表示 CLI 已执行，更不表示完成</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#667e92" text-anchor="middle" font-weight="650"><tspan x="1360.0" y="1627.44">等待输入条件恢复</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="1360.0" y="1665.44">启动就绪 / 审批 / 用户输入占用</tspan><tspan x="1360.0" y="1698.44">条件变化后重新检查，不覆盖输入</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="29" fill="#667e92" text-anchor="middle" font-weight="650"><tspan x="1360.0" y="1987.44">tracking = untracked</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="middle" font-weight="450"><tspan x="1360.0" y="2025.44">能确认提交，但没有可信完成证据</tspan><tspan x="1360.0" y="2058.44">不能靠静默或文本猜测已完成</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="27" fill="#376dac" text-anchor="start" font-weight="650"><tspan x="1144" y="280.0">当前范围与跨项目缺口</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="23" fill="#617386" text-anchor="start" font-weight="450"><tspan x="1144" y="327">名称约束：项目定义库内</tspan><tspan x="1144" y="365">常规 Dock：尚未统一全空间派工</tspan><tspan x="1144" y="403">手机：另有 area_id / node_id 路由</tspan><tspan x="1144" y="441">旧桌面 dispatcher：仅测试特性</tspan><tspan x="1144" y="479">同空间跨项目卡片尚未统一查重</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#667e92" text-anchor="middle" font-weight="600"><tspan x="1002" y="745.0">否</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#376dac" text-anchor="start" font-weight="450"><tspan x="633" y="858.0">是</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#ae4f49" text-anchor="middle" font-weight="600"><tspan x="1002" y="1080.0">否</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#376dac" text-anchor="start" font-weight="450"><tspan x="633" y="1192.0">是</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#376dac" text-anchor="middle" font-weight="600"><tspan x="1024" y="1410.0">接收回执</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#667e92" text-anchor="middle" font-weight="600"><tspan x="1002" y="1630.0">否</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#667e92" text-anchor="middle" font-weight="600"><tspan x="1015" y="1515.0">条件恢复后重查</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#376dac" text-anchor="start" font-weight="450"><tspan x="633" y="1755.0">是</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#667e92" text-anchor="middle" font-weight="600"><tspan x="1025" y="1990.0">无可信跟踪</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="20" fill="#376dac" text-anchor="start" font-weight="450"><tspan x="640" y="2110.0">有可信事件</tspan></text><text font-family="-apple-system, 'PingFang SC', 'Heiti SC', Arial, sans-serif" font-size="22" fill="#617386" text-anchor="start" font-weight="450"><tspan x="82" y="2480.0">实线：运行步骤与分支   ·   虚线：接收回执   ·   当前名称解析以项目定义为范围</tspan></text></svg>