function deriveRuntime(settings) {
  return {
    ready: settings.status === 'ready' && (settings.source === 'local' || settings.cloudConfigured),
    engine: settings.source === 'cloud' ? 'azure' : settings.interaction === 'continuous' ? 'sherpa' : 'a1',
    source: settings.source,
  };
}

function interpretDemo(text, clarifiedTarget = null) {
  const normalized = text.toLowerCase().replace(/[\s，、：:,!！?？。.]/g, '');
  const base = {target: null, targetKind: 'canvas', mentioned: [], constraint: null, route: 'demo', input: text};
  const fixtures = [
    [['Bruno，继续刚才的登录任务', 'Bruno, continue the login task'], {kind: 'reply', target: 'bruno'}],
    [['给 Bruno 新建一个任务，检查登录报错', 'Create a task for Bruno: check the login error'], {kind: 'assign', target: 'bruno'}],
    [['Henry，帮我检查 Bruno 写的方案', "Henry, review Bruno's proposal"], {kind: 'handoff', target: 'henry', mentioned: ['bruno'], route: 'main'}],
    [['Bruno，不要新建，继续刚才的登录任务', 'Bruno, continue the login task, do not create a new one'], {kind: 'reply', target: 'bruno', constraint: 'no-new-task', route: 'main'}],
    [['Henry 修登录的任务做完了吗？', 'Has Henry finished the login task?'], {kind: 'status', target: 'henry'}],
    [['你帮我解释一下这段代码', 'Explain this code to me'], {kind: 'answer', targetKind: 'self'}],
    [['让 Alice 来做', 'Ask Alice to do it'], {kind: 'clarify', targetKind: 'outside'}],
    [['继续刚才那个', 'Continue the previous task'], DEMO_AGENTS.some(a => a.id === clarifiedTarget)
      ? {kind: 'reply', target: clarifiedTarget, route: 'clarified'} : {kind: 'clarify'}],
  ];
  for (const [phrases, result] of fixtures) {
    if (phrases.some(phrase => phrase.toLowerCase().replace(/[\s，、：:,!！?？。.]/g, '') === normalized)) return {...base, ...result};
  }
  return {...base, kind: 'unsupported', targetKind: 'unknown', route: 'main'};
}

function canSubmit(proposal, settings, currentInput = proposal.input) {
  if (currentInput !== proposal.input) return false;
  if (!deriveRuntime(settings).ready || proposal.route === 'main') return false;
  if (!['reply', 'assign', 'status', 'answer'].includes(proposal.kind)) return false;
  if (proposal.constraint === 'no-new-task' && proposal.kind === 'assign') return false;
  return proposal.targetKind === 'self' || DEMO_AGENTS.some(agent => agent.id === proposal.target);
}

function menuOptions(field){

function closeMenu(focus=true){
  if(!menuState)return;

  if(focus&&anchor.isConnected)anchor.focus();

function renderOptions(){
  const all=menuOptions(menuState.field);
  const query=popover.querySelector('input').value.toLowerCase();
  menuState.filtered=all.filter(([,label])=>t(label).toLowerCase().includes(query));
  menuState.index=Math.max(0,Math.min(menuState.index,menuState.filtered.length-1));
  const list=popover.querySelector('.popover-list');
  list.innerHTML=menuState.filtered.length?menuState.filtered.map(([value,label],index)=>`<button role="option" id="choice-${index}" class="menu-option" data-action="choose" data-value="${value}" aria-selected="${settings[menuState.field]===value}" ${index===menuState.index?'data-browse':''}>${t(label)}${settings[menuState.field]===value?icon('check'):''}</button>`).join(''):`<div class="empty-menu">${t('noResults')}</div>`;

  if(menuState.filtered.length)input.setAttribute('aria-activedescendant','choice-'+menuState.index);else input.removeAttribute('aria-activedescendant');

function openMenu(anchor){
  if(menuState?.anchor===anchor){closeMenu();return;}
  closeMenu(false);

  menuState={anchor,field,index:Math.max(0,menuOptions(field).findIndex(([value])=>value===settings[field])),filtered:[]};
  (anchor.closest('dialog')||document.body).appendChild(popover);
  popover.innerHTML=`<div class="popover-search"><input aria-label="${t('search')}" role="combobox" aria-controls="voice-options" aria-expanded="true" placeholder="${t('search')}" autocomplete="off"></div><div class="popover-list" id="voice-options" role="listbox" aria-label="${t(field)}"></div>`;

      event.preventDefault();event.stopImmediatePropagation();

      event.preventDefault();event.stopImmediatePropagation();

  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script></body></html>
