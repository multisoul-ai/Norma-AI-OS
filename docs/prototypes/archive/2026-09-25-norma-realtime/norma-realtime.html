  if(a.type==='close-sheet'){s.phoneSheet=null;s.pendingMachine=null;s.voiceNotice='';return {ok:true,message:'已关闭'};}
  if(a.type==='open-scanner'){s.phoneSheet='scanner';s.pendingMachine=null;return {ok:true,message:'扫码器已打开'};}
  if(a.type==='scan-code'){
    if(a.code!=='norma://pair/studio-mini')return result(false,'这不是有效的 Norma 电脑配对码');
    s.pendingMachine={id:'studio-mini',name:'Studio Mini',detail:'新电脑 · 等待注册',online:true};s.phoneSheet='pair-confirm';return {ok:true,message:'已识别 Studio Mini'};
  }
  if(a.type==='confirm-pair'){
    if(!s.pendingMachine)return result(false,'没有待确认的电脑');
    if(s.machines.some(machine=>machine.id===s.pendingMachine.id)){s.phoneSheet=null;s.pendingMachine=null;return result(false,'这台电脑已经注册');}
    s.machines.push({...s.pendingMachine,detail:'刚刚注册 · 在线'});s.pendingMachine=null;s.phoneSheet=null;return result(true,'Studio Mini 已注册');
  }
  if(a.type==='shelve'){s.focusThought=null;return result(true,'想法已收好，没有开始执行');}
  if(a.type==='start'){s.call=true;s.reply='我在听。可以是一个想法，也可以是今天要做的事。';return result(true,'与 Norma 的对话已开始（演示）');}
  if(a.type==='hangup'){s.call=false;s.reply='好，先到这里。我记下的想法和已派任务都会保留。';return result(true,'对话已结束，想法已保存，已派任务继续运行');}
  if(a.type==='connection'){s.online=!s.online;const build=s.machines.find(machine=>machine.id==='build-mac');if(build){build.online=s.online;build.detail=s.online?'远程 · 在线':'远程 · 离线';}return result(true,s.online?'Mac 已重连；草稿尚未派工':'Mac 离线，仍可讨论；任务状态为最后快照');}
  if(a.type==='browse'){if(a.project!=='all'&&!s.projects.includes(a.project))return result(false,'未知仓库');s.viewProject=a.project;s.page='work';s.phoneSheet=null;return result(true,a.project==='all'?'正在查看全部 Agent Card':'正在查看 '+a.project+' 的 Agent Card');}
  if(a.type==='filter'){if(a.project!=='all'&&!s.projects.includes(a.project))return {ok:false,message:'未知仓库'};s.viewProject=a.project;return {ok:true,message:a.project==='all'?'显示全部 Agent Card':'只显示 '+a.project};}
  if(a.type==='bind'){if(a.project!=='all'&&!s.projects.includes(a.project))return result(false,'未知仓库');s.viewProject=a.project;return result(true,'当前浏览已切换到 '+a.project);}
  if(a.type==='discuss'){
    const text=(a.text||'').trim();if(!text)return result(false,'先写下一点想法');
    const thought={id:'thought-'+s.nextThought++,text,status:'saved',time:'刚刚'};
    s.thoughts.unshift(thought);s.focusThought=thought.id;s.operation++;s.chat.push({role:'user',text});
    s.reply='我先替你记下了。它现在只是一个想法，没有启动任何 Agent。';
    s.chat.push({role:'norma',text:s.reply});return result(true,'想法已记录 · 尚未执行');
  }
  if(a.type==='dispatch'){
    if(!s.machines.length)return result(false,'先注册一台电脑，再派工');
    if(!s.projects.length)return result(false,'先在电脑上添加项目，再派工');
    if(!s.online)return result(false,'Mac 离线，想法已保留，尚未派工');
    if(!a.operation)return result(false,'缺少操作标识');
    if(s.receipts[a.operation])return result(true,'已核对接收回执，不重复派工');
    const thought=s.thoughts.find(t=>t.id===(a.thoughtId||s.focusThought));
    if(!thought||thought.status!=='saved')return result(false,'先选择一个未执行的想法');
    const tasks=[
      {id:'task-'+s.operation+'-ios',cardName:'Daisy',cardRoute:'create',title:'实现 iOS 多任务入口与状态反馈',agent:'Codex',machine:'Alan Studio',platform:'mobile',project:'Norma OS',status:'running',goal:'让 iOS 能查看全部 Agent，并只把需要判断的事项交给用户。',plan:[{text:'梳理多任务入口与状态层级',state:'current'},{text:'实现列表、筛选与状态反馈',state:'next'},{text:'补交互回归与真机验收项',state:'next'}],summary:'已创建 Daisy 卡片，接收界面目标与验收要求。',seen:false},
      {id:'task-'+s.operation+'-api',cardName:'Ethan',cardRoute:'create',title:'补齐跨仓库任务聚合接口',agent:'Claude',machine:'Build Mac',platform:'web',project:'Norma API',status:'running',goal:'为手机提供跨仓 Agent Card 的统一、只读聚合视图。',plan:[{text:'确认跨仓数据与权限边界',state:'current'},{text:'实现聚合查询与分页',state:'next'},{text:'验证离线快照与权限隔离',state:'next'}],summary:'已创建 Ethan 卡片，接收数据边界与权限要求。',seen:false},
      {id:'task-'+s.operation+'-release',cardName:'Felix',cardRoute:'create',title:'验证发布前的跨仓检查',agent:'Codex',machine:'Build Mac',platform:'desktop',project:'Release Ops',status:'running',goal:'验证多仓改动可以安全进入发布流程。',plan:[{text:'建立三仓检查清单',state:'current'},{text:'运行构建、测试与边界检查',state:'next'},{text:'汇总失败项与发布建议',state:'next'}],summary:'已创建 Felix 卡片，接收检查范围与失败标准。',seen:false}
    ];
    if(a.reviewPlans)for(const task of tasks){task.status='plan-review';task.operation=a.operation;task.planReview={version:1,seen:false,feedback:null,scope:'只修改 '+task.project+' 中与目标相关的内容。',risk:'跨仓依赖或范围扩大时先停下，请你决定。',verification:'完成后提供测试结果和可查看的交付证据。'};task.plan.forEach(step=>step.state='proposed');task.summary='方案 v1 已提交，等待你审核后才开始执行。';}
    s.tasks.unshift(...tasks);s.receipts[a.operation]=tasks.map(t=>t.id);thought.status='mission';s.focusThought=null;s.reply=a.reviewPlans?'Daisy、Ethan 和 Felix 的方案已到齐。你审核后我再让他们执行。':'已创建 Daisy、Ethan 和 Felix 三张 Agent Card，并分别派到三个仓库并行执行。';
    s.chat.push({role:'norma',text:s.reply});return result(true,a.reviewPlans?'3 份方案待你审核 · 尚未执行':'Daisy、Ethan、Felix 已创建并接收 · 3 张 Agent Card');
  }
  if(a.type==='mute'){s.muted=!s.muted;return result(true,s.muted?'麦克风已静音（演示）':'已恢复聆听（演示）');}
  if(a.type==='quiet'){s.quiet=!s.quiet;return result(true,s.quiet?'先不播报，任务照常继续':'恢复汇报，合并提醒待验收成果');}
  if(a.type==='interrupt'){s.reply='好，你说。我在听。';return result(true,'已打断回复，任务继续（演示）');}
  if(a.type==='approve-all-plans'){
    const pending=s.tasks.filter(task=>task.operation===a.operation&&task.status==='plan-review');
    if(!pending.length)return result(false,'没有待审核的方案');
    if(!s.online)return result(false,'Mac 离线，不能批准执行');
    if(pending.some(task=>!task.planReview.seen))return result(false,'请先查看每份当前版本的方案');
    for(const task of pending){task.status='running';task.plan[0].state='current';task.summary='方案 v'+task.planReview.version+' 已批准，Agent 开始执行。';}
    return result(true,'已批准 '+pending.length+' 份方案 · 对应 Agent 开始执行');
  }
  const t=s.tasks.find(t=>t.id===a.id);if(!t)return result(false,'找不到这个任务');
  if(a.type==='inspect'){if(t.status!=='review')return result(false,'成果还未准备好');t.seen=true;return result(true,'已打开成果示例');}
  if(a.type==='inspect-plan'){if(t.status!=='plan-review')return result(false,'当前没有待审核方案');t.planReview.seen=true;return result(true,'已查看 '+t.cardName+' 的方案 v'+t.planReview.version);}
  if(!s.online)return result(false,'Mac 离线，这个操作尚未提交');
  if(a.type==='approve-plan'){if(t.status!=='plan-review')return result(false,'当前没有待审核方案');if(!t.planReview.seen)return result(false,'请先查看当前版本的完整方案');t.status='running';t.plan[0].state='current';t.summary='方案 v'+t.planReview.version+' 已批准，Agent 开始执行。';return result(true,t.cardName+' 的方案已批准 · 开始执行');}
  if(a.type==='revise-plan'){if(t.status!=='plan-review')return result(false,'当前没有待审核方案');const text=(a.text||'').trim();if(!text)return result(false,'请写下需要修改的地方');t.planReview.version++;t.planReview.seen=false;t.planReview.feedback=text;t.plan.unshift({text:'先按你的意见调整：'+text,state:'proposed'});t.summary='方案 v'+t.planReview.version+' 已返回，请重新审核调整部分。';return result(true,t.cardName+' 已返回方案 v'+t.planReview.version+'（演示）');}
  if(a.type==='message'){if(t.status==='plan-review')return result(false,'请在方案页提交修改意见');const text=(a.text||'').trim();if(!text)return result(false,'先写下要告诉 Agent 的内容');t.lastInstruction=text;t.summary='已收到你的补充，'+t.cardName+' 会沿用原任务继续。';return result(true,'已交给 '+t.cardName+' · 原卡片继续');}
  if(a.type==='resolve'){if(t.status!=='decision')return result(false,'当前任务不需要决定');t.status='running';t.summary='已采用保持 30 天的建议，Agent 正在继续。';s.reply='决定已交回原 Agent，其他任务没有被打断。';return result(true,'决定已同步 · 原任务继续');}
  if(a.type==='complete'){if(t.status!=='running')return result(false,'任务当前不在执行');t.status='review';t.seen=false;t.summary='实现与自检已结束，需要你查看页面和交互。';if(s.call&&!s.quiet)s.reply='有一份界面做好了，已放到待你验收。方便时看一下就好。';return result(true,s.call&&s.quiet?'成果已进入待验收，稍后合并汇报':'实现已结束 · 待你验收');}
  if(a.type==='accept'){if(t.status!=='review'||!t.seen)return result(false,'先查看这份成果，再确认验收');t.status='done';return result(true,'验收通过 · 决定已同步（演示）');}
  if(a.type==='feedback'){if(t.status!=='review')return result(false,'当前不能提交验收反馈');if(!(a.text||'').trim())return result(false,'请写下需要调整的地方');t.feedback=a.text.trim();t.status='running';t.seen=false;t.summary='已收到你的修改意见，沿用原任务继续调整。';return result(true,'修改意见已交回 '+t.agent+'（演示）');}
  return result(false,'未支持的操作');
}
</script>
<script>
let state=initialRealtime(), detailId=null, previewBefore=false, phoneModal=null, workScroll=0, voiceGesture=null;
if(new URLSearchParams(location.search).get('empty')==='1')act(state,{type:'show-empty'});
// ponytail: scripted local interactions only; real speech and durable receipts belong to the shared runtime.
const symbols={mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0zM5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8',keyboard:'M3 6h18v12H3zM6 9h1M10 9h1M14 9h1M18 9h1M6 12h1M10 12h1M14 12h1M18 12h1M8 15h8',phone:'M4 14c4-5 12-5 16 0l-1 4-4-1v-3H9v3l-4 1z',close:'M6 6l12 12M6 18L18 6',arrow:'M5 12h14M13 6l6 6-6 6',chevron:'M9 5l7 7-7 7',down:'M6 9l6 6 6-6',tasks:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',check:'M5 12l4 4L19 6',headphones:'M4 14v-3a8 8 0 0 1 16 0v3M4 12H2v7h4v-7zM20 12h2v7h-4v-7z',chat:'M4 4h16v12H9l-5 4z',bell:'M6 8a6 6 0 0 1 12 0v6l2 3H4l2-3zM10 21h4',back:'M15 5l-7 7 7 7',send:'M12 20V4M5 11l7-7 7 7',spark:'M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z'};
const escapeHtml=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+symbols[name]+'"/></svg>';
const mark='<svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 27L14 8h4l-2 17L26 8h5L20 29h-6l2-17L9 27z" fill="currentColor"/></svg>';
const names={running:'进行中',decision:'需要决定',review:'待你验收',done:'已验收','plan-review':'方案待审核'};
const platforms={web:'Web',mobile:'手机端',desktop:'桌面端'};
function button(action,label,cls='',extra=''){return '<button data-action="'+action+'" class="'+cls+'" '+extra+'>'+label+'</button>';}
function avatar(){return '<svg class="avatar" viewBox="0 0 340 310" role="img" aria-label="Norma 虚拟人形象示意"><defs><linearGradient id="hair" x2=".7" y2="1"><stop stop-color="#dddeda"/><stop offset="1" stop-color="#636c6a"/></linearGradient><linearGradient id="coat" x2="0" y2="1"><stop stop-color="#b6bebb"/><stop offset="1" stop-color="#47514e"/></linearGradient></defs><ellipse class="avatar-shadow" cx="170" cy="298" rx="102" ry="11"/><g class="portrait"><path d="M109 107C90 42 115 12 168 12c68-1 77 48 61 112l17 103H91z" fill="url(#hair)"/><path d="M145 155h50v50h-50z" fill="#cfbfb5"/><path d="M66 306l14-72q8-30 65-42l25 18 25-18q56 12 65 42l15 72" fill="url(#coat)"/><path d="M145 190l25 22-24 36-31-45zM195 190l-25 22 25 36 30-45z" fill="#d0d5d1"/><path d="M154 216l16 12 16-12 7 90h-47z" fill="#252e2c"/><path d="M111 91q-4 61 36 85 26 16 49-7 33-25 32-79l-22-48h-66z" fill="#e4d7ce"/><ellipse cx="110" cy="119" rx="9" ry="16" fill="#d4c6bc"/><ellipse cx="227" cy="119" rx="8" ry="16" fill="#d4c6bc"/><path d="M104 102q-7-66 37-75 49-16 74 27l17 54q-18-16-33-58-30 41-73 48l33-42q-33 33-55 46" fill="url(#hair)"/><path d="M129 114q13-9 25 0M182 114q13-9 25 0" stroke="#5c625f" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="143" cy="121" rx="6" ry="8" fill="#536963"/><ellipse cx="194" cy="121" rx="6" ry="8" fill="#536963"/><circle cx="145" cy="119" r="2" fill="#fff"/><circle cx="196" cy="119" r="2" fill="#fff"/><path d="M167 128l-3 13 7 1" fill="none" stroke="#baaaa0" stroke-width="1.4"/><path d="M158 154q12 7 23-1" fill="none" stroke="#a17f78" stroke-width="2" stroke-linecap="round"/><path d="M106 103q8 92 12 104l-22 36 5-131M225 99q-8 87-5 112l24 18-7-120" fill="url(#hair)"/><path d="M96 254l-9 50M244 254l11 50" stroke="#7a8681" fill="none"/><circle cx="200" cy="264" r="3" fill="#d4ded7"/></g></svg>';}
function statusLine(){const online=state.machines.filter(machine=>machine.online).length;return '<span class="badge '+(!state.online?'warning':'')+'"><i class="dot"></i>'+(!state.online?'1 台电脑离线':state.call?(state.muted?'已静音':'正在聆听'):online+' 台在线')+'</span>';}
function taskRows(tasks){return tasks.length?'<div class="task-list">'+tasks.map(t=>'<button class="task-row" data-task="'+t.id+'" aria-label="查看 Agent Card：'+escapeHtml(t.cardName)+' · '+escapeHtml(t.title)+'"><span class="agent-icon '+(t.agent==='Claude'?'claude':'')+'">'+(t.agent==='Claude'?'✳':'⌁')+'</span><span class="task-content"><span class="card-name">'+escapeHtml(t.cardName)+' · '+t.agent+'</span><b>'+escapeHtml(t.title)+'</b><small>'+escapeHtml(t.project)+' · '+escapeHtml(t.machine)+'<br><span class="status-'+t.status+'">'+(state.online?'':'最后快照 · ')+names[t.status]+'</span></small></span>'+icon('chevron')+'</button>').join('')+'</div>':'<p class="empty">没有需要显示的 Agent Card。</p>';}
function focusedThought(){return state.thoughts.find(t=>t.id===state.focusThought);}
function thoughtCard(){const thought=focusedThought();return thought?'<section class="thought-card"><small>已记下 · 尚未执行</small><p>'+escapeHtml(thought.text)+'</p><div class="thought-actions">'+button('shelve','先放着','secondary')+button('plan','查看卡片派工计划 '+icon('arrow'),'primary')+'</div></section>':'';}
function talkInput(){const switcher=button('toggle-voice',icon(state.voiceMode?'keyboard':'mic'),'mode-toggle','type="button" aria-label="切换到'+(state.voiceMode?'文字':'语音')+'输入"');return '<div class="quick-talk">'+button('idea','帮我记个想法')+button('progress','给我 30 秒简报')+'</div>'+(state.voiceMode?'<div id="voice-feedback" class="voice-feedback" role="status" aria-live="polite" hidden></div><div class="composer voice-composer">'+switcher+button('hold-voice','按住说话','hold-voice','type="button" aria-label="按住说话"')+'</div><p class="voice-hint">交互演示 · 不采集麦克风</p>'+(state.voiceNotice?'<p class="voice-result" role="status">'+escapeHtml(state.voiceNotice)+'</p>':''):'<form class="composer" id="idea-form">'+switcher+'<label class="sr-only" for="idea-input">告诉 Norma 你的想法</label><input id="idea-input" name="idea" value="'+escapeHtml(state.composer)+'" placeholder="说个想法、问题或目标…" maxlength="240" autocomplete="off">'+button('submit',icon('send'),'','type="submit" aria-label="告诉 Norma"')+'</form>');}
function projectFilters(){return '<div class="project-filters" role="group" aria-label="按项目过滤 Agent Card">'+[['all','全部'],...state.projects.map(project=>[project,project])].map(([project,label])=>button('filter',escapeHtml(label)+' '+(project==='all'?state.tasks.length:state.tasks.filter(t=>t.project===project).length),'','data-filter="'+escapeHtml(project)+'" aria-pressed="'+(state.viewProject===project)+'"')).join('')+'</div>';}
function planGroups(){const groups=new Map();for(const task of state.tasks.filter(t=>t.status==='plan-review')){if(!groups.has(task.operation))groups.set(task.operation,[]);groups.get(task.operation).push(task);}return [...groups].map(([operation,tasks])=>({operation,tasks}));}
function commandView(){
  return '<section class="norma-stage">'+avatar()+'<div class="presence-status"><i class="dot"></i>Norma · '+(state.call?'正在聆听':'在线')+'</div>'+button('open-conversation',icon('chat')+' 对话与想法','presence-drawer','aria-label="打开对话与想法"')+'</section>';
}
function workView(){
  if(!state.machines.length||!state.projects.length){
    const noMachine=!state.machines.length;
    return '<div class="work-hero"><h2>Work</h2><p>跨仓任务会在这里汇总</p></div><section class="workspace-empty"><div class="workspace-empty-symbol">'+(noMachine?'<div class="computer-glyph" aria-hidden="true"></div>':icon('tasks'))+'</div><h2>'+(noMachine?'先连接一台电脑':'电脑已连接，等待项目')+'</h2><p>'+(noMachine?'在 Mac 上打开 Norma，显示配对码。扫码后即可查看项目和 Agent Card。':'在 '+escapeHtml(state.machines[0].name)+' 的 Norma 中添加项目。项目和 Agent Card 会同步到这里。')+'</p>'+(noMachine?button('open-scanner','扫描注册电脑','primary'):button('page-norma','先和 Norma 记下想法','secondary'))+'<small>'+(noMachine?'想法可以先记下，不会自动派工。':'项目需要从电脑添加；手机不会猜测或创建仓库。')+'</small></section>';
  }
  const tasks=orderedWorkTasks(state),needs=state.tasks.filter(t=>['decision','review'].includes(t.status)).length+planGroups().length,running=state.tasks.filter(t=>t.status==='running').length,online=state.machines.filter(machine=>machine.online).length;
  return '<div class="work-hero"><h2>Work</h2><p>'+online+' 台电脑 · 刚刚同步</p></div>'+button('page-inbox','<span class="attention-count">'+needs+'</span><span><b>'+needs+' 件事需要你</b><p>'+running+' 张卡片正在运行</p></span>','work-pulse','style="width:100%;text-align:left"')+'<div class="section-heading"><h2>'+(state.viewProject==='all'?'全部 Agent Cards':escapeHtml(state.viewProject))+'</h2><span>'+tasks.length+' 张 · 按处理优先级</span></div>'+projectFilters()+taskRows(tasks);
}
function inboxView(){const items=state.tasks.filter(t=>['decision','review'].includes(t.status)),groups=planGroups();return '<div class="inbox-hero"><span class="eyebrow">需要你的处理</span><h2>'+(items.length+groups.length)+' 件待办</h2><p>决定、方案与成果</p></div>'+groups.map(group=>button('open-plan-review','<span class="attention-count">'+group.tasks.length+'</span><span><b>'+group.tasks.length+' 个 Agent 的方案待审核</b><p>查看每份方案，再决定哪些可以开始</p></span>'+icon('chevron'),'work-pulse','data-operation="'+escapeHtml(group.operation)+'" style="width:100%;text-align:left"')).join('')+taskRows(items)+'<div class="section-heading"><h2>运行中</h2><span>'+state.tasks.filter(t=>t.status==='running').length+' 项</span></div>';}

  if(!state.machines.length||!state.projects.length){state.phoneSheet=null;state.page='work';state.notice=state.machines.length?'先在电脑上添加项目，再安排 Agent。':'先注册一台电脑，再安排 Agent。';render(0);return true;}
  detailId=id;const routes=[['Daisy','Codex','create','新建卡片','Alan Studio','Norma OS','实现 iOS 多任务入口与状态反馈'],['Ethan','Claude','create','新建卡片','Build Mac','Norma API','补齐跨仓库任务聚合接口'],['Felix','Codex','create','新建卡片','Build Mac','Release Ops','验证发布前的跨仓检查']];
  showSheet('Agent Card 派工计划','<p class="muted">Norma 将新建三张具名卡片，分别进入三个仓库。</p>'+routes.map(([name,agent,kind,label,machine,project,title])=>'<div class="dispatch-route"><span class="agent-icon '+(agent==='Claude'?'claude':'')+'">'+(agent==='Claude'?'✳':'⌁')+'</span><div><b>'+name+' · '+agent+'</b><p>'+title+'<br>'+machine+' · '+project+'</p></div><span class="route-kind '+kind+'">'+label+'</span></div>').join('')+'<label class="dispatch-review"><span><b>执行前先让我审核方案</b><small>Agent 先分析并提交方案，审核通过后才执行</small></span><input id="review-plans" type="checkbox" checked aria-label="执行前先让我审核方案"></label>'+button('confirm-dispatch','创建卡片并收取方案','primary'));
  return true;
}
function openTask(id,fromReview=false){const t=state.tasks.find(task=>task.id===id);if(!t)return;if(!fromReview)workScroll=document.querySelector('.main')?.scrollTop||0;detailId=id;previewBefore=false;state.notice='';state.agentVoiceMode=false;state.agentVoiceNotice='';state.selectedTaskId=id;state.cardSection=fromReview?'plan':'overview';state.cardReturnPage=fromReview?'plan-review':'work';state.page='card';render(0);}
function showPreview(){
  const t=state.tasks.find(t=>t.id===detailId);if(!t)return;
  const description={web:'对照修改前后，确认页面层级与关键流程。',mobile:'测试构建和操作录屏已经准备好，请在对应手机上完成最终确认。',desktop:'截图与操作录屏已经准备好，请在 Mac 上完成最终确认。'}[t.platform];
  showSheet('看看这次改动','<p class="badge">'+platforms[t.platform]+' · '+escapeHtml(t.project)+'</p><h3 style="margin:12px 0">'+escapeHtml(t.title)+'</h3><p class="muted">'+description+'</p><div class="artifact"><div class="version-tabs" role="tablist" aria-label="对比版本">'+button('before','修改前','','role="tab" aria-selected="'+previewBefore+'"')+button('after','修改后','','role="tab" aria-selected="'+!previewBefore+'"')+'</div><div class="preview '+(previewBefore?'before':'')+'"><h3>你的项目，正在向前。</h3><p>'+(previewBefore?'所有工作集中在一张列表。':'重要的进展，放在你看得见的地方。')+'</p><div class="preview-cards"><div>Codex<br><b>语音派工</b><p>正在实现</p></div><div>Claude<br><b>项目概览</b><p>等你验收</p></div></div></div></div><p class="evidence"><strong>验证记录</strong><br>页面流程：已通过<br>对应设备操作：待你确认</p>'+(t.platform!=='web'?button('build-info','查看测试构建与录屏','secondary'):'')+'<div class="action-pair">'+button('accept','我看过了，验收通过','primary')+button('later','稍后再看','secondary')+'</div><form id="feedback-form"><label class="field">需要调整的地方<textarea name="feedback" placeholder="例如：卡片间距再大一点…" required maxlength="400"></textarea></label>'+button('submit','把修改意见交回 Agent','secondary','type="submit"')+'</form>');
}
function updateVoiceFeedback(canceling){
  if(!voiceGesture)return;
  voiceGesture.canceling=canceling;
  const control=document.querySelector('.hold-voice'),feedback=document.getElementById('voice-feedback');
  if(!control||!feedback)return;
  control.classList.toggle('canceling',canceling);control.classList.toggle('recording',!canceling);
  control.textContent=canceling?'松开取消':'松开发送';control.setAttribute('aria-label',control.textContent);
  feedback.hidden=false;feedback.classList.toggle('canceling',canceling);
  feedback.textContent=canceling?(voiceGesture.taskId?'松开取消 · 不会发送给 Agent':'松开取消 · 不会记录想法'):'正在模拟语音输入 · 上滑取消';
}
function finishVoice(canceling){
  if(!voiceGesture)return;
  const taskId=voiceGesture.taskId;
  voiceGesture=null;
  if(taskId)state.agentVoiceNotice=canceling?'已取消语音输入':act(state,{type:'message',id:taskId,text:'【模拟语音】请继续完善这张卡片的任务。'}).message;
  else state.voiceNotice=canceling?'已取消语音输入':act(state,{type:'discuss',text:'【模拟语音】我想让 Norma 帮我记下这个想法。'}).message;
  render();
}
document.addEventListener('pointerdown',event=>{
  const control=event.target.closest('.hold-voice');
  if(!control||event.isPrimary===false||event.button!==0||voiceGesture)return;
  event.preventDefault();control.setPointerCapture(event.pointerId);
  const taskId=control.closest('.agent-dock')?state.selectedTaskId:null;
  if(taskId)state.agentVoiceNotice='';else state.voiceNotice='';
  document.querySelector('.voice-result')?.remove();voiceGesture={pointerId:event.pointerId,startY:event.clientY,canceling:false,taskId};
  updateVoiceFeedback(false);
});
document.addEventListener('pointermove',event=>{
  if(voiceGesture?.pointerId===event.pointerId)updateVoiceFeedback(event.clientY<voiceGesture.startY-70);
});
document.addEventListener('pointerup',event=>{
  if(voiceGesture?.pointerId===event.pointerId)finishVoice(event.clientY<voiceGesture.startY-70);
});
document.addEventListener('pointercancel',event=>{
  if(voiceGesture?.pointerId===event.pointerId)finishVoice(true);
});
document.addEventListener('lostpointercapture',event=>{
  if(voiceGesture?.pointerId===event.pointerId)finishVoice(true);
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&voiceGesture){event.preventDefault();finishVoice(true);return;}
  if(!event.target.closest('.hold-voice')||![' ','Enter'].includes(event.key)||event.repeat||voiceGesture)return;
  event.preventDefault();const taskId=event.target.closest('.agent-dock')?state.selectedTaskId:null;
  if(taskId)state.agentVoiceNotice='';else state.voiceNotice='';
  document.querySelector('.voice-result')?.remove();voiceGesture={pointerId:'keyboard',canceling:false,taskId};updateVoiceFeedback(false);
});
document.addEventListener('keyup',event=>{
  if(voiceGesture?.pointerId==='keyboard'&&[' ','Enter'].includes(event.key)){event.preventDefault();finishVoice(false);}
});
document.addEventListener('click',event=>{
  const target=event.target.closest('button');if(!target||target.disabled)return;
  if(target.dataset.thought){showThought(target.dataset.thought);return;}
  if(target.dataset.reviewTask){openTask(target.dataset.reviewTask,true);return;}
  if(target.dataset.task){openTask(target.dataset.task);return;}
  if(target.dataset.cardSection){state.cardSection=target.dataset.cardSection;render(0);return;}
  if(target.dataset.filter){act(state,{type:'filter',project:target.dataset.filter});render();return;}
  if(target.dataset.project){
    const result=act(state,{type:target.dataset.browse==='true'?'browse':'bind',project:target.dataset.project});
    if(!result.ok){state.notice=result.message;render();return;}
    phoneModal=null;render();return;
  }
  const action=target.dataset.action;if(!action||action==='submit')return;
  if(action==='hold-voice')return;
  if(action==='toggle-voice'){state.voiceMode=!state.voiceMode;state.voiceNotice='';render();document.querySelector(state.voiceMode?'.hold-voice':'#idea-input')?.focus();return;}
  if(action==='toggle-agent-voice'){state.agentVoiceMode=!state.agentVoiceMode;state.agentVoiceNotice='';render();document.querySelector(state.agentVoiceMode?'.agent-dock .hold-voice':'#agent-input')?.focus();return;}
  if(action==='close-sheet'||action==='close'||action==='later'){act(state,{type:'close-sheet'});phoneModal=null;render();return;}
  if(action==='back-work'){state.page=state.cardReturnPage||'work';state.selectedTaskId=null;render(state.page==='work'?workScroll:0);return;}
  if(action==='back-inbox'){state.page='inbox';state.reviewOperation=null;render(0);return;}
  if(action==='open-plan-review'){state.reviewOperation=target.dataset.operation;state.page='plan-review';state.notice='';render(0);return;}
  if(action==='project'||action==='browse-project'){act(state,{type:'open-projects'});render();return;}
  if(action==='open-conversation'){act(state,{type:'open-conversation'});render();return;}
  if(action==='open-scanner'){act(state,{type:'open-scanner'});render();return;}
  if(action==='scan-pair'){act(state,{type:'scan-code',code:'norma://pair/studio-mini'});render();return;}
  if(action==='confirm-pair'){act(state,{type:'confirm-pair'});render();return;}
  if(action==='open-preview'){const result=act(state,{type:'inspect',id:detailId});if(result.ok)showPreview();else render();return;}
  if(action==='before'||action==='after'){previewBefore=action==='before';showPreview();return;}
  if(action==='build-info'){document.getElementById('sheet-message').textContent='测试构建 norma-ios-812 与 42 秒操作录屏已准备好。';return;}
  if(action==='resolve'){
    const result=act(state,{type:'resolve',id:detailId});
    if(!result.ok){if(state.page==='card')render();else document.getElementById('sheet-message').textContent=result.message;return;}
    if(state.page==='card'){render(0);return;}
    act(state,{type:'close-sheet'});phoneModal=null;state.page='inbox';render();return;
  }
  if(action==='plan-thought'){showDispatchPlan(detailId);return;}
  if(action==='confirm-dispatch'){
    const reviewPlans=document.getElementById('review-plans').checked;
    const result=act(state,{type:'dispatch',operation:'thought-'+detailId,thoughtId:detailId,reviewPlans});
    if(!result.ok){document.getElementById('sheet-message').textContent=result.message;return;}
    act(state,{type:'close-sheet'});phoneModal=null;state.page=reviewPlans?'inbox':'work';render(0);return;
  }
  if(action==='mark-plan-read'){
    const result=act(state,{type:'inspect-plan',id:state.selectedTaskId});
    if(result.ok){state.page=state.cardReturnPage==='plan-review'?'plan-review':'inbox';state.selectedTaskId=null;render(0);}else render();return;
  }
  if(action==='approve-plan'){
    const id=state.selectedTaskId;
    act(state,{type:'inspect-plan',id});const result=act(state,{type:'approve-plan',id});
    if(result.ok){state.page=planGroups().some(group=>group.operation===state.reviewOperation)?'plan-review':'inbox';state.selectedTaskId=null;render(0);}else render();return;
  }
  if(action==='approve-all-plans'){
    const result=act(state,{type:'approve-all-plans',operation:state.reviewOperation});
    if(result.ok){state.page='inbox';state.reviewOperation=null;}render(0);return;
  }
  if(action==='accept'){
    const result=act(state,{type:'accept',id:detailId});
    if(!result.ok){document.getElementById('sheet-message').textContent=result.message;return;}
    act(state,{type:'close-sheet'});phoneModal=null;state.page='inbox';render();return;
  }
  if(action==='complete'){
    const result=act(state,{type:'complete',id:detailId});if(!result.ok){render();return;}
    render(0);return;
  }
  if(action==='reset'){state=initialRealtime();phoneModal=null;workScroll=0;render(0);return;}
  if(action.startsWith('page-')){state.page=action.slice(5);state.phoneSheet=null;phoneModal=null;render();return;}
  if(action==='plan'){
    if(!showDispatchPlan(state.focusThought)){state.notice='先记下一个想法，再查看 Agent Card 派工计划。';render();}
    return;
  }
  if(action==='idea'){
    act(state,{type:'discuss',text:'也许可以让 Norma 在通勤时，提醒我昨天没想完的事。'});state.page='norma';
  }else if(action==='bind'){act(state,{type:'bind',project:state.viewProject});}
  else if(action==='complete-next'){
    const task=state.tasks.find(t=>t.status==='running');
    if(task)act(state,{type:'complete',id:task.id});else state.notice='没有进行中的任务，可以先聊一个新想法。';
    state.page='inbox';
  }else if(action==='progress'){
    const tasks=state.tasks,text=state.online?'目前 '+tasks.filter(t=>t.status==='running').length+' 项进行中，'+tasks.filter(t=>t.status==='decision').length+' 项需要决定，'+tasks.filter(t=>t.status==='review').length+' 份成果待验收。':'一台 Mac 离线，我只能看到相关仓库的最后快照。';
    state.reply=text;state.chat.push({role:'norma',text});state.notice=text;
  }else act(state,{type:action});
  render();
});
document.addEventListener('input',event=>{if(event.target.id==='idea-input')state.composer=event.target.value;if(event.target.id==='agent-input')state.agentComposers[state.selectedTaskId]=event.target.value;});
document.addEventListener('change',event=>{if(event.target.id==='review-plans'){const confirm=document.querySelector('[data-action="confirm-dispatch"]');if(confirm)confirm.textContent=event.target.checked?'创建卡片并收取方案':'确认并开始执行';}});
document.addEventListener('submit',event=>{
  if(event.target.id==='idea-form'){
    event.preventDefault();const text=new FormData(event.target).get('idea');
    const result=act(state,{type:'discuss',text});if(result.ok)state.composer='';render();
  }
  if(event.target.id==='agent-form'){
    event.preventDefault();const result=act(state,{type:'message',id:state.selectedTaskId,text:new FormData(event.target).get('message')});
    if(result.ok)state.agentComposers[state.selectedTaskId]='';render();
  }
  if(event.target.id==='feedback-form'){
    event.preventDefault();const result=act(state,{type:'feedback',id:detailId,text:new FormData(event.target).get('feedback')});
    if(!result.ok){document.getElementById('sheet-message').textContent=result.message;return;}
    act(state,{type:'close-sheet'});phoneModal=null;render();
  }
  if(event.target.id==='plan-feedback-form'){
    event.preventDefault();act(state,{type:'revise-plan',id:state.selectedTaskId,text:new FormData(event.target).get('feedback')});render(0);
  }
});
const stage = document.getElementById('stage');
render();
</script>
</body>
</html>
