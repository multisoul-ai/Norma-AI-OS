function showEdit(id){const d=decisions.find(d=>d.id===id);dialog(t('editTitle'),`<p class="dialog-copy">${esc(l(d.title))}</p><form id="decision-form" data-form="edit" data-id="${id}" data-version="${d.version}"><label>${t('yourAnswer')}<textarea data-testid="decision-edit" name="answer" required>${esc(l(d.recommended))}</textarea></label></form><p class="dialog-copy" style="font-size:11px">${t('editHint')}</p>`,`<button class="btn" data-action="close">${t('cancel')}</button><button type="submit" form="decision-form" class="btn primary" data-testid="submit-edit">${t('submitEdit')}${icon('check')}</button>`);document.querySelector('[data-testid="decision-edit"]').focus()}
function applyDecision(id,answer=null,version=null){const d=decisions.find(d=>d.id===id),w=workBy(id),a=agentFor(id);if(!d||d.status!=='open'||version!==null&&d.version!==version){notice(t('resolved'));closeDialog();return}if(a.control==='human'){notice(t('heldByYou'));return}d.status='resolved';d.version++;w.stage=d.kind==='review'?'merge':'working';w.last=d.kind==='review'?['本轮验收通过，尚未合并与发布','Revision accepted; not merged or released']:d.kind==='permission'?['收到本次预览部署授权，正在执行','Preview deployment allowed; work continuing']:['原问题已答复，按保留数据方案继续修复','Question answered; continuing with data retention'];const answerText=answer||d.recommended;handledRecords.unshift({text:[`${a.name} · ${tFor(d.kind==='review'?'reviewed':d.kind==='permission'?'approved':'delivered','zh')}`,`${a.name} · ${tFor(d.kind==='review'?'reviewed':d.kind==='permission'?'approved':'delivered','en')}`],detail:answerText});messages.push({role:'assistant',text:[`${lAt(w.title,'zh')}：${tFor(d.kind==='review'?'reviewed':d.kind==='permission'?'approved':'delivered','zh')}`,`${lAt(w.title,'en')}: ${tFor(d.kind==='review'?'reviewed':d.kind==='permission'?'approved':'delivered','en')}`],context:id});closeDialog();activeDecision=openDecisions()[0]?.id||'';render();notice(t(d.kind==='review'?'reviewed':d.kind==='permission'?'approved':'delivered'))}
const tFor=(k,language)=>words[k]?.[language==='zh'?0:1]??k;const lAt=(x,language)=>Array.isArray(x)?x[language==='zh'?0:1]:x;
function showHistory(){dialog(t('historyTitle'),`<p class="dialog-copy">${t('historyHint')}</p>${handledRecords.map(e=>`<div class="timeline-record">${esc(l(e.text))}<small>${esc(l(e.detail))}</small></div>`).join('')}`)}
function showWork(query=''){const found=work.filter(w=>[l(w.title),agentFor(w.id).name].join(' ').toLowerCase().includes(query.toLowerCase()));return found.length?found.map(w=>{const a=agentFor(w.id);return `<article class="work-row" data-work="${w.id}">${avatar(a)}<div class="work-info"><b>${esc(l(w.title))}</b><p>${a.name} · ${esc(l(w.last))}</p>${phase(w)}</div><button class="btn" data-locate="${w.id}" title="${t('onCanvas')}">${icon('arrow')}</button></article>`}).join(''):`<div class="empty">${t('nothing')}</div>`}
function showAllWork(searchable=false){dialog(t('workTitle'),`<p class="dialog-copy">${t('workHint')}</p>${searchable?`<input class="searchbox" data-work-search placeholder="${t('search')}" aria-label="${t('search')}">`:''}<div data-work-results>${showWork()}</div>`);if(searchable)document.querySelector('[data-work-search]').focus()}
function showWorkDetails(id){const w=workBy(id),a=agentFor(id);dialog(t('inspect'),`<div class="row">${avatar(a)}<div><b>${a.name}</b><span class="muted tiny" style="margin-left:8px">${a.model}</span></div>${phase(w)}</div><h3 style="margin:19px 0 9px">${esc(l(w.title))}</h3><p class="dialog-copy">${esc(l(w.last))}</p><div class="evidence-block">${w.plan.map((p,i)=>`<div style="padding:7px 0">${String(i+1).padStart(2,'0')} <span style="margin-left:9px">${esc(l(p))}</span></div>`).join('')}</div><p class="dialog-copy" style="font-size:10px;margin-top:16px">${t('sampleEvidence')}</p>`,`<button class="btn" data-action="close">${t('close')}</button><button class="btn primary" data-locate="${id}">${t('onCanvas')}${icon('arrow')}</button>`)}
function showSuggestions(){dialog(t('suggestionsTitle'),`<p class="dialog-copy">${t('suggestionsHint')}</p>${proposals.map(p=>{const a=agents.find(a=>a.id===p.owner),w=work.find(w=>w.owner===p.owner),busy=!['done','merge'].includes(w.stage);return `<div class="work-row">${avatar(a)}<div class="work-info"><b>${esc(l(p.title))}</b><p>${esc(l(p.reason))}</p><small class="muted">${a.name} · ${p.sent?t('working'):t(w.stage)}</small></div><button class="btn" data-proposal="${p.id}" ${p.sent||busy?'disabled':''}>${p.sent?icon('check')+' '+t('working'):t('propose')}</button></div>`}).join('')}`)}
function showScope(){dialog(t('scope'),`<p class="dialog-copy">${t('scopeHint')}</p><button class="subtle-row" style="color:var(--ink);background:var(--raised);margin-bottom:8px" data-scope="global">${icon('layers')}${t('global')} ${scope==='global'?icon('check'):''}</button>${work.map(w=>`<button class="work-row" data-scope="${w.id}" style="width:100%;text-align:left;border-radius:7px;padding:13px 9px">${avatar(agentFor(w.id))}<span style="flex:1;font-size:11px">${esc(l(w.title))}</span>${scope===w.id?icon('check'):icon('arrow')}</button>`).join('')}`)}
function chatReply(text){messages.push({role:'user',text,context:scope});const result=scope==='global'?summary():lang==='zh'?`关于「${l(workBy(scope).title)}」：${l(workBy(scope).last)}。${t('newReply')}`:`For “${l(workBy(scope).title)}”: ${l(workBy(scope).last)}. ${t('newReply')}`;messages.push({role:'assistant',text:result,context:scope});draft='';render();const box=document.querySelector('[data-chat-scroll]');if(box){box.scrollTop=box.scrollHeight;chatScroll=box.scrollTop}}
function toggleVideo(){videoPaused=!videoPaused;const v=document.getElementById('wallpaper');if(videoPaused)v.pause();else v.play().catch(()=>{videoPaused=true;notice(t('videoPlay'))});const control=document.querySelector('[data-testid="video-toggle"]');if(control){control.innerHTML=icon(videoPaused?'play':'pause');control.title=t(videoPaused?'videoPlay':'videoPause');control.setAttribute('aria-label',control.title)}}
document.addEventListener('scroll',e=>{if(e.target.matches?.('[data-chat-scroll]'))chatScroll=e.target.scrollTop;if(e.target.matches?.('.canvas-viewport'))canvasScroll={x:e.target.scrollLeft,y:e.target.scrollTop}},true);
document.addEventListener('input',e=>{if(e.target.matches('[data-testid="composer"]'))draft=e.target.value;if(e.target.matches('[data-work-search]'))document.querySelector('[data-work-results]').innerHTML=showWork(e.target.value)});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const data=new FormData(form);if(form.dataset.form==='chat'){const text=String(data.get('message')||'').trim();if(!text){notice(t('noInput'));return}chatReply(text)}if(form.dataset.form==='edit'){const answer=String(data.get('answer')||'').trim();if(answer)applyDecision(form.dataset.id,answer,Number(form.dataset.version))}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.focus){focusDecision(el.dataset.focus);return}if(el.dataset.locate){locate(el.dataset.locate);return}if(el.dataset.apply){applyDecision(el.dataset.apply);return}if(el.dataset.edit){showEdit(el.dataset.edit);return}if(el.dataset.evidence){showEvidence(el.dataset.evidence);return}if(el.dataset.inspect){showWorkDetails(el.dataset.inspect);return}if(el.dataset.defer){const d=decisions.find(d=>d.id===el.dataset.defer);d.deferred=!d.deferred;render();return}if(el.dataset.scope){scope=el.dataset.scope;closeDialog();render();document.querySelector('[data-testid="composer"]')?.focus();return}if(el.dataset.prompt!==undefined){chatReply(t(['prompt1','prompt2','prompt3'][Number(el.dataset.prompt)]));return}if(el.dataset.proposal){const p=proposals.find(p=>p.id===el.dataset.proposal),w=work.find(w=>w.owner===p.owner);if(p.sent||!['done','merge'].includes(w.stage))return;p.sent=true;w.stage='working';w.last=p.title;handledRecords.unshift({text:[`${agents.find(a=>a.id===p.owner).name} · 后续任务已送达`,`${agents.find(a=>a.id===p.owner).name} · Follow-up delivered`],detail:p.title});render();showSuggestions();notice(t('proposed'));return}switch(el.dataset.action){case 'norma':route='norma';render();break;case 'canvas':route='canvas';render();if(!canvasScroll.x&&!canvasScroll.y)center();break;case 'language':lang=lang==='zh'?'en':'zh';render();break;case 'video':toggleVideo();break;case 'all-work':showAllWork();break;case 'search':showAllWork(true);break;case 'scope':showScope();break;case 'history':showHistory();break;case 'suggestions':showSuggestions();break;case 'close':closeDialog();break;case 'center':center();break;case 'info':dialog(t('info'),`<p class="dialog-copy">${t('infoText')}</p>`,`<button class="btn primary" data-action="close">${t('close')}</button>`);break;case 'read':{notice(summary());if('speechSynthesis'in window){speechSynthesis.cancel();const speech=new SpeechSynthesisUtterance(summary());speech.lang=lang==='zh'?'zh-CN':'en-US';speechSynthesis.speak(speech)}break}case 'takeover':{const a=agentFor(focusedWork);a.control=a.control==='human'?'agent':'human';render();center();notice(t(a.control==='human'?'heldByYou':'agentControl'));break}}});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeDialog()});
document.addEventListener('keydown',e=>{const modal=document.querySelector('[role="dialog"]');if(e.key==='Escape'){closeDialog();e.stopImmediatePropagation();return}if(e.target.matches('[data-testid="composer"]')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.closest('form').requestSubmit();return}if(!modal)return;e.stopImmediatePropagation();if(e.key==='Tab'){const nodes=[...modal.querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
const wallpaper=document.getElementById('wallpaper');wallpaper.muted=true;if(videoPaused){wallpaper.autoplay=false;wallpaper.pause()}wallpaper.addEventListener('error',()=>notice(lang==='zh'?'背景视频未能加载，已显示原壁纸静态图。':'Wallpaper video could not load; the original still is displayed.'));
</script><script id="picker-wiring">
const initialVariant=Number(new URLSearchParams(location.search).get('v')); if(!Number.isInteger(initialVariant)||initialVariant<1||initialVariant>variants.length){const u=new URL(location);u.searchParams.set('v','1');history.replaceState(null,'',u);}
document.querySelector('.proto-picker').addEventListener('click',()=>closeDialog(),true);
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script></body></html>
