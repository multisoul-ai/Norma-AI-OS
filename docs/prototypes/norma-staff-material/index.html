.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}

.sidebar .filters{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 8px 14px}.sidebar .filters button{min-height:32px;padding:0 6px;border:1px solid var(--line);border-radius:16px;font-size:12px;white-space:nowrap}.sidebar .filters button[aria-pressed=true]{border-color:transparent}
.sidebar .tasks{padding:0 8px}.task-row{display:flex;align-items:flex-start;gap:10px;min-height:0;padding:12px 14px 12px 12px}.task-row .dot{margin-top:7px}.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.row-title{justify-content:space-between;gap:8px}.row-title span:nth-child(1){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-title span:nth-child(2){flex:none}.row-status{font-size:11px;font-weight:400;color:var(--muted)}.row-status.need{color:var(--warning)}.row-status.running{color:var(--accent)}.row-meta{padding:0;margin:0;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Codex-style activity: collapsed summary, one row per tool, expand for output */
.activity{margin:0 0 14px;font-size:13px;color:var(--muted)}.activity>summary,.tool>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:10px;padding:4px 6px;margin-left:-6px}.activity>summary::-webkit-details-marker,.tool>summary::-webkit-details-marker{display:none}.activity>summary:hover,.tool>summary:hover{background:var(--hover)}.activity .chev{transition:transform 120ms ease-out;font-size:15px}.activity[open]>summary .chev{transform:rotate(90deg)}.act-ok{color:var(--green)}.act-list{margin:4px 0 0 7px;padding-left:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px}.tool-ico svg{width:14px;height:14px;display:block}.tool-verb{color:var(--ink)}.tool code{font-family:ui-monospace,monospace;font-size:11px;background:var(--elevated);border-radius:8px;padding:2px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.tool-st{margin-left:auto;font-size:12px;color:var(--green);flex:none}.tool.rej .tool-st{color:var(--warning)}.tool.rej .tool-verb{color:var(--warning)}.tool pre{margin:4px 0 6px 22px;padding:10px 12px;background:var(--elevated);border-radius:12px;font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;color:var(--muted)}
.panel{display:flex;gap:12px;align-items:flex-start;background:var(--elevated);border-radius:16px;padding:12px 16px;font-size:13px;line-height:1.7}.panel .pi{color:var(--accent);margin-top:1px}.panel.ok .pi{color:var(--green)}.panel .excerpt{color:var(--muted);margin-top:4px}.message code,.excerpt code{font-family:ui-monospace,monospace;font-size:12px;background:var(--elevated);border-radius:6px;padding:1px 6px}.message ul{margin:0 0 12px;padding-left:20px}.message li{margin:2px 0}
.proto-picker{display:none!important}
.qa-q{display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%}.qa-prompt{font-size:15px}.qa-opts{display:flex;flex-direction:column;gap:6px;width:100%}.qa-opt{justify-content:flex-start;align-items:flex-start;text-align:left;width:100%;white-space:normal;background:var(--surface);border:1px solid transparent;border-radius:14px;padding:10px 14px;min-height:0;gap:12px;line-height:1.5}.qa-opt:hover{border-color:var(--line)}.qa-desc{display:block}.qa-ind{flex:none;width:16px;height:16px;margin-top:3px;border:1.5px solid var(--muted);border-radius:50%;box-sizing:border-box}.qa-ind.sq{border-radius:5px}.qa-opt[aria-pressed=true]{border-color:var(--accent)}.qa-opt[aria-pressed=true] .qa-ind{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}.qa-opt[aria-pressed=true] .qa-ind.sq{box-shadow:none;position:relative}.qa-opt[aria-pressed=true] .qa-ind.sq:after{content:'✓';position:absolute;inset:0;font-size:11px;line-height:13px;text-align:center;color:var(--on-accent)}.qa-input{width:100%;box-sizing:border-box;background:var(--surface);border:0;border-radius:18px;padding:0 14px;height:38px;outline:0}.qa-input:focus{box-shadow:0 0 0 1px var(--accent)}.qa-done{background:var(--surface);border-radius:14px;padding:10px 14px;font-size:13px;width:100%;box-sizing:border-box}.gal-cap{margin:6px 0 -14px}.proposal .message-actions{align-items:center}
.proposal.ignored{display:block;background:transparent;border:1px dashed var(--line);border-radius:16px;padding:10px 16px}.ignored summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.ignored summary::-webkit-details-marker{display:none}.ignored .chev{transition:transform 120ms ease-out;font-size:15px}.ignored[open] .chev{transform:rotate(90deg)}.ignored p{margin:8px 0 0}
</style></head>
<body><div id="stage"></div>
<div class="prototype-note">交互原型 · 模拟数据<br><a href="https://developer.android.com/design/ui/mobile/guides/layout-and-content/layout-and-nav-patterns" target="_blank" rel="noreferrer">Material 导航与布局原则 ↗</a></div>

 <span class="proto-picker-highlight" aria-hidden="true"></span>
 <button class="proto-picker-item" data-active aria-current="true">双栏工作台</button>
 <button class="proto-picker-item">窄轨专注</button>
 <button class="proto-picker-item">任务收件箱</button>

<dialog id="new-dialog"><form id="new-form"><h2>交给 Norma 一件事</h2><label for="new-title">你想完成什么？</label><input id="new-title" required placeholder="例如：开发一个 HTML 贪吃蛇游戏" autocomplete="off"><label for="new-project">所属项目</label><select id="new-project"><option>Norma-OS</option><option>官网</option><option>开发文档</option></select><div class="actions"><button type="button" data-action="cancel-new">取消</button><button class="primary" type="submit">创建任务</button></div></form></dialog>
<dialog id="about-dialog"><h2>先试试这些交互</h2><p>切换项目与任务、筛选「需要你」、折叠任务列表、打开执行详情，以及画布与幕僚切换。</p><p>输入消息后按 ⌘ Enter；也可以「重新提议」并采用，观察等待、计划更新与回复。所有数据都只保留在此原型，不会派发真实任务。</p><div class="actions"><button class="primary" data-action="close-about">开始体验</button></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const paths={plus:'M12 5v14M5 12h14',chevron:'m8 10 4 4 4-4',search:'M21 21l-4.5-4.5M19 10.5a8.5 8.5 0 1 1-17 0 8.5 8.5 0 0 1 17 0',close:'m6 6 12 12M6 18 18 6',send:'M12 19V5m-6 6 6-6 6 6',canvas:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',staff:'M4 5h16v12H9l-5 4V5Z',tasks:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',files:'M3 6h7l2 3h9v11H3V6Z',help:'M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5m0 4h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',sun:'M12 3V1m0 22v-2M3 12H1m22 0h-2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2M17 12a5 5 0 1 1-10 0 5 5 0 0 1 10 0',focus:'M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5',back:'m14 5-7 7 7 7',alert:'M12 8v5m0 3h.01M3 20h18L12 3 3 20Z',check:'m5 12 4 4L19 6',open:'M14 3h7v7m0-7-11 11M10 3H3v18h18v-7',terminal:'m5 7 5 5-5 5m8 0h6',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${(paths[n]||paths.tasks).split('|').map(d=>`<path d="${d}"/>`).join('')}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ib=(name,label,action,extra='')=>`<button class="icon-button" aria-label="${label}" title="${label}" data-action="${action}" ${extra}>${icon(name)}</button>`;
const statuses={need:'需要你',running:'执行中',review:'待验收',done:'已完成',waiting:'等待中'};
const tasks=[
 {id:'snake',title:'开发 HTML 贪吃蛇游戏',project:'Norma-OS',status:'need',phase:'进行中',agent:'Alan',engine:'Codex',time:'刚刚',kind:'failure',draft:'',extra:[]},
 {id:'site',title:'优化官网的移动端布局',project:'官网',status:'running',phase:'进行中',agent:'Mia',engine:'Claude',time:'5 分钟',kind:'running',draft:'',extra:[]},
 {id:'docs',title:'整理 API 接入文档',project:'开发文档',status:'review',phase:'待验收',agent:'Alan',engine:'Codex',time:'24 分钟',kind:'review',draft:'',extra:[]},
 {id:'shortcuts',title:'补充键盘快捷键说明',project:'Norma-OS',status:'done',phase:'已完成',agent:'Mia',engine:'Claude',time:'昨天',kind:'done',draft:'',extra:[]}
];
const state={workspace:'Workspace 1',project:'所有项目',filter:'all',query:'',search:false,selected:'snake',mode:'staff',drawer:false,inspector:null,focus:false,mobile:false,preview:false};
let activeVariant=0,toastTimer;const runs=new Map();
const task=()=>tasks.find(t=>t.id===state.selected);
const visible=()=>tasks.filter(t=>(t.workspace||'Workspace 1')===state.workspace&&(state.project==='所有项目'||t.project===state.project)&&(state.filter==='all'||(state.filter==='need'?t.status==='need'||t.status==='review':t.status==='running'))&&(!state.query||[t.title,t.project,t.agent].join(' ').toLowerCase().includes(state.query.toLowerCase())));
const count=f=>tasks.filter(t=>(t.workspace||'Workspace 1')===state.workspace&&(state.project==='所有项目'||t.project===state.project)&&(f==='all'||(f==='need'?t.status==='need'||t.status==='review':t.status==='running'))).length;
const chip=t=>`<span class="chip ${t.status}"><i class="dot"></i>${statuses[t.status]}</span>`;
function selector(type,values,value){return `<div class="scope"><select aria-label="${type==='workspace'?'切换工作空间':'筛选项目'}" data-control="${type}">${values.map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select></div>`}
function filters(){return `<div class="filters" aria-label="任务状态筛选">${[['all','全部'],['need','需要你'],['running','执行中']].map(([f,l])=>`<button data-filter="${f}" aria-pressed="${state.filter===f}">${l}<b>${count(f)}</b></button>`).join('')}</div>`}
function search(){return state.search?`<div class="search"><span class="icon">${icon('search')}</span><input data-search aria-label="搜索任务或成员" placeholder="搜索任务或成员" value="${esc(state.query)}">${ib('close','清除搜索','clear-search')}</div>`:''}
function rows(){return visible().length?visible().map(t=>`<button class="task-row" data-task="${t.id}" aria-current="${state.selected===t.id}"><i class="dot" style="color:${t.status==='need'?'var(--warning)':t.status==='running'?'var(--accent)':'var(--muted)'}"></i><span class="row-body"><span class="row-title"><span>${esc(t.title)}</span><span class="row-status ${t.status}">${statuses[t.status]}</span></span><span class="row-meta">${esc(t.agent)} · ${esc(t.project)}</span></span></button>`).join(''):'<div class="empty small">没有匹配的任务</div>'}
function sidebar(){return `<aside class="sidebar ${state.mobile?'mobile-open':''}" aria-label="任务导航"><div class="side-actions"><button class="primary" data-action="new">${icon('plus')}新任务</button>${activeVariant===1?ib('close','收起任务列表','tasks'):''}</div><div class="side-search"><span class="icon">${icon('search')}</span><input data-search aria-label="搜索任务或成员" placeholder="搜索任务" value="${esc(state.query)}">${selector('project',['所有项目','Norma-OS','官网','开发文档'],state.project)}</div>${filters()}<div class="tasks">${rows()}</div></aside>`}
function appbar(){return `<header class="appbar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><div class="mark">N</div><span>Norma</span></div>${selector('workspace',['Workspace 1','个人工作空间'],state.workspace)}${activeVariant!==1?`<nav class="modes" aria-label="工作空间视图"><button data-mode="canvas" aria-current="${state.mode==='canvas'}">画布</button><button data-mode="staff" aria-current="${state.mode==='staff'}">幕僚</button></nav>`:''}<div class="spacer"></div>${ib('sun','切换浅色 / 深色','theme','data-theme')}${ib('help','原型使用说明','help')}<div class="avatar" title="Alan">A</div></header>`}
function rail(){return `<nav class="rail" aria-label="工作空间视图"><button class="primary" data-action="new" aria-label="新任务">${icon('plus')}</button><button data-mode="canvas" aria-current="${state.mode==='canvas'}">${icon('canvas')}画布</button><button data-mode="staff" aria-current="${state.mode==='staff'}">${icon('staff')}幕僚</button><div class="divider"></div><button data-action="tasks" aria-pressed="${state.drawer}" aria-label="展开任务列表">${icon('tasks')}任务</button><button data-action="files" aria-pressed="${state.inspector==='files'}">${icon('files')}文件</button><div class="spacer"></div></nav>`}
function worker(t){return `<div class="worker-pill ${t.status}"><span class="avatar">${t.agent[0]}</span><span>${t.agent}<span class="subtle"> · ${t.engine}</span></span><span class="chip ${t.status}">${t.kind==='failure'?'未能启动':t.status==='running'?'正在执行':t.status==='done'||t.status==='review'?'结果已收到':'准备执行'}</span></div>`}
function plan(progress=1){return `<div class="plan"><div class="plan-head"><span>执行计划</span><span>${progress}/3 完成</span></div>${['搭建游戏画布与键盘控制','实现食物、计分与碰撞逻辑','检查开始、暂停与重新开始'].map((s,i)=>`<div class="plan-step ${i<progress?'done':i===progress?'active':''}"><span class="step-icon">${i<progress?'✓':i===progress?'<i class="spinner"></i>':'○'}</span>${s}</div>`).join('')}</div>`}
function assistant(body,time='刚刚'){return `<article class="message assistant"><div class="byline"><div class="mark">N</div>Norma<time>${time}</time></div>${body}</article>`}
const TOOLS={agents:{verb:'查看 Agent 名册',target:'norma brain agents',st:'ok',out:'Alan · Claude　空闲\nSimon · Codex　空闲\nGrace · Codex　忙碌'},history:{verb:'读取任务历史',target:'norma brain history',st:'ok',out:'共 6 条消息，最近一条来自用户'},propose:{verb:'提出派活提议',target:'task propose · 实现验收文件',st:'ok',out:'已保存为待你决定的提议，尚未派发'},proposeRun:{verb:'提出派活提议',target:'task propose · 实现验收文件',st:'run',out:''},phase:{verb:'推进阶段到待验收',target:'task phase → merging',st:'ok',out:'阶段已更新；用户手动设置的阶段不会被覆盖'},adopt:{verb:'尝试直接派活',target:'task adopt',st:'rej',out:'被权限闸门拒绝：任务轮次不能自行派活，只有你点“采用并派发”才会执行'}};
function activity(keys,secs=12,label='正在处理'){const items=keys.map(k=>TOOLS[k]);const running=items.some(i=>i.st==='run');const head=running?`<i class="spinner"></i><span>${label} · 已执行 ${items.filter(i=>i.st!=='run').length} 步</span>`:`<span class="act-ok">✓</span><span>已处理 · ${items.length} 步 · 用时 ${secs} 秒</span>`;return `<details class="activity" ${running?'open':''}><summary>${head}<span class="chev">›</span></summary><div class="act-list">${items.map(i=>`<details class="tool ${i.st}"><summary><span class="tool-ico">${icon('terminal')}</span><span class="tool-verb">${i.verb}</span><code>${esc(i.target)}</code><span class="tool-st">${i.st==='run'?'<i class="spinner"></i>':i.st==='rej'?'✕ 已拒绝':'✓'}</span></summary>${i.out?`<pre>${esc(i.out)}</pre>`:''}</details>`).join('')}</div></details>`}
function initialMessages(t){if(t.kind==='gallery')return '';if(t.kind==='demo')return t.extra.length?'':`<div class="empty"><div class="mark">N</div><h2>完整对话演示</h2><p>点右上角“播放演示”，看一次从提需求、提议、采用、执行到验收的真实流程。</p></div>`;if(t.kind==='new')return assistant('<p>任务已记下。补充一下预期结果，我会先给出拆分建议，等你采用后再派发。</p>');let intro=`<article class="message user"><div class="bubble">${t.id==='snake'?'我想开发一个 HTML 贪吃蛇游戏，直接在浏览器里打开就能玩。':esc(t.title)}</div></article>`;
if(t.kind==='failure')return intro+assistant(activity(['agents','adopt'],6)+`<p>这个任务还没有开始执行。Alan 的 Codex 启动后未就绪，任务内容尚未发送。</p><div class="status-note"><span class="icon">${icon('alert')}</span><span>需要处理 Worker 的启动状态，现有任务和消息已保留。</span></div><p class="subtle small">可以先查看执行详情，或者让我重新提出执行方案。</p><div class="message-actions"><button class="tonal" data-action="worker">${icon('terminal')}查看执行详情</button><button data-action="repropose">重新提议</button></div>`,'19:07');
if(t.kind==='running')return intro+assistant(activity(['agents','propose'],9)+`<p>正在调整页面在手机上的阅读顺序，导航和主按钮已完成。接下来检查表单与图片的窄屏表现。</p><div class="plan"><div class="plan-head"><span>执行计划</span><span>1/3 完成</span></div><div class="plan-step done">✓　调整导航与主按钮</div><div class="plan-step active"><i class="spinner"></i> 检查表单和图片布局</div><div class="plan-step">○　完成手机尺寸回归</div></div>`,'19:02');
if(t.kind==='review')return intro+assistant(activity(['agents','history','phase'],14)+`<p>接入文档已整理好，涵盖认证、请求示例和错误处理。你可以先打开文档检查，有需要我再继续修改。</p><div class="message-actions"><button class="tonal" data-action="files">${icon('files')}打开接入文档</button><button data-action="complete">验收通过</button></div>`,'18:43');
if(t.kind==='done')return intro+assistant(`<p>快捷键说明已补充完成，包括任务切换、消息发送和退出专注模式。</p><p class="subtle small">继续发消息会重新打开这个任务。</p><button class="tonal" data-action="files">${icon('files')}查看文档</button>`,'昨天');
return intro;}
function messages(t){return initialMessages(t)+t.extra.map(m=>m.raw?`<article class="message">${m.html}</article>`:m.role==='user'?`<article class="message user"><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div></article>`:assistant(m.html)).join('')+(t.waiting?assistant(activity(['agents','proposeRun'],0,'正在整理你的要求')):'');}
function conversation(){const t=task();if(!t||(t.workspace||'Workspace 1')!==state.workspace)return `<section class="conversation"><div class="empty"><div class="mark">N</div><h2>${state.workspace==='个人工作空间'?'给这个工作空间一个开始':'选择一项任务'}</h2><p>${state.workspace==='个人工作空间'?'这里还没有任务。新建任务后，Norma 会与你一起推进。':'从任务列表中选择，或交给 Norma 一件新事。'}</p><button class="primary" data-action="new">${icon('plus')}新任务</button></div></section>`;
return `<section class="conversation" aria-label="当前任务"><header class="task-header">${activeVariant===0?ib('tasks','展开任务列表','tasks','data-mobile'):''}${activeVariant===2?ib('back','返回任务收件箱','close-task'):''}<div class="task-heading"><div class="eyebrow">${esc(t.project)}${t.manual?' · 阶段由你设置':''}</div><h1>${esc(t.title)}</h1>${t.kind==='new'||t.hideWorker?'':worker(t)}</div><div class="header-actions">${t.kind==='demo'?`<button class="tonal" data-action="demo">▶ 播放演示</button>`:''}${activeVariant!==1?ib('files','打开任务文件','files'):''}${ib(state.focus?'close':'focus',state.focus?'退出专注':'专注当前任务','focus')}</div></header><div class="thread" id="thread"><div class="thread-inner">${messages(t)}</div></div><div class="composer-wrap"><form class="composer" id="composer"><textarea aria-label="给 Norma 发消息" placeholder="告诉 Norma 接下来做什么…">${esc(t.draft)}</textarea><div class="composer-footer"><span>Shift + Enter 换行</span><span>Enter 发送</span><button type="submit" class="primary send" aria-label="发送消息" ${t.draft.trim()&&!t.waiting?'':'disabled'}>${icon('send')}</button></div></form></div></section>`}

const variants=[()=>renderVariant(0),()=>renderVariant(1),()=>renderVariant(2)];
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
