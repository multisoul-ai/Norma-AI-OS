.proto-picker {
  position: fixed;

  align-items: center;

  top: 4px;
  left: 0;

  background: rgba(255, 255, 255, 0.12);

.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);

<dialog id="about-dialog"><h2>先试试这些交互</h2><p>切换项目与任务、筛选「需要你」、折叠任务列表、打开执行详情，以及画布与幕僚切换。</p><p>输入消息后按 ⌘ Enter；也可以「重新提议」并采用，观察等待、计划更新与回复。所有数据都只保留在此原型，不会派发真实任务。</p><div class="actions"><button class="primary" data-action="close-about">开始体验</button></div></dialog>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const paths={plus:'M12 5v14M5 12h14',chevron:'m8 10 4 4 4-4',search:'M21 21l-4.5-4.5M19 10.5a8.5 8.5 0 1 1-17 0 8.5 8.5 0 0 1 17 0',close:'m6 6 12 12M6 18 18 6',send:'M12 19V5m-6 6 6-6 6 6',canvas:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',staff:'M4 5h16v12H9l-5 4V5Z',tasks:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',files:'M3 6h7l2 3h9v11H3V6Z',help:'M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5m0 4h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',sun:'M12 3V1m0 22v-2M3 12H1m22 0h-2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2M17 12a5 5 0 1 1-10 0 5 5 0 0 1 10 0',focus:'M4 9V4h5m6 0h5v5M4 15v5h5m6 0h5v-5',back:'m14 5-7 7 7 7',alert:'M12 8v5m0 3h.01M3 20h18L12 3 3 20Z',check:'m5 12 4 4L19 6',open:'M14 3h7v7m0-7-11 11M10 3H3v18h18v-7',terminal:'m5 7 5 5-5 5m8 0h6',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${(paths[n]||paths.tasks).split('|').map(d=>`<path d="${d}"/>`).join('')}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ib=(name,label,action,extra='')=>`<button class="icon-button" aria-label="${label}" title="${label}" data-action="${action}" ${extra}>${icon(name)}</button>`;
const statuses={need:'需要你',running:'执行中',review:'待验收',done:'已完成',waiting:'等待中'};
const tasks=[
 {id:'snake',title:'开发 HTML 贪吃蛇游戏',project:'Norma-OS',status:'need',phase:'进行中',agent:'Alan',engine:'Codex',time:'刚刚',kind:'failure',draft:'',extra:[]},
 {id:'site',title:'优化官网的移动端布局',project:'官网',status:'running',phase:'进行中',agent:'Mia',engine:'Claude',time:'5 分钟',kind:'running',draft:'',extra:[]},
 {id:'docs',title:'整理 API 接入文档',project:'开发文档',status:'review',phase:'待验收',agent:'Alan',engine:'Codex',time:'24 分钟',kind:'review',draft:'',extra:[]},
 {id:'shortcuts',title:'补充键盘快捷键说明',project:'Norma-OS',status:'done',phase:'已完成',agent:'Mia',engine:'Claude',time:'昨天',kind:'done',draft:'',extra:[]}
];
const state={workspace:'Workspace 1',project:'所有项目',filter:'all',query:'',search:false,selected:'snake',mode:'staff',drawer:false,inspector:null,focus:false,mobile:false,preview:false};
let activeVariant=0,toastTimer;const runs=new Map();
const task=()=>tasks.find(t=>t.id===state.selected);
const visible=()=>tasks.filter(t=>(t.workspace||'Workspace 1')===state.workspace&&(state.project==='所有项目'||t.project===state.project)&&(state.filter==='all'||(state.filter==='need'?t.status==='need'||t.status==='review':t.status==='running'))&&(!state.query||[t.title,t.project,t.agent].join(' ').toLowerCase().includes(state.query.toLowerCase())));
const count=f=>tasks.filter(t=>(t.workspace||'Workspace 1')===state.workspace&&(state.project==='所有项目'||t.project===state.project)&&(f==='all'||(f==='need'?t.status==='need'||t.status==='review':t.status==='running'))).length;
const chip=t=>`<span class="chip ${t.status}"><i class="dot"></i>${statuses[t.status]}</span>`;
function selector(type,values,value){return `<div class="scope"><select aria-label="${type==='workspace'?'切换工作空间':'筛选项目'}" data-control="${type}">${values.map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select></div>`}
function filters(){return `<div class="filters" aria-label="任务状态筛选">${[['all','全部'],['need','需要你'],['running','执行中']].map(([f,l])=>`<button data-filter="${f}" aria-pressed="${state.filter===f}">${l}<b>${count(f)}</b></button>`).join('')}</div>`}
function search(){return state.search?`<div class="search"><span class="icon">${icon('search')}</span><input data-search aria-label="搜索任务或成员" placeholder="搜索任务或成员" value="${esc(state.query)}">${ib('close','清除搜索','clear-search')}</div>`:''}
function rows(){return visible().length?visible().map(t=>`<button class="task-row" data-task="${t.id}" aria-current="${state.selected===t.id}"><span class="row-title"><i class="dot" style="color:${t.status==='need'?'var(--warning)':t.status==='running'?'var(--accent)':'var(--green)'}"></i><span>${esc(t.title)}</span></span><span class="row-meta"><span>${esc(t.project)} · ${esc(t.agent)}</span><span>${statuses[t.status]}</span></span></button>`).join(''):'<div class="empty small">没有匹配的任务</div>'}
function sidebar(){return `<aside class="sidebar ${state.mobile?'mobile-open':''}" aria-label="任务导航"><div class="side-actions"><button class="primary" data-action="new">${icon('plus')}新任务</button><div class="spacer"></div>${ib('search','搜索任务','search')}</div><div class="list-title">${selector('project',['所有项目','Norma-OS','官网','开发文档'],state.project)}${activeVariant===1?ib('close','收起任务列表','tasks'):''}</div>${search()}${filters()}<div class="tasks">${rows()}</div><div class="side-note"><i class="dot"></i>任务在后台持续推进</div></aside>`}
function appbar(){return `<header class="appbar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><div class="mark">N</div><span>Norma</span></div>${selector('workspace',['Workspace 1','个人工作空间'],state.workspace)}${activeVariant!==1?`<nav class="modes" aria-label="工作空间视图"><button data-mode="canvas" aria-current="${state.mode==='canvas'}">画布</button><button data-mode="staff" aria-current="${state.mode==='staff'}">幕僚</button></nav>`:''}<div class="spacer"></div>${ib('sun','切换浅色 / 深色','theme','data-theme')}${ib('help','原型使用说明','help')}<div class="avatar" title="Alan">A</div></header>`}
function rail(){return `<nav class="rail" aria-label="工作空间视图"><button class="primary" data-action="new" aria-label="新任务">${icon('plus')}</button><button data-mode="canvas" aria-current="${state.mode==='canvas'}">${icon('canvas')}画布</button><button data-mode="staff" aria-current="${state.mode==='staff'}">${icon('staff')}幕僚</button><div class="divider"></div><button data-action="tasks" aria-pressed="${state.drawer}" aria-label="展开任务列表">${icon('tasks')}任务</button><button data-action="files" aria-pressed="${state.inspector==='files'}">${icon('files')}文件</button><div class="spacer"></div></nav>`}
function worker(t){return `<div class="worker-line"><span class="avatar">${t.agent[0]}</span><span>${t.agent}<span class="subtle"> · ${t.engine}</span></span><span class="chip ${t.status}">${t.kind==='failure'?'未能启动':t.status==='running'?'正在执行':t.status==='done'||t.status==='review'?'结果已收到':'准备执行'}</span></div>`}
function plan(progress=1){return `<div class="plan"><div class="plan-head"><span>执行计划</span><span>${progress}/3 完成</span></div>${['搭建游戏画布与键盘控制','实现食物、计分与碰撞逻辑','检查开始、暂停与重新开始'].map((s,i)=>`<div class="plan-step ${i<progress?'done':i===progress?'active':''}"><span class="step-icon">${i<progress?'✓':i===progress?'<i class="spinner"></i>':'○'}</span>${s}</div>`).join('')}</div>`}
function assistant(body,time='刚刚'){return `<article class="message assistant"><div class="byline"><div class="mark">N</div>Norma<time>${time}</time></div>${body}</article>`}
function initialMessages(t){if(t.kind==='new')return assistant('<p>任务已记下。补充一下预期结果，我会先给出拆分建议，等你采用后再派发。</p>');let intro=`<article class="message user"><div class="bubble">${t.id==='snake'?'我想开发一个 HTML 贪吃蛇游戏，直接在浏览器里打开就能玩。':esc(t.title)}</div></article>`;
if(t.kind==='failure')return intro+assistant(`<p>这个任务还没有开始执行。Alan 的 Codex 启动后未就绪，任务内容尚未发送。</p><div class="status-note"><span class="icon">${icon('alert')}</span><span>需要处理 Worker 的启动状态，现有任务和消息已保留。</span></div>${worker(t)}<p class="subtle small">可以先查看执行详情，或者让我重新提出执行方案。</p><div class="message-actions"><button class="tonal" data-action="worker">${icon('terminal')}查看执行详情</button><button data-action="repropose">重新提议</button></div>`,'19:07');
if(t.kind==='running')return intro+assistant(`<p>正在调整页面在手机上的阅读顺序，导航和主按钮已完成。接下来检查表单与图片的窄屏表现。</p>${worker(t)}<div class="plan"><div class="plan-head"><span>执行计划</span><span>1/3 完成</span></div><div class="plan-step done">✓　调整导航与主按钮</div><div class="plan-step active"><i class="spinner"></i> 检查表单和图片布局</div><div class="plan-step">○　完成手机尺寸回归</div></div>`,'19:02');
if(t.kind==='review')return intro+assistant(`<p>接入文档已整理好，涵盖认证、请求示例和错误处理。你可以先打开文档检查，有需要我再继续修改。</p>${worker(t)}<div class="message-actions"><button class="tonal" data-action="files">${icon('files')}打开接入文档</button><button data-action="complete">验收通过</button></div>`,'18:43');
if(t.kind==='done')return intro+assistant(`<p>快捷键说明已补充完成，包括任务切换、消息发送和退出专注模式。</p>${worker(t)}<p class="subtle small">继续发消息会重新打开这个任务。</p><button class="tonal" data-action="files">${icon('files')}查看文档</button>`,'昨天');
return intro;}
function messages(t){return initialMessages(t)+t.extra.map(m=>m.role==='user'?`<article class="message user"><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div></article>`:assistant(m.html)).join('')+(t.waiting?assistant('<div class="waiting"><i class="spinner"></i>正在整理你的要求…</div>'):'');}
function conversation(){const t=task();if(!t||(t.workspace||'Workspace 1')!==state.workspace)return `<section class="conversation"><div class="empty"><div class="mark">N</div><h2>${state.workspace==='个人工作空间'?'给这个工作空间一个开始':'选择一项任务'}</h2><p>${state.workspace==='个人工作空间'?'这里还没有任务。新建任务后，Norma 会与你一起推进。':'从任务列表中选择，或交给 Norma 一件新事。'}</p><button class="primary" data-action="new">${icon('plus')}新任务</button></div></section>`;
return `<section class="conversation" aria-label="当前任务"><header class="task-header">${activeVariant===0?ib('tasks','展开任务列表','tasks','data-mobile'):''}${activeVariant===2?ib('back','返回任务收件箱','close-task'):''}<div class="task-heading"><div class="eyebrow">${esc(t.project)}${t.manual?' · 阶段由你设置':''}</div><h1>${esc(t.title)}</h1></div><div class="header-actions"><div class="scope phase"><select aria-label="任务阶段" data-control="phase">${['进行中','待验收','已完成'].map(p=>`<option ${t.phase===p?'selected':''}>${p}</option>`).join('')}</select></div>${activeVariant!==1?ib('files','打开任务文件','files'):''}${ib(state.focus?'close':'focus',state.focus?'退出专注':'专注当前任务','focus')}</div></header><div class="thread" id="thread"><div class="thread-inner">${messages(t)}</div></div><div class="composer-wrap"><form class="composer" id="composer"><textarea aria-label="给 Norma 发消息" placeholder="告诉 Norma 接下来做什么…">${esc(t.draft)}</textarea><div class="composer-footer"><span>Enter 换行 · ⌘ Enter 发送</span><button type="submit" class="primary send" aria-label="发送消息" ${t.draft.trim()&&!t.waiting?'':'disabled'}>${icon('send')}</button></div></form></div></section>`}
function inbox(){return `<section class="inbox" aria-label="任务收件箱"><div class="inbox-heading"><div><h1>任务</h1><p>在这里决定下一步，让工作继续。</p></div><button class="primary" data-action="new">${icon('plus')}新任务</button></div><div class="list-controls">${selector('project',['所有项目','Norma-OS','官网','开发文档'],state.project)}${filters()}${ib('search','搜索任务','search')}</div>${search()}<div class="table-head"><span>任务 / 项目</span><span>状态</span><span class="person">负责人</span><span class="when">更新</span></div>${visible().map(t=>`<button class="inbox-row" data-task="${t.id}" aria-current="${state.selected===t.id}"><span class="name">${esc(t.title)}<small>${esc(t.project)}</small></span>${chip(t)}<span class="person">${t.agent}</span><span class="count when">${t.time}</span></button>`).join('')||'<div class="empty">没有匹配的任务</div>'}</section>`}
function inspector(){if(!state.inspector)return '';const t=task();return `<aside class="inspector" aria-label="${state.inspector==='files'?'任务文件':'执行详情'}"><header><h2>${state.inspector==='files'?'任务文件':'执行详情'}</h2>${ib('close','关闭详情','close-inspector')}</header>${state.inspector==='files'?`<p>${t?.project||'Norma-OS'}</p><button class="file-row" data-action="preview-file">${icon('files')}${t?.id==='snake'?'需求说明.md':t?.id==='docs'?'API 接入指南.md':'更新说明.md'}</button>${state.preview?'<div class="preview-file"><strong>验收清单</strong><p>内容完整、示例可运行；清晰描述预期行为和边界条件。</p><p>这是原型中的文件预览。</p></div>':'<p>选择文件即可在这里预览。</p>'}`:`<div class="worker-line"><span class="avatar">A</span><span>${t?.agent||'Alan'} · ${t?.engine||'Codex'}</span></div><h3>尚未开始执行</h3><p>Worker 未在等待时间内报告就绪，任务内容尚未发送。</p><div class="logline">19:06:45　已创建 Worker</div><div class="logline">19:06:46　正在启动 Codex</div><div class="logline">19:07:45　等待就绪超时</div><h3>下一步</h3><p>先进入 Worker，查看是否需要登录、确认目录信任或处理启动错误。</p><button class="tonal" data-action="locate-worker">${icon('open')}在画布中定位</button>`}</aside>`}
function canvas(){return `<section class="canvas-view" aria-label="画布预览"><div class="canvas-cards"><div class="terminal"><header><span class="avatar">A</span>Alan · Codex<span class="spacer"></span><span class="chip need">等待就绪</span></header><pre>Codex\n\n工作目录：Norma-OS\n等待启动检查…\n\n任务尚未发送。</pre></div><div class="terminal"><header><span class="avatar">M</span>Mia · Claude<span class="spacer"></span><span class="chip running">执行中</span></header><pre>正在检查移动端布局\n\n✓ 导航与主按钮\n› 表单与图片\n○ 回归检查</pre></div></div><p class="canvas-caption">画布保留原位置 · 切回幕僚继续对话</p></section>`}
function renderVariant(v){activeVariant=v;return `<div class="app variant-${['split','focus','inbox'][v]} ${state.focus?'focused':''}">${appbar()}<div class="layout">${v===1?rail():''}${state.mode==='canvas'?canvas():`${v===0?sidebar():''}${v===1&&state.drawer?'<div class="scrim" data-action="tasks"></div>'+sidebar():''}${v===2?inbox():''}${v!==2||state.selected?conversation():''}${inspector()}`}</div></div>`}
function render(options={}){const thread=document.querySelector('#thread'),scroll=thread?.scrollTop;stage.innerHTML=renderVariant(activeVariant);if(options.bottom)requestAnimationFrame(()=>{const el=document.querySelector('#thread');if(el)el.scrollTop=el.scrollHeight});else if(scroll!==undefined&&document.querySelector('#thread'))document.querySelector('#thread').scrollTop=scroll;}
function toast(text){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.textContent=text;el.classList.remove('hidden');toastTimer=setTimeout(()=>el.classList.add('hidden'),2800)}
function newTask(){document.querySelector('#new-project').value=state.project==='所有项目'?'Norma-OS':state.project;document.querySelector('#new-dialog').showModal();document.querySelector('#new-title').focus()}
function updateFilters(){document.querySelectorAll('.tasks').forEach(el=>el.innerHTML=rows());if(activeVariant===2){const focus=document.querySelector('[data-search]'),pos=focus?.selectionStart;render();const input=document.querySelector('[data-search]');if(input){input.focus();input.setSelectionRange(pos,pos)}}}
function send(){const t=task();if(!t||!t.draft.trim()||t.waiting)return;const msg=t.draft.trim();t.extra.push({role:'user',text:msg});t.draft='';t.waiting=true;if(t.phase==='已完成'){t.phase='进行中';t.status='waiting'}render({bottom:true});setTimeout(()=>{t.waiting=false;t.extra.push({role:'assistant',html:'<p>收到。我会把这条补充要求加入任务，并先给你一个可确认的下一步。</p><div class="message-actions"><button class="tonal" data-action="repropose">查看执行提议</button></div>'});if(task()?.id===t.id)render({bottom:true})},1100)}
function propose(){const t=task();if(!t)return;t.status='need';t.extra.push({role:'assistant',html:`<p><strong>建议重新交给 ${esc(t.agent)}</strong></p><p>先确认 Worker 已就绪，再执行任务。目标是交付可直接打开的 HTML 文件，并检查键盘控制与重新开始。</p><div class="message-actions"><button class="primary" data-action="adopt">${icon('check')}采用并派发</button><button data-action="edit-proposal">修改要求</button></div>`});render({bottom:true})}
function adopt(){const t=task();if(!t||runs.has(t.id))return;const entry=t.extra.findLast(m=>m.html?.includes('data-action="adopt"'));if(entry)entry.html=entry.html.replace(/<div class="message-actions">[\s\S]*?<\/div>/,'<p class="chip done">✓ 已采用</p>');t.status='running';t.extra.push({role:'assistant',html:'<div class="waiting"><i class="spinner"></i>正在等待 Worker 就绪…</div>'});const run=t.extra[t.extra.length-1];runs.set(t.id,true);render({bottom:true});const update=(html,status)=>{run.html=html;if(status)t.status=status;if(task()?.id===t.id)render({bottom:true})};setTimeout(()=>update('<p>Alan 已就绪，开始搭建游戏。</p>'+plan(0)),900);setTimeout(()=>update('<p>画布和键盘控制已完成，正在加入计分与碰撞逻辑。</p>'+plan(1)),2200);setTimeout(()=>update('<p>主要逻辑已完成，正在检查暂停与重新开始。</p>'+plan(2)),3800);setTimeout(()=>{t.phase=t.manual?t.phase:'待验收';update('<p>HTML 贪吃蛇游戏已完成。这是原型演示结果，你可以打开文件或确认验收。</p>'+plan(3)+'<div class="message-actions"><button class="tonal" data-action="files">打开文件</button><button data-action="complete">验收通过</button></div>','review');runs.delete(t.id)},5400)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action]');if(!b||b.disabled)return;if(b.dataset.mode){state.mode=b.dataset.mode;state.focus=false;render();return}if(b.dataset.task){state.selected=b.dataset.task;state.mobile=false;state.drawer=false;state.inspector=null;render();return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}const a=b.dataset.action;if(!a)return;
if(a==='new')newTask();else if(a==='cancel-new')document.querySelector('#new-dialog').close();else if(a==='help')document.querySelector('#about-dialog').showModal();else if(a==='close-about')document.querySelector('#about-dialog').close();else if(a==='theme')document.body.classList.toggle('light');else if(a==='search'){state.search=!state.search;render();document.querySelector('[data-search]')?.focus()}else if(a==='clear-search'){state.query='';state.search=false;render()}else if(a==='tasks'){if(activeVariant===1){state.drawer=!state.drawer;state.search=true}else state.mobile=!state.mobile;render()}else if(a==='files'){state.inspector=state.inspector==='files'?null:'files';state.preview=false;render()}else if(a==='worker'){state.inspector='worker';render()}else if(a==='close-inspector'){state.inspector=null;render()}else if(a==='preview-file'){state.preview=!state.preview;render()}else if(a==='locate-worker'){state.mode='canvas';state.inspector=null;render()}else if(a==='focus'){state.focus=!state.focus;render()}else if(a==='close-task'){state.selected=null;render()}else if(a==='repropose')propose();else if(a==='edit-proposal'){task().draft+='\n调整要求：';render();document.querySelector('#composer textarea')?.focus()}else if(a==='adopt')adopt();else if(a==='complete'){const t=task();t.status='done';t.phase='已完成';t.extra.push({role:'assistant',html:'<p>已记录验收通过。之后有新要求，继续在这里发消息即可。</p>'});render({bottom:true});toast('任务已完成')}});
document.addEventListener('change',e=>{const c=e.target.dataset.control;if(c==='workspace'){state.workspace=e.target.value;state.selected=tasks.find(t=>(t.workspace||'Workspace 1')===state.workspace)?.id||null;state.inspector=null;state.project='所有项目';state.query='';state.filter='all';render()}else if(c==='project'){state.project=e.target.value;render()}else if(c==='phase'){const t=task();t.phase=e.target.value;t.manual=true;t.status=t.phase==='已完成'?'done':t.phase==='待验收'?'review':'waiting';render();toast('阶段已设置，Norma 会保留你的选择')}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){state.query=e.target.value;updateFilters()}else if(e.target.matches('#composer textarea')){task().draft=e.target.value;document.querySelector('.send').disabled=!e.target.value.trim()||task().waiting}});
document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();send()}if(e.target.id==='new-form'){e.preventDefault();const title=document.querySelector('#new-title').value.trim();if(!title)return;const id='task-'+Date.now();tasks.unshift({id,title,workspace:state.workspace,project:document.querySelector('#new-project').value,status:'waiting',phase:'进行中',agent:'Alan',engine:'Codex',kind:'new',time:'刚刚',draft:'',extra:[]});state.selected=id;state.mode='staff';state.filter='all';state.project='所有项目';state.query='';state.drawer=false;state.mobile=false;document.querySelector('#new-dialog').close();e.target.reset();render();document.querySelector('#composer textarea')?.focus()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target.matches('#composer textarea')){e.preventDefault();send()}if(e.key==='Escape'&&!document.querySelector('dialog[open]')){state.inspector=null;state.drawer=false;state.mobile=false;state.focus=false;render()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.search=true;if(activeVariant===1)state.drawer=true;else if(innerWidth<760)state.mobile=true;render();document.querySelector('[data-search]')?.focus()}});
const variants=[()=>renderVariant(0),()=>renderVariant(1),()=>renderVariant(2)];
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script></body></html>
