const data={proposal:{title:'修复父子会话的状态串扰',agent:'Henry',kind:'next',glyph:'spark'},question:{title:'确认这次修复的验证顺序',agent:'Kimi',kind:'question',glyph:'question'},decision:{title:'允许运行会话归因测试？',agent:'Codex',kind:'decision',glyph:'shield'}};
const answerTexts={reproduce:'先补可复现的回归测试',trace:'先采集 provider 原始事件'};
const glyphs={spark:'<path d="m8 1.5 1.8 4.7L14.5 8l-4.7 1.8L8 14.5 6.2 9.8 1.5 8l4.7-1.8Z"/>',question:'<rect x="1.5" y="1.5" width="13" height="13" rx="4"/><path d="M5.8 5.6a2.3 2.3 0 0 1 4.6.2c0 1.6-2.3 1.7-2.3 3.3M8.1 11.9v.1"/>',shield:'<path d="m8 1.5 5.5 2v4.7c0 2.8-3.2 5.3-5.5 6.3-2.3-1-5.5-3.5-5.5-6.3V3.5Z"/><path d="m5.5 8 1.7 1.7L11 6"/>',arrow:'<path d="M3 8h10M9 4l4 4-4 4"/>',chevron:'<path d="m6 4 4 4-4 4"/>',check:'<path d="m3 8 3 3 7-7"/>',clock:'<circle cx="8" cy="8" r="6"/><path d="M8 4.5v4l2.5 1.5"/>',sun:'<circle cx="8" cy="8" r="3"/><path d="M8 1v1M8 14v1M1 8h1M14 8h1M3 3l.7.7M12.3 12.3l.7.7M3 13l.7-.7M12.3 3.7l.7-.7"/>',moon:'<path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5Z"/>',home:'<path d="m2 7 6-5 6 5v7H2Z"/><path d="M6 14V9h4v5"/>',grid:'<rect x="2" y="2" width="4" height="4" rx="1"/><rect x="10" y="2" width="4" height="4" rx="1"/><rect x="2" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/>',activity:'<path d="M1 8h3l2-5 4 10 2-5h3"/>',gear:'<circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/>',pin:'<path d="M6 2h5l-1 4 3 3H3l3-3ZM8 9v5"/>',layers:'<path d="m8 2 6 3-6 3-6-3ZM2 8l6 3 6-3M2 11l6 3 6-3"/>'};
let locale='zh',theme='dark',scenario='busy',open=null,dispatchEpoch=0;
const state={proposal:null,question:null,decision:null,answer:null,custom:'',error:false,pending:false};
const order=['proposal','question','decision'];
const stage=document.getElementById('stage');
const t=key=>messages[locale][key]||key;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>'<svg viewBox="0 0 16 16" aria-hidden="true">'+glyphs[name]+'</svg>';
const button=(label,action,kind='',disabled=false)=>'<button class="button '+kind+'" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+label+'</button>';
const fact=(key,copy)=>'<div class="fact"><span class="fact-label">'+t(key)+'</span><p>'+copy+'</p></div>';
function original(id){return '<details class="original"><summary data-original>'+icon('chevron')+t(id==='proposal'?'original':id==='question'?'originalQuestion':'originalDecision')+'</summary><div class="original-copy">'+esc(originals[id])+'</div></details>'}
function actions(id){
  if(id==='proposal')return button(t('defer'),'defer','quiet')+button(t(state.pending?'dispatching':scenario==='busy'?'busyAction':'dispatch')+icon(scenario==='busy'?'clock':'arrow'),'dispatch','primary',scenario==='busy'||state.pending);
  if(id==='question')return button(t('delegate'),'delegate','quiet')+button(t('answer')+icon('arrow'),'answer','primary',!state.answer||(state.answer==='custom'&&!state.custom.trim()));
  return button(t('reject'),'reject','quiet')+button(t('allow')+icon('check'),'allow','primary');
}
function receipt(id){const r=state[id];return '<div class="receipt" data-receipt role="status" tabindex="-1"><div class="receipt-title">'+icon('check')+t(r.key)+'</div><p>'+esc(r.localized?t(r.detail):r.detail)+'</p><div class="actions"><small>'+t('demoReceipt')+'</small>'+button(t('undo'),'undo','quiet')+'</div></div>'}
function detail(id){
  if(state[id])return receipt(id);
  let content='';
  if(id==='proposal')content='<ul class="task-steps"><li><strong>核对证据</strong>：官方协议 + 各 Agent 真实事件。</li><li><strong>修复串扰</strong>：隔离 Grok / OpenCode 父子会话。</li><li><strong>补齐测试</strong>：覆盖延迟 Stop、后台退出与漏报。</li></ul>'+fact('reason','子会话和后台任务可能误改主任务状态。')+fact('deliverable','可复现案例 + 聚焦回归测试。')+original(id);
  if(id==='question'){
    content='<p class="question-prompt">先补回归测试，还是先采集原始事件？</p><div class="recommendation"><strong>'+t('recommend')+'</strong><span>先补测试，更快复现问题。</span></div><div class="question-options">';
    [['reproduce',answerTexts.reproduce],['trace',answerTexts.trace],['custom',t('custom')]].forEach(([key,label])=>{content+='<label class="option"><input type="radio" name="answer" value="'+key+'" '+(state.answer===key?'checked':'')+'><span>'+esc(label)+'</span>'+(key==='reproduce'?'<span class="recommended">'+t('recommended')+'</span>':'')+'</label>'});
    content+='</div>'+(state.answer==='custom'?'<textarea class="custom-input" aria-label="'+t('custom')+'" placeholder="'+t('placeholder')+'">'+esc(state.custom)+'</textarea>':'')+original(id);
  }
  if(id==='decision')content=fact('purpose','验证父子会话归因与完成状态。')+'<div class="command">cargo test -p norma<br>--test agent_hook_completion_window_tests</div><div class="permission-scope">'+icon('shield')+t('scope')+'</div>'+original(id);
  return content+(id==='question'?'<div class="actions">'+actions(id)+'</div>':'');
}
function item(id){
  const d=data[id],expanded=open===id;
  let status='';
  if(state[id])status='<span class="meta-dot">·</span><span class="status-done">'+t('done')+'</span>';
  else if(id==='proposal')status='<span class="meta-dot">·</span><span class="'+(scenario==='busy'?'status-busy':'')+'">'+t(scenario==='busy'?'busyShort':'readyShort')+'</span>';
  const external=id==='question'?'':'<div class="row-actions" role="group" aria-label="'+d.agent+' · '+t(d.kind)+'">'+(state[id]?'<span class="row-result" role="status" tabindex="-1">'+icon('check')+t(state[id].key)+'</span>':actions(id))+'</div>';
  return '<article class="task-item '+id+'" data-card="'+id+'"><div class="item-row"><button class="item-header" data-toggle="'+id+'" aria-expanded="'+expanded+'" aria-controls="body-'+id+'"><span class="type-icon">'+icon(d.glyph)+'</span><span class="header-copy"><span class="item-title">'+esc(d.title)+'</span><span class="item-meta"><span>'+t(d.kind)+'</span><span class="meta-dot">·</span><span>'+d.agent+'</span>'+status+'</span></span>'+icon('chevron').replace('<svg ','<svg class="chevron" ')+'</button>'+external+'</div>'+(id==='proposal'&&state.error?'<div class="error-message row-error" data-error role="alert">'+t('error')+'</div>':'')+(expanded?'<div class="expanded-body" id="body-'+id+'">'+detail(id)+'</div>':'')+'</article>';
}
function overview(){const n=order.filter(id=>!state[id]).length;return '<section class="overview"><div class="overview-header"><div class="title-line"><h2 class="overview-heading">'+t('overview')+'</h2>'+icon('pin')+'</div><div class="overview-subtitle"><i class="dot"></i>'+t('updated')+'</div><div class="stats">'+[['pending',n],['running',1],['queued',5]].map(([key,count])=>'<div class="stat"><strong>'+count+'</strong><span>'+t(key)+'</span></div>').join('')+'</div></div><div class="overview-scroll"><div class="section-label"><span>'+t('attention')+'</span><small>'+t('expandHint')+'</small></div><div class="attention-list">'+order.map(item).join('')+'</div><div class="section-label"><span>'+t('running')+'</span><small>1</small></div><div class="job-row"><i class="dot"></i><div class="job-copy"><div class="job-title">'+t('runningTitle')+'</div><div class="job-sub">'+t('runningSub')+'</div></div><span class="job-state">'+t('runningDuration')+'</span></div><div class="queue-note">'+icon('layers')+t('queuedText')+'</div><details class="history"><summary><span>'+t('history')+'</span><span>'+t('historyCount')+' ›</span></summary>'+['historyOne','historyTwo','historyThree'].map(key=>'<div class="history-line">'+t(key)+'</div>').join('')+'</details></div><div class="footer-status"><i class="dot"></i>'+t('automatic')+'</div></section>'}
function workspace(){return '<section class="workspace"><div class="project-title">Agent Runtime</div><div class="project-sub">Norma-AI-OS / main</div><div class="terminal"><div class="terminal-top"><span class="avatar">H</span><span>Henry</span><span class="agent-kind">Claude</span></div><div class="terminal-code"><span>❯ Check cross-agent completion semantics</span><span>  Reading provider event traces…</span><span class="code-green">  ✓ Claude hook lifecycle</span><span class="code-blue">  → OpenCode parent / child isolation</span><span>    awaiting background task events</span></div></div><div class="terminal second"><div class="terminal-top"><span class="avatar">C</span><span>Codex</span><span class="agent-kind">'+t('decision')+'</span></div><div class="terminal-code"><span>$ cargo test -p norma</span><span>  --test agent_hook_completion_window_tests</span><span>  '+t('attention')+'</span></div></div><div class="canvas-note"><strong>'+t('canvasTitle')+'</strong>'+t('canvasNote')+'<br><span>'+t('canvasLabel')+'</span></div></section>'}
function render(){const scroll=stage.querySelector('.overview-scroll')?.scrollTop||0;stage.innerHTML='<div class="app-window"><div class="window-bar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="window-title"><b>Norma OS</b><span>/</span><span>Norma-AI-OS</span></div><span class="demo-hint">'+t('demo')+'</span></div><div class="window-body"><aside class="app-rail" aria-hidden="true">'+['home','activity','grid','layers','gear'].map((key,i)=>'<div class="rail-icon '+(i===1?'active':i===4?'rail-bottom':'')+'">'+icon(key)+'</div>').join('')+'</aside>'+overview()+workspace()+'</div></div>';stage.querySelector('.overview-scroll').scrollTop=scroll;}
function chrome(){document.documentElement.lang=locale==='zh'?'zh-CN':'en';document.documentElement.dataset.theme=theme;document.title=locale==='zh'?'Norma · 紧凑幕僚卡片':'Norma · Compact staff cards';document.getElementById('prototype-title').textContent=t('title');document.getElementById('prototype-subtitle').textContent=t('subtitle');const s=document.getElementById('scenario');s.innerHTML=['busy','ready','failure'].map(key=>'<option value="'+key+'" '+(key===scenario?'selected':'')+'>'+t(key)+'</option>').join('');s.setAttribute('aria-label',t('scenario'));const lang=document.getElementById('language-toggle');lang.textContent=locale==='zh'?'EN':'中文';lang.setAttribute('aria-label',locale==='zh'?'Switch to English':'切换为中文');const themeButton=document.getElementById('theme-toggle');themeButton.innerHTML=icon(theme==='dark'?'sun':'moon')+t(theme==='dark'?'light':'dark');themeButton.setAttribute('aria-label',t(theme==='dark'?'light':'dark'));}
function focusHeader(id){stage.querySelector('[data-toggle="'+id+'"]').focus({preventScroll:true})}
function complete(id,key,detail,localized=false){state[id]={key,detail,localized};state.pending=false;state.error=false;render();stage.querySelector('[data-card="'+id+'"] [data-receipt], [data-card="'+id+'"] .row-result')?.focus({preventScroll:true})}
stage.addEventListener('click',e=>{
  const toggle=e.target.closest('[data-toggle]');if(toggle){const id=toggle.dataset.toggle;open=open===id?null:id;render();focusHeader(id);return;}
  const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;
  if(action==='dispatch'){
    if(scenario==='busy'||state.pending)return;state.pending=true;state.error=false;const epoch=++dispatchEpoch;render();
    setTimeout(()=>{if(epoch!==dispatchEpoch)return;state.pending=false;if(scenario==='failure'){state.error=true;render();if(open==='proposal')stage.querySelector('[data-action="dispatch"]')?.focus({preventScroll:true})}else complete('proposal','receiptDispatch',data.proposal.title)},250);return;
  }
  if(action==='defer')complete('proposal','receiptDefer','dismissed',true);
  if(action==='answer'&&state.answer&&(state.answer!=='custom'||state.custom.trim()))complete('question','receiptAnswer',state.answer==='custom'?state.custom:answerTexts[state.answer]);
  if(action==='delegate')complete('question','receiptDelegate','delegated',true);
  if(action==='allow')complete('decision','receiptAllow','allowed',true);
  if(action==='reject')complete('decision','receiptReject','rejected',true);
  if(action==='undo'){const id=el.closest('[data-card]').dataset.card;state[id]=null;render();focusHeader(id);}
});
stage.addEventListener('change',e=>{if(e.target.matches('input[name="answer"]')){state.answer=e.target.value;render();stage.querySelector('input[value="'+state.answer+'"]')?.focus({preventScroll:true})}});
stage.addEventListener('input',e=>{if(e.target.matches('textarea')){state.custom=e.target.value;stage.querySelector('[data-action="answer"]').disabled=!state.custom.trim()}});
document.getElementById('scenario').addEventListener('change',e=>{scenario=e.target.value;state.proposal=null;state.pending=false;state.error=false;dispatchEpoch++;render()});
document.getElementById('language-toggle').addEventListener('click',()=>{locale=locale==='zh'?'en':'zh';chrome();render()});
document.getElementById('theme-toggle').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';chrome()});
chrome();render();
</script>
</body>
</html>
