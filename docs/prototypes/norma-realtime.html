.proto-picker {
  position: fixed;
  width: max-content; /* Keep the translated labels on one line on narrow screens. */
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>

<script id="realtime-model">
function initialRealtime(){
  return {project:'Norma OS',viewProject:'Norma OS',page:'command',call:false,online:true,muted:false,quiet:false,locked:false,draft:'',composer:'',operation:1,receipts:{},notice:'',reply:'把想法，聊成下一步。',chat:[],tasks:[
    {id:'voice',title:'改善耳机切换体验',agent:'Codex',platform:'mobile',project:'Norma OS',status:'running',summary:'正在验证蓝牙耳机断开后的音频恢复。',seen:false},
    {id:'web',title:'项目概览，更清楚一点',agent:'Claude',platform:'web',project:'Norma OS',status:'review',summary:'页面与交互自检已结束，等你打开预览。',seen:false},
    {id:'desktop',title:'整理桌面 Agent 卡片',agent:'Codex',platform:'desktop',project:'Norma OS',status:'review',summary:'已整理卡片层级与间距，需要在 Mac 上实际操作。',seen:false}
  ]};
}
function act(s,a){
  const result=(ok,message)=>{s.notice=message;return {ok,message};};
  if(a.type==='discard'){s.draft='';return result(true,'当前草稿已放弃');}
  if(a.type==='start'){s.call=true;s.reply='我在听，今天想推进什么？';return result(true,'通话已开始（演示）');}
  if(a.type==='hangup'){s.call=false;s.locked=false;s.reply='先忙你的，Agent 会继续。';return result(true,'通话已结束，已派任务继续运行');}
  if(a.type==='connection'){s.online=!s.online;return result(true,s.online?'Mac 已重连；草稿尚未派工':'Mac 离线，仍可讨论；任务状态为最后快照');}
  if(a.type==='browse'){if(!['Norma OS','Studio Site'].includes(a.project))return result(false,'未知项目');s.viewProject=a.project;s.page='projects';return result(true,'正在浏览 '+a.project+'，通话仍绑定 '+s.project);}
  if(a.type==='bind'){if(!['Norma OS','Studio Site'].includes(a.project))return result(false,'未知项目');if(s.draft)return result(false,'请先安排当前草稿，或明确放弃草稿后切换');s.project=a.project;s.viewProject=a.project;return result(true,'通话已切换到 '+a.project);}
  if(a.type==='discuss'){
    if(!s.call)return result(false,'先开始通话，再聊一个想法');
    const text=(a.text||'').trim();if(!text)return result(false,'先写下一点想法');
    s.draft=text;s.operation++;s.chat.push({role:'user',text});
    s.reply='我先记下这个方向。可以继续聊细节，决定动手时我来安排。';
    s.chat.push({role:'norma',text:s.reply});return result(true,'想法已整理，还没有派工');
  }
  if(a.type==='dispatch'){
    if(!s.online)return result(false,'Mac 离线，想法已保留，尚未派工');
    if(!s.call)return result(false,'开始通话后再安排草稿');
    if(!a.operation)return result(false,'缺少操作标识');
    if(s.receipts[a.operation])return result(true,'已核对接收回执，不重复派工');
    if(!s.draft)return result(false,'先聊一个想法');
    const task={id:'task-'+s.operation,title:s.draft,agent:'Codex',platform:'mobile',project:s.project,status:'running',summary:'已接收目标与交付要求，正在实现；界面完成后交给你验收。',seen:false};
    s.tasks.unshift(task);s.receipts[a.operation]=task.id;s.draft='';s.reply='已交给 Codex，做好后请你看页面。我们可以接着聊。';
    s.chat.push({role:'norma',text:s.reply});return result(true,'Codex 已接收 · '+s.project);
  }
  if(a.type==='mute'){s.muted=!s.muted;return result(true,s.muted?'麦克风已静音（演示）':'已恢复聆听（演示）');}
  if(a.type==='quiet'){s.quiet=!s.quiet;return result(true,s.quiet?'先不播报，任务照常继续':'恢复汇报，合并提醒待验收成果');}
  if(a.type==='interrupt'){s.reply='好，你说。我在听。';return result(true,'已打断回复，任务继续（演示）');}
  if(a.type==='lock'){if(!s.call)return result(false,'开始通话后体验锁屏');s.locked=!s.locked;return result(true,s.locked?'锁屏示意：音频继续，角色停止渲染':'已回到指挥台');}
  const t=s.tasks.find(t=>t.id===a.id);if(!t)return result(false,'找不到这个任务');
  if(a.type==='inspect'){if(t.status!=='review')return result(false,'成果还未准备好');t.seen=true;return result(true,'已打开成果示例');}
  if(!s.online)return result(false,'Mac 离线，这个操作尚未提交');
  if(a.type==='complete'){if(t.status!=='running')return result(false,'任务当前不在执行');t.status='review';t.seen=false;t.summary='实现与自检已结束，需要你查看页面和交互。';if(s.call&&!s.quiet)s.reply='有一份界面做好了，已放到待你验收。方便时看一下就好。';return result(true,s.call&&s.quiet?'成果已进入待验收，稍后合并汇报':'实现已结束 · 待你验收');}
  if(a.type==='accept'){if(t.status!=='review'||!t.seen)return result(false,'先查看这份成果，再确认验收');t.status='done';return result(true,'验收通过 · 决定已同步（演示）');}
  if(a.type==='feedback'){if(t.status!=='review')return result(false,'当前不能提交验收反馈');if(!(a.text||'').trim())return result(false,'请写下需要调整的地方');t.feedback=a.text.trim();t.status='running';t.seen=false;t.summary='已收到你的修改意见，沿用原任务继续调整。';return result(true,'修改意见已交回 '+t.agent+'（演示）');}
  return result(false,'未支持的操作');
}
</script>
<script>

const escapeHtml=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+symbols[name]+'"/></svg>';
const mark='<svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 27L14 8h4l-2 17L26 8h5L20 29h-6l2-17L9 27z" fill="currentColor"/></svg>';

function wave(){return '<span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>';}

function taskRows(tasks){return tasks.map(t=>'<button class="task-row" data-task="'+t.id+'" aria-label="查看任务：'+escapeHtml(t.title)+'"><span class="agent-icon '+(t.agent==='Claude'?'claude':'')+'">'+(t.agent==='Claude'?'✳':'⌁')+'</span><span class="task-content"><b>'+escapeHtml(t.title)+'</b><small>'+t.agent+' · '+platforms[t.platform]+' · <span class="status-'+t.status+'">'+(state.online?'':'上次同步 · ')+names[t.status]+'</span></small></span>'+icon('chevron')+'</button>').join('')||'<p class="empty">这个项目还没有任务。可以先和 Norma 聊聊。</p>';}
function draftCard(){return state.draft?'<section class="draft"><small>讨论已整理 · '+escapeHtml(state.project)+'</small><p>'+escapeHtml(state.draft)+'</p>'+button('dispatch','就这样，交给 Agent 执行 '+icon('arrow'),'secondary','aria-label="交给 Agent 执行"')+'</section>':'';}

function companionView(){

}
function conversationView(){return '<div class="avatar-chip"><div class="small-avatar">'+avatar()+'</div><div><h2>和 Norma 接着聊</h2><p>'+escapeHtml(state.project)+' · 一次对话，一条脉络</p></div></div>'+(!state.chat.length?'<h2 class="chat-intro">想法不用完整，<br>先说出来就好。</h2><div class="message norma"><div class="who">NORMA</div><p>'+escapeHtml(state.reply)+'</p></div>':state.chat.slice(-6).map(m=>'<div class="message '+m.role+'"><div class="who">'+(m.role==='user'?'你':'NORMA')+'</div><p>'+escapeHtml(m.text)+'</p></div>').join(''))+draftCard()+talkInput()+'<div class="section-heading"><h2>这段对话关联的任务</h2></div>'+taskRows(state.tasks.filter(t=>t.project===state.project).slice(0,2));}
function dispatchView(){
  const tasks=state.tasks.filter(t=>t.project===state.project);
  return '<h2 class="work-title">事情正在向前。</h2><p class="muted" style="font-size:11px;margin-top:7px">'+escapeHtml(state.project)+' · '+(state.online?'刚刚同步':'最后快照')+'</p><div class="metric-row">'+['running','review','done'].map(st=>'<div class="metric"><strong>'+tasks.filter(t=>t.status===st).length+'</strong><small>'+names[st]+'</small></div>').join('')+'</div><div class="queue-card"><div class="row between"><span class="eyebrow">NORMA · 在你身边</span>'+statusLine()+'</div><p>'+escapeHtml(state.reply)+'</p>'+button('idea','聊一个新想法 '+icon('arrow'),'secondary')+'</div>'+draftCard()+'<div class="section-heading"><h2>Agent 正在做的事</h2><span>'+tasks.length+' 项</span></div>'+taskRows(tasks);
}
function projectView(){return '<h2 class="work-title">'+escapeHtml(state.viewProject)+'</h2><p class="muted" style="font-size:11px;margin:7px 0 15px">当前浏览项目 · 通话绑定 '+escapeHtml(state.project)+'</p>'+button('browse-project','浏览其他项目 '+icon('down'),'secondary')+(state.viewProject!==state.project?button('bind','将通话切到此项目','secondary','style="margin-top:10px"'):'')+'<div class="section-heading"><h2>项目 Agent 卡片</h2></div>'+taskRows(state.tasks.filter(t=>t.project===state.viewProject));}
function resultsView(){return '<h2 class="work-title">等你看一眼。</h2><p class="muted" style="font-size:12px;margin:10px 0 22px">界面和交互做好后，由你确认最后一步。<br>现在不方便看，其他任务会继续。</p><div class="section-heading"><h2>待你验收</h2><span>Web · 手机端 · 桌面端</span></div>'+taskRows(state.tasks.filter(t=>t.status==='review'&&t.project===state.project))+'<div class="section-heading"><h2>已经确认</h2></div>'+taskRows(state.tasks.filter(t=>t.status==='done'&&t.project===state.project));}
function controls(){return state.call?'<div class="call-actions">'+button('mute',icon('mic'),'round','aria-label="'+(state.muted?'取消静音':'静音')+'" aria-pressed="'+state.muted+'"')+button('interrupt',icon('chat'),'round','aria-label="打断回复"')+button('quiet',icon('bell'),'round','aria-label="'+(state.quiet?'恢复汇报':'先别汇报')+'" aria-pressed="'+state.quiet+'"')+button('hangup',icon('phone'),'round hangup','aria-label="结束通话"')+'</div>':button('start',icon('headphones')+' 和 Norma 聊聊','primary','aria-label="开始通话"');}
function mobileDemo(){return '<details class="mobile-demo"><summary>原型演示控制 · 不采集麦克风</summary><div class="scenarios">'+button('connection',state.online?'模拟 Mac 离线':'模拟 Mac 重连')+button('lock','体验锁屏')+button('complete-next','模拟任务完成')+'</div><p class="demo-note">角色为示意。语音、回执、构建和通知均为本地模拟。</p></details>';}
function phone(){

  return '<div class="statusbar" aria-hidden="true"><span>9:41</span><span class="island"></span><span>▥ ◔ <i class="battery"></i></span></div><div class="screen"><header class="appbar">'+button('project','<small>本次通话的项目</small><strong>'+escapeHtml(state.project)+' ⌄</strong>','project-button','aria-label="通话项目"')+'<div class="row">'+statusLine()+button('lock',icon('lock'),'round','aria-label="体验锁屏"')+'</div></header>'+(!state.online?'<div class="banner">Mac 暂时离线。可以继续聊，想法先保留；下方为最后同步状态。</div>':'')+(state.notice?'<p class="phone-notice" role="status">'+escapeHtml(state.notice)+'</p>':'')+'<section class="main" aria-label="指挥台内容">'+(state.page==='projects'?projectView():state.page==='results'?resultsView():[companionView,conversationView,dispatchView][current]())+mobileDemo()+'</section><div class="call-dock">'+controls()+'<p class="call-caption">'+(state.call?'通话中 · '+escapeHtml(state.project)+' · '+(state.quiet?'稍后汇报':'随时可以插话'):'实时语音原型 · 点击体验通话流程')+'</p></div><nav class="bottom-nav" aria-label="应用导航">'+[['projects','tasks','项目'],['command','spark','指挥台'],['results','check','成果']].map(([page,ic,label])=>button('page-'+page,icon(ic)+label,'','aria-current="'+(state.page===page?'page':'false')+'"')).join('')+'</nav></div><div class="home-line"></div>';

function renderVariant(index){
  const d=directions[index];
  return '<div class="studio"><aside class="intro"><div class="brand">'+mark+'norma <span class="muted" style="font-size:12px;letter-spacing:0;font-weight:400">/ iOS</span></div><div class="eyebrow">REALTIME COMPANION · '+String(index+1).padStart(2,'0')+'</div><h1>'+d.title.split('\n').join('<br>')+'</h1><p>'+d.description+'</p><div class="concept-axis"><b>'+d.axis+'</b><span class="muted">'+d.cost+'</span></div><footer>按 1 / 2 / 3 切换方向 · R 重播<br><a href="norma-ios.html">返回完整工作台原型 ↗</a></footer></aside><section class="phone" aria-label="Norma iPhone 原型">'+phone()+'</section><aside class="review" aria-label="原型演示控制"><p class="eyebrow">从一个想法，到一份成果</p>'+button('start','<span>01</span><div><b>戴上耳机，开始聊</b><small>一次通话绑定一个项目</small></div>','route-step')+button('idea','<span>02</span><div><b>先聊聊，再决定做</b><small>想法整理成草稿，讨论不派工</small></div>','route-step')+button('dispatch','<span>03</span><div><b>交给合适的 Agent</b><small>收到回执，继续你的对话</small></div>','route-step','aria-label="演示派工"')+button('complete-next','<span>04</span><div><b>做好了，等你看一眼</b><small>模拟完成 → 预览 → 验收或修改</small></div>','route-step')+'<div class="scenarios">'+button('connection',state.online?'模拟 Mac 离线':'模拟 Mac 重连')+button('lock','体验锁屏')+button('reset','重置演示')+'</div><p class="demo-note">交互原型 · 无真实任务执行<br>不采集麦克风，角色为示意。<br>语音、回执、构建和通知均为模拟。</p><p class="toast" role="status" aria-live="polite">'+escapeHtml(state.notice)+'</p></aside></div>';
}
function render(){
  const scroll=document.querySelector('.main')?.scrollTop||0;
  stage.innerHTML=renderVariant(current);
  const main=document.querySelector('.main');if(main)main.scrollTop=scroll;
}
function showSheet(title,body){
  const sheet=document.getElementById('sheet');if(!sheet.open)lastFocus=document.activeElement;
  sheet.innerHTML='<div class="dialog-head"><h2 id="sheet-title">'+title+'</h2>'+button('close',icon('close'),'','aria-label="关闭弹层"')+'</div>'+body+'<p id="sheet-message" role="status" class="toast"></p>';
  if(!sheet.open)sheet.showModal();
}
function showProjects(browse=false){showSheet(browse?'浏览项目':'本次通话的项目','<p class="muted">浏览页面不会改变派工目标。切换通话项目需要明确选择。</p>'+['Norma OS','Studio Site'].map(p=>'<button class="project-choice" data-project="'+p+'" data-browse="'+browse+'"><span>'+p+'</span><span>'+(p===state.project?'通话中':icon('chevron'))+'</span></button>').join(''));}
function showTask(id){
  detailId=id;previewBefore=false;
  const t=state.tasks.find(t=>t.id===id);if(!t)return;
  showSheet('任务进展','<p class="badge">'+t.agent+' · '+platforms[t.platform]+' · '+escapeHtml(t.project)+'</p><h3 style="font-size:18px;margin:15px 0">'+escapeHtml(t.title)+'</h3><p>'+escapeHtml(t.summary)+'</p>'+(t.feedback?'<div class="feedback-record">你的意见：'+escapeHtml(t.feedback)+'</div>':'')+'<p class="evidence">'+(state.online?'':'最后同步 · ')+names[t.status]+'</p>'+(t.status==='review'?button('open-preview',icon('check')+' 查看成果并验收','primary'):t.status==='running'?button('complete', '模拟此任务完成','secondary'): '<p class="badge">'+icon('check')+' 已经由你验收</p>'));
}
function showPreview(){
  const t=state.tasks.find(t=>t.id===detailId);if(!t)return;
  const description={web:'交互预览示例 · 点击前后版本，体验页面变化。',mobile:'测试构建与录屏入口示例 · 正式验收要在对应手机上实际操作。',desktop:'截图与录屏入口示例 · 正式验收要在 Mac 上实际操作。'}[t.platform];
  showSheet('看看这次改动','<p class="badge">'+platforms[t.platform]+' · '+escapeHtml(t.project)+'</p><h3 style="margin:12px 0">'+escapeHtml(t.title)+'</h3><p class="muted">'+description+'</p><div class="artifact"><div class="version-tabs" role="tablist" aria-label="对比版本">'+button('before','修改前','','role="tab" aria-selected="'+previewBefore+'"')+button('after','修改后','','role="tab" aria-selected="'+!previewBefore+'"')+'</div><div class="preview '+(previewBefore?'before':'')+'"><h3>你的项目，正在向前。</h3><p>'+(previewBefore?'所有工作集中在一张列表。':'重要的进展，放在你看得见的地方。')+'</p><div class="preview-cards"><div>Codex<br><b>语音派工</b><p>正在实现</p></div><div>Claude<br><b>项目概览</b><p>等你验收</p></div></div></div></div><p class="evidence"><strong>演示验证记录</strong><br>页面流程：通过（示例）<br>对应设备实际操作：待你验证</p>'+(t.platform!=='web'?button('build-info','查看测试构建 / 录屏说明','secondary'):'')+'<div class="action-pair">'+button('accept','我看过了，验收通过','primary')+button('later','稍后再看','secondary')+'</div><form id="feedback-form"><label class="field">需要调整的地方<textarea name="feedback" placeholder="例如：卡片间距再大一点…" required maxlength="400"></textarea></label>'+button('submit','把修改意见交回 Agent','secondary','type="submit"')+'</form>');
}
document.addEventListener('click',event=>{
  const target=event.target.closest('button');if(!target||target.disabled||target.closest('.proto-picker'))return;
  if(target.dataset.task){showTask(target.dataset.task);return;}
  if(target.dataset.project){
    if(target.dataset.drop==='true')act(state,{type:'discard'});
    const result=act(state,{type:target.dataset.browse==='true'?'browse':'bind',project:target.dataset.project});
    if(!result.ok){document.getElementById('sheet-message').innerHTML=escapeHtml(result.message)+'<button class="secondary" data-project="'+escapeHtml(target.dataset.project)+'" data-browse="false" data-drop="true">放弃当前草稿并切换</button>';return;}
    document.getElementById('sheet').close();render();return;
  }
  const action=target.dataset.action;if(!action||action==='submit')return;
  if(action==='close'||action==='later'){document.getElementById('sheet').close();return;}
  if(action==='project'||action==='browse-project'){showProjects(action==='browse-project');return;}
  if(action==='open-preview'){const result=act(state,{type:'inspect',id:detailId});if(result.ok)showPreview();return;}
  if(action==='before'||action==='after'){previewBefore=action==='before';showPreview();return;}
  if(action==='build-info'){document.getElementById('sheet-message').textContent='原型未生成安装包或录屏。正式版在这里打开对应测试构建与录屏，再到实际设备操作。';return;}
  if(action==='accept'){
    const result=act(state,{type:'accept',id:detailId});
    if(!result.ok){document.getElementById('sheet-message').textContent=result.message;return;}
    document.getElementById('sheet').close();state.page='results';render();return;
  }
  if(action==='complete'){
    const result=act(state,{type:'complete',id:detailId});if(!result.ok){document.getElementById('sheet-message').textContent=result.message;return;}
    showTask(detailId);render();return;
  }
  if(action==='reset'){state=initialRealtime();render();return;}
  if(action.startsWith('page-')){state.page=action.slice(5);render();return;}
  if(action==='idea'){
    if(!state.call)act(state,{type:'start'});
    act(state,{type:'discuss',text:'让指挥台支持语音派工，做好后让我看页面。'});state.page='command';
  }else if(action==='dispatch'){act(state,{type:'dispatch',operation:'dispatch-'+state.operation});}
  else if(action==='bind'){act(state,{type:'bind',project:state.viewProject});}
  else if(action==='complete-next'){
    const task=state.tasks.find(t=>t.status==='running'&&t.project===state.project);
    if(task)act(state,{type:'complete',id:task.id});else state.notice='没有进行中的任务，可以先聊一个新想法。';
    state.page='results';
  }else if(action==='progress'){
    const tasks=state.tasks.filter(t=>t.project===state.project),text=state.online?'目前 '+tasks.filter(t=>t.status==='running').length+' 项进行中，'+tasks.filter(t=>t.status==='review').length+' 份界面等你验收。':'Mac 离线，我只能看到最后快照，无法确认最新进度。';
    state.reply=text;state.chat.push({role:'norma',text});state.notice=text;
  }else act(state,{type:action});
  render();
});
document.addEventListener('input',event=>{if(event.target.id==='idea-input')state.composer=event.target.value;});
document.addEventListener('submit',event=>{
  if(event.target.id==='idea-form'){
    event.preventDefault();const text=new FormData(event.target).get('idea');
    if(!state.call)act(state,{type:'start'});
    const result=act(state,{type:'discuss',text});if(result.ok)state.composer='';render();
  }
  if(event.target.id==='feedback-form'){
    event.preventDefault();const result=act(state,{type:'feedback',id:detailId,text:new FormData(event.target).get('feedback')});
    if(!result.ok){document.getElementById('sheet-message').textContent=result.message;return;}
    document.getElementById('sheet').close();render();
  }
});
document.getElementById('sheet').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();else document.querySelector('.bottom-nav [aria-current=page]')?.focus();});
const variants=directions.map((_,i)=>()=>{document.getElementById('sheet').close();state=initialRealtime();return renderVariant(i);});
// Keep malformed links usable without changing the skill's picker wiring.
const requestedVariant=Number(new URLSearchParams(location.search).get('v')||1);
if(!Number.isInteger(requestedVariant)||requestedVariant<1||requestedVariant>variants.length){const url=new URL(location);url.searchParams.set('v','1');history.replaceState(null,'',url);}
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
