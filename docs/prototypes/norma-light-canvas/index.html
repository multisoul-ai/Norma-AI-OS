function queueHTML(){if(!ui().queue)return '';const rows=ui().queueTab==='needs'?work.filter(w=>pending().some(d=>d.id===w.id)):work;return `<section class="queue" aria-label="${t('quickQueue')}"><header class="queue-header"><div class="between"><h2>${t('quickQueue')}</h2><button class="icon-btn" data-action="queue" aria-label="${t('close')}">${icon('close')}</button></div><p>${t('queueHint')}</p><div class="queue-tabs"><button data-queue-tab="needs" aria-pressed="${ui().queueTab==='needs'}">${t('needsLight')} ${pending().length}</button><button data-queue-tab="all" aria-pressed="${ui().queueTab==='all'}">${t('allWorkLight')} ${work.length}</button></div></header><div class="queue-body">${rows.length?rows.map(w=>{const a=agentFor(w.id),d=pending().find(d=>d.id===w.id);return `<article class="queue-work" data-queue-work="${w.id}"><button class="queue-work-title" data-open-work="${w.id}">${avatar(a)}<span><strong>${esc(l(w.title))}</strong><small>${a.name} · ${t(w.stage)}</small></span>${icon('arrow')}</button>${d?`<div class="queue-recommend"><label>${t('recommendation')}</label><p>${esc(l(d.recommended))}</p></div><div class="queue-work-actions"><button class="btn primary" data-apply="${w.id}" ${a.control==='human'?'disabled':''}>${t(d.kind==='review'?'accept':d.kind==='permission'?'allow':'adopt')}${icon('check')}</button><button class="btn ghost" data-open-work="${w.id}">${t('discussLight')}</button><button class="btn ghost" data-locate-work="${w.id}" title="${t('locateCard')}" aria-label="${t('locateCard')}">${icon('target')}</button></div>`:''}</article>`}).join(''):`<div class="queue-empty">${icon('check')}${t('noAttention')}</div>`}</div></section>`}
function planHTML(w){const done=meta[w.id].completed;return `<section class="plan-box"><div class="between"><span>${t('planTitle')}</span><span>${done}/${w.plan.length}</span></div>${w.plan.map((p,i)=>`<div class="plan-step ${i<done?'completed':''}"><i>${i<done?'✓':i+1}</i><span>${esc(l(p))}</span></div>`).join('')}<p>${t('lastProgress')}：${esc(l(w.last))}</p></section>`}
function messageHTML(m){const user=m.role==='user';return `<article class="chat-msg">${user?`<span class="you-avatar">${t('you')}</span>`:'<span class="n-orb">n</span>'}<div><header><span>${user?t('you'):'Norma'}</span><small>${m.citation?m.citation+' · ':''}${m.time||t('now')}</small></header><p>${esc(l(m.text))}</p></div></article>`}
function recommendationHTML(w){const d=pending().find(d=>d.id===w.id),a=agentFor(w.id);return d?`<section class="task-recommend"><div class="eyebrow">${t('recommendation')} · ${t('preparedBy')} ${a.name}</div><h3>${esc(l(d.title))}</h3><p>${esc(l(d.recommended))}</p><small>${esc(l(d.reason))}</small><div class="row"><button class="btn primary" data-apply="${w.id}" data-testid="apply-decision" ${a.control==='human'?'disabled':''}>${t(d.kind==='review'?'accept':d.kind==='permission'?'allow':'adopt')}${icon('check')}</button><button class="btn ghost" data-edit="${w.id}" data-testid="edit-decision">${t('edit')}</button><button class="btn ghost" data-evidence="${w.id}">${t('source')}</button></div></section>`:`<div class="resolved-task">${icon('check')}<span>${w.stage==='merge'?t('reviewed'):w.stage==='working'?t('delivered'):t('noDecision')}</span></div>`}
function conversationHTML(id){if(!id)return '';const global=id==='norma',w=global?null:workBy(id),a=global?null:agentFor(id),state=context(id),u=ui();const title=global?'Norma':l(w.title);const seed=global?[{role:'assistant',text:brief()}]:(seedMessages[id]||[]);const cls=global?'global-window':current===1?'task-sheet':current===2&&u.focus?'focus-pane':'task-popover';return `<section class="conversation ${cls}" data-testid="conversation" data-conversation="${id}" role="dialog" aria-modal="false" aria-label="${esc(title)}"><header class="conversation-header"><div class="between"><div><div class="eyebrow">${t(global?'globalContext':'taskContext')}</div><h2>${esc(title)}</h2></div><div class="row" style="gap:2px">${global?'':`<button class="icon-btn" data-locate-work="${id}" title="${t('locateCard')}" aria-label="${t('locateCard')}">${icon('target')}</button>`}<button class="icon-btn" data-action="close-conversation" aria-label="${t('popupClose')}" title="${t('popupClose')}">${icon('close')}</button></div></div>${global?'':`<div class="conversation-identity">${avatar(a)}<span>${a.name} · ${a.model}</span><span>·</span><span>${t('independentDraft')}</span></div>`}</header>${global?'':`<div class="conversation-status"><span data-testid="work-stage">${phase(w)}</span><button data-action="toggle-plan" aria-expanded="${u.plan}">${meta[id].completed}/${w.plan.length} ${t('stepsDone')} ${icon('chevron')}</button></div>`}<div class="conversation-messages" data-conversation-scroll="${id}">${!global&&a.control==='human'?`<div class="human-banner">${t('controlledHint')}</div>`:''}${!global&&u.plan?planHTML(w):''}${seed.map(messageHTML).join('')}${state.messages.map(messageHTML).join('')}${global?'':recommendationHTML(w)}</div><div class="conversation-composer"><form class="input-box" data-form="chat" data-work-id="${id}"><textarea data-testid="composer" data-draft-work="${id}" name="message" aria-label="${t(global?'globalPlaceholder':'workPlaceholder')}" placeholder="${t(global?'globalPlaceholder':'workPlaceholder')}">${esc(state.draft)}</textarea><div class="input-tools"><span class="row" style="gap:4px">${icon('layers')}${t(global?'globalContext':'onlyThisTask')}</span><button class="send-btn" type="submit" data-testid="send" aria-label="${t('send')}" title="${t('send')}">${icon('send')}</button></div></form><div class="composer-foot"><span>${t('sendHint')}</span><span>${t('localHint')}</span></div></div></section>`}
function taskbarHTML(){return `<nav class="taskbar" aria-label="${t('allWorkLight')}"><div class="bar-orb"><button data-action="global" title="${t('askNorma')}" aria-label="${t('askNorma')}"><span class="n-orb">n</span></button></div><div class="task-tabs" role="tablist">${work.map(w=>`<button class="task-tab" role="tab" data-task-tab="${w.id}" aria-selected="${ui().popup===w.id}" title="${esc(l(w.title))}"><span class="name">${esc(l(meta[w.id].short))}</span><span class="meta"><i class="task-dot ${w.stage}"></i>${t(w.stage)}</span>${context(w.id).draft?'<i class="draft-dot"></i>':''}</button>`).join('')}</div></nav>`}
function focusRibbon(){return `<nav class="focus-ribbon" aria-label="${t('focusedMode')}"><button class="btn" data-action="exit-focus" data-testid="exit-focus">${icon('back')}${t('backPanorama')}</button><span class="divider"></span><strong>${agentFor(selectedWork).name} · ${esc(l(meta[selectedWork].short))}</strong><span class="divider"></span><button class="icon-btn" data-cycle="-1" aria-label="${t('previousWork')}" title="${t('previousWork')}">${icon('left')}</button><button class="icon-btn" data-cycle="1" aria-label="${t('nextWork')}" title="${t('nextWork')}">${icon('right')}</button></nav>`}
function root(mode){['pickerCapsule','pickerBar','pickerFocus'].forEach((key,i)=>document.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')[i].textContent=t(key));prepareMode(mode);const u=ui();document.body.className=`variant-${mode}${u.focus?' is-focused':''}`;document.documentElement.lang=lang==='zh'?'zh-CN':'en';queueMicrotask(()=>{syncCanvas();restoreConversation();moveHighlight()});return `${header()}<section class="canvas-viewport" data-testid="canvas" tabindex="0" aria-label="${t('canvas')}"><div class="canvas-world"><div class="area-label"><i class="dot"></i><span>Norma OS</span><span style="opacity:.4">/</span><span>${t('lightWorkspace')}</span></div>${agents.map(nodeHTML).join('')}</div></section>${u.focus?focusRibbon():`<span class="scene-label"><b>${t('lightCanvas')}</b> <span style="opacity:.45;margin:0 6px">/</span> ${t('canvasMore')}</span>`}<button class="norma-launcher" data-action="global"><span class="n-orb">n</span><span>${t('askNorma')}<small>${t('normaWatching')}</small></span></button><div class="canvas-tools"><button class="icon-btn" data-zoom="-1" aria-label="${t('zoomOut')}" title="${t('zoomOut')}">${icon('minus')}</button><span class="zoom-value">${Math.round(u.camera.z*100)}%</span><button class="icon-btn" data-zoom="1" aria-label="${t('zoomIn')}" title="${t('zoomIn')}">${icon('plus')}</button><span class="tool-divider"></span><button class="icon-btn" data-action="fit" aria-label="${t('fitAll')}" title="${t('fitAll')}">${icon('grid')}</button></div>${mode===1?taskbarHTML():''}${conversationHTML(u.popup)}${queueHTML()}<span class="canvas-hint">${t('canvasGesture')}</span><span class="demo-note">${t('localDemo')}</span>`}
const variants=[()=>root(0),()=>root(1),()=>root(2)];
Object.assign(words,{
 pickerCapsule:['胶囊','Popup'],pickerBar:['任务条','Bar'],pickerFocus:['聚焦','Focus'],
 noDecision:['这件事暂时不需要你决定，可以继续补充要求或查看步骤。','No decision is needed now. Add a requirement or view the steps.'],
 demoReceipt:['演示回执：答复已归入当前工作，模拟由原 Agent 继续执行。','Demo receipt: your answer stays with this work; the original agent would continue.'],
 demoReview:['演示回执：本轮验收通过，进入待合并；尚未合并或发布。','Demo receipt: this revision is accepted and awaits merge. Nothing was merged or released.'],
 demoPermission:['演示回执：仅允许这次团队预览部署，模拟由 Atlas 继续执行。','Demo receipt: only this team preview is allowed; Atlas would continue.'],
 outdated:['这条建议已更新，请重新打开后再决定。','This recommendation has changed. Open it again before deciding.'],
 helpModel:['你定方向，Norma 跟进每件工作；Agent 留在原画布执行。只有回答、授权、验收进入人工待办。','You set direction; Norma follows each work item. Agents execute on the canvas. Only answers, permissions and reviews need you.'],
 sampleControl:['此处模拟接管状态；真实终端输入仍需正式 App。','This simulates control state. Live terminal input requires the actual app.']
});
function rememberConversation(){
 const pane=document.querySelector('[data-conversation]');if(!pane)return;
 const c=context(pane.dataset.conversation),input=pane.querySelector('textarea'),scroller=pane.querySelector('[data-conversation-scroll]');
 if(input)c.draft=input.value;if(scroller)c.scroll=scroller.scrollTop;
}
function restoreConversation(){
 const scroller=document.querySelector('[data-conversation-scroll]');if(!scroller)return;
 const c=context(scroller.dataset.conversationScroll);scroller.scrollTop=c.scroll===null?scroller.scrollHeight:c.scroll;
}
function syncCanvas(){
 const u=ui(),world=document.querySelector('.canvas-world');if(!world||!u.camera)return;
 const c=u.camera;world.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;
 const z=document.querySelector('.zoom-value');if(z)z.textContent=Math.round(c.z*100)+'%';
 document.querySelectorAll('[data-node]').forEach(n=>{const a=agents.find(a=>a.id===n.dataset.node);n.style.left=a.x+'px';n.style.top=a.y+'px';n.classList.toggle('is-selected',n.dataset.work===selectedWork)});
 const popup=document.querySelector('.task-popover');if(popup){
  const node=document.querySelector(`[data-work="${u.popup}"]`),r=node.getBoundingClientRect(),pw=popup.offsetWidth,ph=popup.offsetHeight;
  let left=r.right+18;if(left+pw>innerWidth-15)left=r.left-pw-18;
  popup.style.left=Math.max(12,Math.min(innerWidth-pw-12,left))+'px';
  popup.style.top=Math.max(innerWidth<=800?116:80,Math.min(innerHeight-ph-22,r.top-16))+'px';
 }
}
function render(remember=true){if(remember)rememberConversation();stage.innerHTML=variants[current]();syncCanvas();restoreConversation()}
function openWork(id){
 if(!workBy(id))return;rememberConversation();const u=ui();u.queue=false;selectedWork=id;u.lastSelected=id;
 if(current===2){if(!u.focus)u.returnCamera={...u.camera};u.focus=true;focusCamera(id)}
 u.popup=id;render(false);
}
function exitFocus(remember=true){if(remember)rememberConversation();const u=ui();if(u.returnCamera)u.camera={...u.returnCamera};u.focus=false;u.popup=null;u.queue=false;render(false)}
function closeConversation(){if(current===2&&ui().focus)exitFocus();else{rememberConversation();ui().popup=null;render(false)}}
function openGlobal(){
 rememberConversation();const u=ui();if(u.popup==='norma'){u.popup=null;render(false);return}
 if(u.focus){u.camera={...(u.returnCamera||fitCamera(current))};u.focus=false}u.queue=false;u.popup='norma';render(false);
}
function locateWork(id){
 rememberConversation();const a=agentFor(id),u=ui();selectedWork=id;u.lastSelected=id;u.focus=false;u.popup=null;u.queue=false;
 const z=Math.min(1.25,Math.max(.65,u.camera.z));u.camera={x:innerWidth/2-(a.x+180)*z,y:viewHeight()/2-(a.y+117.5)*z,z,auto:false};render(false);
}
function zoomAt(factor,px=innerWidth/2,py=viewHeight()/2){const c=ui().camera,z=Math.max(.22,Math.min(2.2,c.z*factor)),ratio=z/c.z;c.x=px-(px-c.x)*ratio;c.y=py-(py-c.y)*ratio;c.z=z;c.auto=false;syncCanvas()}
function notice(message){const el=document.getElementById('notification');el.textContent=message;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),3800)}
function toggleControl(id){rememberConversation();const a=agents.find(a=>a.id===id);a.control=a.control==='human'?'agent':'human';render(false);notice(t(a.control==='human'?'takeNotice':'releaseNotice')+' '+t('sampleControl'))}
function applyDecision(id,answer,version){
 const d=decisions.find(d=>d.id===id);if(!d||d.status!=='open'){notice(t('resolved'));return false}
 if(version!==undefined&&version!==d.version){notice(t('outdated'));return false}
 const a=agentFor(id);if(a.control==='human'){notice(t('heldByYou'));return false}
 rememberConversation();const w=workBy(id),c=context(id);d.status='resolved';d.version++;
 w.stage=d.kind==='review'?'merge':'working';
 w.last=d.kind==='review'?['本轮验收通过，等待合并安排','Revision accepted; awaiting merge arrangements']:d.kind==='permission'?['已获得本次预览授权，继续部署验证','Preview permission granted; continue deployment checks']:['用户已确认方案，继续修复与验证','User confirmed the approach; continue the fix and checks'];
 c.messages.push({role:'user',text:answer||[...d.recommended]},{role:'assistant',citation:a.name,text:words[d.kind==='review'?'demoReview':d.kind==='permission'?'demoPermission':'demoReceipt']});c.scroll=null;render(false);notice(t('decisionDone'));return true;
}
function showDialog(body){
 dialogReturn=document.activeElement;const overlay=document.getElementById('overlay');overlay.className='overlay';overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${body}</section>`;
 requestAnimationFrame(()=>overlay.querySelector('textarea,button,input')?.focus());
}
function closeDialog(){const overlay=document.getElementById('overlay');overlay.innerHTML='';overlay.className='';if(dialogReturn?.isConnected)dialogReturn.focus();else document.querySelector('[data-action="queue"]')?.focus()}
function showEdit(id){const d=pending().find(d=>d.id===id);if(!d)return;showDialog(`<form data-form="edit" data-work-id="${id}" data-version="${d.version}"><div class="between"><h2 id="dialog-title">${t('editTitle')}</h2><button class="icon-btn" type="button" data-action="close-dialog" aria-label="${t('close')}">${icon('close')}</button></div><p class="dialog-copy">${esc(l(d.title))}</p><label for="decision-answer">${t('yourAnswer')}</label><textarea id="decision-answer" data-testid="decision-edit" name="answer" required>${esc(l(d.recommended))}</textarea><p class="dialog-copy">${t('editHint')}</p><footer><button class="btn" type="button" data-action="close-dialog">${t('cancel')}</button><button class="btn primary" type="submit" data-testid="submit-edit">${t('submitEdit')}</button></footer></form>`)}
function showEvidence(id){const d=decisions.find(d=>d.id===id);showDialog(`<div class="between"><h2 id="dialog-title">${t('evidenceTitle')}</h2><button class="icon-btn" data-action="close-dialog" aria-label="${t('close')}">${icon('close')}</button></div><p class="dialog-copy">${t('sampleEvidence')}</p>${[['originalQuestion',d.title],['basis',d.evidence],['impact',d.impact]].map(([label,value])=>`<label>${t(label)}</label><p class="dialog-copy">${esc(l(value))}</p>`).join('')}<footer><button class="btn" data-action="close-dialog">${t('close')}</button></footer>`)}
function showHelp(){showDialog(`<div class="between"><h2 id="dialog-title">${t('variantHelp')}</h2><button class="icon-btn" data-action="close-dialog" aria-label="${t('close')}">${icon('close')}</button></div><p class="dialog-copy">${t('helpModel')}</p>${['helpCapsule','helpTabs','helpFocus'].map((key,i)=>`<p class="dialog-copy">${i+1}. ${t(key)}</p>`).join('')}<p class="dialog-copy">${t('localHint')}</p><footer><button class="btn" data-action="close-dialog">${t('close')}</button></footer>`)}
function sendChat(form){
 const input=form.querySelector('textarea'),text=input.value.trim(),id=form.dataset.workId;if(!text){notice(t('noInput'));input.focus();return}
 rememberConversation();const c=context(id);c.messages.push({role:'user',text},{role:'assistant',text:words[id==='norma'?'globalReply':'normalReply']});c.draft='';c.scroll=null;render(false);document.querySelector('[data-testid="composer"]')?.focus();
}
function toggleVideo(){videoPaused=!videoPaused;const v=document.getElementById('wallpaper');if(videoPaused)v.pause();else v.play().catch(()=>{videoPaused=true;render()});render()}
// Drafts and reading positions belong to work, independent of the chosen presentation.
document.addEventListener('input',e=>{if(e.target.matches('[data-draft-work]')){context(e.target.dataset.draftWork).draft=e.target.value;const tab=document.querySelector(`[data-task-tab="${e.target.dataset.draftWork}"]`);if(tab){let dot=tab.querySelector('.draft-dot');if(e.target.value&&!dot){dot=document.createElement('i');dot.className='draft-dot';tab.append(dot)}else if(!e.target.value)dot?.remove()}}});
document.addEventListener('scroll',e=>{if(e.target.matches?.('[data-conversation-scroll]'))context(e.target.dataset.conversationScroll).scroll=e.target.scrollTop},true);
document.addEventListener('submit',e=>{
 const form=e.target;if(!form.dataset.form)return;e.preventDefault();
 if(form.dataset.form==='chat')sendChat(form);
 else if(form.dataset.form==='edit'){const answer=form.elements.answer.value.trim();if(answer&&applyDecision(form.dataset.workId,answer,Number(form.dataset.version)))closeDialog()}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.closest('.proto-picker')||b.disabled)return;
 if(b.dataset.openWork){openWork(b.dataset.openWork);return}
 if(b.dataset.taskTab){if(ui().popup===b.dataset.taskTab)closeConversation();else openWork(b.dataset.taskTab);return}
 if(b.dataset.locateWork){locateWork(b.dataset.locateWork);return}
 if(b.dataset.apply){applyDecision(b.dataset.apply);return}
 if(b.dataset.edit){showEdit(b.dataset.edit);return}
 if(b.dataset.evidence){showEvidence(b.dataset.evidence);return}
 if(b.dataset.control){toggleControl(b.dataset.control);return}
 if(b.dataset.queueTab){ui().queueTab=b.dataset.queueTab;render();return}
 if(b.dataset.zoom){zoomAt(Number(b.dataset.zoom)>0?1.18:1/1.18);return}
 if(b.dataset.cycle){const i=work.findIndex(w=>w.id===selectedWork);openWork(work[(i+Number(b.dataset.cycle)+work.length)%work.length].id);return}
 switch(b.dataset.action){
  case 'queue':ui().queue=!ui().queue;render();break;
  case 'global':openGlobal();break;
  case 'close-conversation':closeConversation();break;
  case 'exit-focus':exitFocus();break;
  case 'toggle-plan':ui().plan=!ui().plan;render();break;
  case 'fit':rememberConversation();ui().camera=fitCamera(current);ui().popup=null;ui().focus=false;render(false);break;
  case 'video':toggleVideo();break;
  case 'language':lang=lang==='zh'?'en':'zh';render();break;
  case 'help':showHelp();break;
  case 'close-dialog':closeDialog();break;
 }
});
document.addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeDialog()});
document.addEventListener('keydown',e=>{

<script id="picker-wiring">
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

</script></body></html>
