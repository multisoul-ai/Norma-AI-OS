function swipeDecision(dx, dy, width) {

  const threshold = Math.min(118, Math.max(88, width * 0.28));
  if (Math.abs(dx) < threshold || Math.abs(dx) <= Math.abs(dy) * 1.25) return null;
  return dx > 0 ? 'approve' : 'reject';

    if(task.status!=='done')return fail('这份成果正在更新，可在对话中继续补充方向');
    if(typeof a.text!=='string'||!a.text.trim()||a.text.trim().length>600)return fail('请用 1–600 字描述调整意见');
    task.reviewNote=a.text.trim();task.messages.push('验收反馈：'+task.reviewNote);
    task.reviewed=false;task.status='submitted';task.phase='等待 Agent 接收调整意见';
    return ok('调整意见已送达 · 等待 Agent 接收');
  }
  if (a.type === 'message') { if(!a.text?.trim()) return fail('请先输入内容');if(['done','cancelled','interrupted'].includes(task.status)) return fail('请先继续任务再发送指令');task.messages.push(a.text.trim());return ok('指令已送达演示 Mac'); }
  if (a.type === 'approve' || a.type === 'reject') { if(task.status!=='approval') return fail('此请求已经处理，请刷新任务');task.status=a.type==='approve'?'running':'interrupted';task.phase=a.type==='approve'?'已获授权，继续执行':'授权已拒绝';task.summary=a.type==='approve'?`你已允许本次${task.request?.label||'请求'}，${task.agent} 正在继续执行。`:'本次请求已拒绝，任务上下文已保留。';s.decisionLog.unshift({id:task.id, title:task.request?.title||task.title, agent:task.agent, project:task.project, action:a.type});return ok(a.type==='approve'?'已允许一次 · 演示 Mac 已接收':'已拒绝 · 演示 Mac 已接收'); }
  if (a.type === 'interrupt') { if(!['running','submitted'].includes(task.status)) return fail('当前任务无法中断');task.status='interrupted';task.phase='已中断，保留上下文';return ok('演示 Mac 已确认中断'); }
  if (a.type === 'resume') { if(!['interrupted','done'].includes(task.status)) return fail('当前任务不需要继续');task.status='running';task.reviewed=false;task.phase='继续处理任务';return ok('已从原上下文继续任务'); }
  return fail('不支持的操作');
}
</script>
<script>

const paths={trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7',scan:'M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h3v3H8zM14 8h2v3h-2zM8 14h3v2H8zM14 14h2v2h-2z',more:'M5 12h.01M12 12h.01M19 12h.01',folder:'M3 7V4h6l2 3h10v13H3z',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',tasks:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',laptop:'M4 4h16v12H4zM2 20h20l-2-4H4z',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',plus:'M12 5v14M5 12h14',chevron:'M9 5l7 7-7 7',back:'M15 5l-7 7 7 7',down:'M6 9l6 6 6-6',arrow:'M4 12h16m-6-6l6 6-6 6',check:'M5 12l4 4L19 6',close:'M6 6l12 12M6 18L18 6',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',terminal:'M4 6l6 6-6 6m9 0h7',branch:'M6 3v12a4 4 0 0 0 4 4h8M6 8h7a5 5 0 0 0 5-5',clock:'M12 7v5l3 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',shield:'M12 3l8 3v7c0 4-8 8-8 8s-8-4-8-8V6zM8 12l3 3 5-6',pause:'M8 5v14M16 5v14',play:'M7 4l14 8-14 8z',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0zM5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8',send:'M12 20V4m-6 6l6-6 6 6',file:'M13 3H5v18h14V9zM13 3v6h6M8 13h8m-8 4h5',wifi:'M2 7a17 17 0 0 1 20 0M5 11a12 12 0 0 1 14 0M8 15a6 6 0 0 1 8 0M12 19h.01',refresh:'M20 7a9 9 0 1 0 1 9M20 2v5h-5',moon:'M20 16A9 9 0 0 1 8 4a9 9 0 1 0 12 12',logout:'M9 3H4v18h5M8 12h13m-5-5l5 5-5 5',alert:'M12 3L2 21h20zM12 9v5m0 3h.01',copy:'M8 8h13v13H8zM16 8V3H3v13h5'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.grid}"/></svg>`;}
const mark='<svg class="norma-mark" viewBox="0 0 36 36" aria-hidden="true"><path d="M5 27L14 8h4l-2 17L26 8h5L20 29h-6l2-17L9 27z" fill="currentColor"/></svg>';
document.querySelectorAll('.brand-icon').forEach(el=>el.innerHTML=mark);
let machines=initialMachines(),state=machines.find(m=>m.machineId===new URLSearchParams(location.search).get('machine'))||machines[0],pendingMachine=null,page='overview',selectedTask='voice',taskTab='activity',filter='all',project='all',boardProject=Object.values(state.projects)[0],detailOrigin='tasks',query='',artifactVersion='after',homeView='plan',decisionId='',activeSwipe=null,toastTimer,terminalLines=state.terminalLines,messageDrafts=state.messageDrafts,pairStep='guide',pairCode='';

const canControl=()=>state.online&&state.paired&&state.permission==='control';
const disabled=()=>canControl()?'':'disabled';
function badge(status){return `<span class="pill ${status}"><span class="dot"></span>${statusText[status]||status}</span>`;}
function notify(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600);}
function run(action){const result=transition(state,action);render(false);notify(result.message);return result;}
function navigate(next,id){closeSheet();if(next!=='connect')pendingMachine=null;if(next==='connect'&&page!=='connect'){pairStep='guide';pairCode='';}if(next==='detail'&&page!=='detail')detailOrigin=['projects','overview'].includes(page)?page:'tasks';if(id)selectedTask=id;page=next;render(true);const route=next==='detail'?'task/'+selectedTask:next==='projects'?'project/'+Object.keys(projectRoutes).find(key=>projectRoutes[key]===boardProject):next;writeRoute(route);}
function writeRoute(route,replace=false){const url=new URL(location.href);url.searchParams.set('machine',state.machineId);url.hash=route;if(url.href!==location.href)history[replace?'replaceState':'pushState'](null,'',url);}
function activateMachine(id){const target=machines.find(m=>m.machineId===id);if(!target)return false;if(target===state)return true;cancelDecisionGesture();closeSheet();state=target;projectRoutes=state.projects;messageDrafts=state.messageDrafts;terminalLines=state.terminalLines;selectedTask=state.tasks[0]?.id||'';boardProject=Object.values(projectRoutes)[0];project='all';filter='all';query='';taskTab='activity';artifactVersion='after';homeView='plan';decisionId='';detailOrigin='projects';pendingMachine=null;pairStep='guide';pairCode='';return true;}
function switchMachine(id){const destination=['projects','overview','tasks','devices'].includes(page)?page:'projects';if(!activateMachine(id)){notify('找不到这台电脑');return;}navigate(destination);notify('已切换到 '+state.name+' · 其他电脑继续工作');}
function machineRows(){return `<div class="list-group machine-list">${machines.map(m=>`<button class="list-row machine-row" data-select-machine="${esc(m.machineId)}" aria-label="切换到${esc(m.name)}" aria-pressed="${m===state}">${icon('laptop')}<div><b>${esc(m.name)}</b><small>${!m.paired?'未配对':m.online?'在线':'离线 · 快照'} · ${m.permission==='control'?'可控制':'只读'}<br>${Object.keys(m.projects).length} 个项目 · ${m.tasks.filter(t=>t.status==='running').length} 个${m.online&&m.paired?'运行中':'上次运行中'}任务</small></div>${m===state?icon('check'):icon('chevron')}</button>`).join('')}</div>`;}
function machinePicker(){openSheet('切换电脑',`<p>当前：${esc(state.name)}。切换只改变查看的电脑，各台 Mac 上的 Agent 会继续工作。</p>${machineRows()}<button class="secondary wide device-connect-entry" data-action="add-machine">${icon('plus')}添加电脑</button>`);}
function pairingTarget(){return pendingMachine||state;}
function providerIcon(agent){const name=agent==='Codex'?'codex':agent==='Claude'?'claude':'norma';return `<svg class="provider-icon provider-${name}" data-provider="${esc(agent)}" viewBox="0 0 ${name==='norma'?'36 36':'24 24'}" role="img" aria-label="${esc(agent)}">${name==='norma'?'<path d="M5 27L14 8h4l-2 17L26 8h5L20 29h-6l2-17L9 27z" fill="currentColor"/>':`<use href="#brand-${name}"/>`}</svg>`;}
function projectCard(card){return `<div class="card-shell"><button class="ai-card" data-card="${esc(card.id)}" data-running="${card.animated}" aria-label="查看卡片：${esc(card.title)}" aria-describedby="card-state-${esc(card.id)}">${card.animated?'<svg class="snake-border" aria-hidden="true"><rect class="snake-tail" x="1" y="1" rx="22" pathLength="100"/><rect class="snake-mid" x="1" y="1" rx="22" pathLength="100"/><rect class="snake-front" x="1" y="1" rx="22" pathLength="100"/><rect class="snake-head" x="1" y="1" rx="22" pathLength="100"/></svg>':''}${providerIcon(card.agent)}<h2>${esc(card.title)}</h2><span class="card-footer" id="card-state-${esc(card.id)}"><span class="sr-only">${esc(card.agent)} · </span>${badge(card.status)}</span></button><button class="icon-button card-menu" data-card-options="${esc(card.id)}" aria-label="卡片选项：${esc(card.title)}">${icon('more')}</button></div>`;}
function projects(){const cards=projectCards(state,boardProject),running=cards.filter(card=>card.status==='running').length;return `<div class="project-heading"><button class="project-select" data-action="board-projects" aria-label="切换项目">项目 ${icon('down')}</button><button class="icon-button" data-action="new-card" aria-label="添加 Agent 卡片" ${disabled()}>${icon('plus')}</button></div><div class="project-heading"><h1>${esc(boardProject)}</h1></div><button class="project-context machine-context" data-action="switch-machine" aria-label="切换项目所在电脑">${icon('laptop')}${esc(state.name)} ${icon('down')}<span>· ${state.online?'刚刚同步':'09:41 快照'}</span></button><div class="board-summary"><span><b>全部</b> · ${cards.length}</span><span>${state.online?'<i class="dot"></i>':'上次同步 · '}${running} 张运行中</span></div><div class="ai-grid" aria-label="${esc(boardProject)} 的 Norma AI 卡片">${cards.map(projectCard).join('')||'<div class="board-empty"><p>还没有卡片，先添加一个 Agent。</p></div>'}</div><button class="secondary wide create-card-entry" data-action="new-card" ${disabled()}>${icon('plus')}创建卡片</button><section class="project-thread"><h2>项目脉络</h2><p>当前方向 · ${esc(state.direction.text)}</p><p>${cards.length} 位 Agent · ${cards.filter(c=>c.status==='idle').length} 张卡片待命</p><button class="text-button" data-page="overview">去指挥台调整方向 ${icon('arrow')}</button></section><p class="board-note">${state.online?'先创建卡片，想好目标后再安排任务。':'当前显示上次同步的状态，重新连接后更新。'}</p>`;}
function taskCard(t){return `<button class="task-card" data-task="${esc(t.id)}" aria-label="查看任务：${esc(t.title)}"><div class="task-top"><span class="agent-symbol ${t.agent==='Claude'?'claude':''}">${providerIcon(t.agent)}</span><div class="task-heading"><h3>${esc(t.title)}</h3><span class="task-meta">${esc(t.agent)} · ${esc(t.project)}</span></div>${icon('chevron')}</div><p>${esc(t.summary)}</p><div class="task-status-row">${badge(t.status)}<span class="muted">${esc(t.elapsed)}</span></div>${t.total?`<div class="stage-track" aria-label="${t.total} 个步骤，已完成 ${t.step} 个">${Array.from({length:t.total},(_,i)=>`<i class="${i<t.step?'complete':i===t.step?'current':''}"></i>`).join('')}</div><div class="stage-caption"><span>${esc(t.phase)}</span><span>${t.step} / ${t.total} 步</span></div>`:`<div class="stage-caption" style="margin-top:10px"><span>${esc(t.phase)}</span></div>`}</button>`;}
function overview(){return `<div class="decision-heading ${homeView==='decisions'?'is-deciding':''}"><h1>${homeView==='plan'?'指挥台':'待你决策'}</h1><button class="icon-button" data-action="decision-history" aria-label="处理记录">${icon('clock')}</button></div><div class="segments home-segments" role="tablist" aria-label="指挥台视图">${[['plan','行动计划'],['decisions','待你决策'+(pendingDecisions(state).length?' · '+pendingDecisions(state).length:'')]].map(([id,label])=>`<button role="tab" aria-selected="${homeView===id}" data-home-view="${id}">${label}</button>`).join('')}</div>${homeView==='plan'?actionPlan():decisionView()}`;}
function actionPlan(){
  const todos=nextSteps(state),priority=todos[0],queue=pendingDecisions(state),request=queue.find(t=>t.id===priority?.id)||queue[0];
  const reviewable=state.tasks.filter(t=>t.status==='done'&&!t.reviewed);
  return `<section class="command-hero" aria-label="工作简报"><div class="hero-kicker">${state.online?'与 '+esc(state.name)+' 同步':'上次同步 · 09:41'}</div><h2>${state.online?'一切正在推进':'工作，仍在那边。'}</h2><p>${queue.length?`${queue.length} 件事，等你决定`:'现在，专注你的方向。'}</p><div class="hero-chips"><span>${state.cards.length} 位 Agent</span><span>${esc(state.name)}</span></div></section><div class="command-metrics"><button data-home-view="decisions" aria-label="查看待决策"><div><small>待决策</small><strong>${String(queue.length).padStart(2,'0')}</strong></div>${icon('shield')}</button><button data-action="review-inbox" aria-label="查看待验收"><div><small>待验收</small><strong>${String(reviewable.length).padStart(2,'0')}</strong></div>${icon('check')}</button></div><section class="plan-brief" aria-label="Norma 梳理"><div class="row between"><span class="plan-author">${mark}当前方向</span><button class="text-button" data-action="direction" ${!canControl()||!todos.length?'disabled':''}>调整方向</button></div><h2 id="plan-direction">${esc(state.direction.text)}</h2><p class="plan-delivery">${priority?`下一份交付：${esc(priority.outcome)}。`:'当前待办已完成，Agent 的结果可在任务中查看。'}</p></section>
  ${request?`<button class="human-next" data-decision-open="${esc(request.id)}"><span>${icon('shield')}</span><div><small>你现在只需 · ${queue.length} 项待决策</small><b>确认${esc(request.request.label)}</b><p>${esc(request.agent)} 会继续完成后续工作</p></div>${icon('chevron')}</button>`:`<div class="human-next is-clear">${icon('check')}<div><b>暂时无需你介入</b><p>Agent 继续执行，需要决定时会提醒你。</p></div></div>`}
  <div class="section-head todo-heading"><h2>下一步</h2><button class="text-button" data-action="daily-brief">${icon('mic')} 今日简报</button></div><p class="todo-caption">你定优先级，Agent 执行并回报结果。</p><ol class="todo-list">${todos.map((task,index)=>`<li><button class="todo-row" data-todo="${esc(task.id)}" aria-label="查看待办：${esc(task.nextTitle)}"><span class="todo-order">${String(index+1).padStart(2,'0')}</span><div class="todo-content"><div class="todo-title">${esc(task.nextTitle)}</div><div class="todo-meta">${providerIcon(task.agent)}<span>${esc(task.agent)} · ${esc(task.project)}</span></div><span class="todo-state ${task.status}"><i class="dot"></i>${task.status==='approval'?'等你确认后执行':statusText[task.status]||task.status}${index===0?' · 优先推进':''}</span></div>${icon('chevron')}</button></li>`).join('')}</ol><p class="decision-footnote">根据演示任务梳理 · 执行与完成由 Agent 同步</p>`;
}
function todoDetails(id){const task=nextSteps(state).find(t=>t.id===id);if(!task)return;openSheet('Agent 的下一步',`<div class="todo-sheet-agent">${providerIcon(task.agent)}<div><b>${esc(task.agent)} 负责执行</b><p>${esc(task.project)}</p></div>${badge(task.status)}</div><h2>${esc(task.nextTitle)}</h2><div class="info-summary"><b>预期交付</b><br>${esc(task.outcome)}</div><p>${task.status==='approval'?'这一步等待你确认执行权限，确认后由 Agent 继续。':task.status==='interrupted'?'这一步已中断。可以调整方向，或进入任务决定是否继续。':'具体执行与验证由 Agent 完成，结果会同步回来。'}</p><div class="action-row">${task.status==='approval'?`<button class="primary" data-decision-open="${esc(task.id)}">去做决策</button>`:`<button class="primary" data-direction-id="${esc(task.id)}" ${disabled()}>调整方向</button>`}<button class="secondary" data-task="${esc(task.id)}">查看任务</button></div>`);}
function directionSheet(id){const todos=nextSteps(state);openSheet('调整方向',`<p>说清目标和取舍，Norma 协调 Agent 推进。</p><form id="direction-form"><label><span>优先推进</span><select name="priorityId" required>${todos.map(task=>`<option value="${esc(task.id)}" ${(id||state.direction.priorityId)===task.id?'selected':''}>${esc(task.project)} · ${esc(task.nextTitle)}</option>`).join('')}</select></label><label><span>目标与取舍</span><textarea name="text" maxlength="300" required placeholder="例如：先验证连接稳定性，界面细节稍后处理。">${esc(state.direction.text)}</textarea></label><p class="hint">${canControl()?'优先顺序会更新，方向会同步给负责的 Agent。正在执行的任务保持当前状态，待确认请求仍需单独决定。':'当前无法发送，请恢复连接和控制权限。'}</p><div id="sheet-error" class="sheet-error" role="alert"></div><button class="primary wide" ${!canControl()||!todos.length?'disabled':''}>交给 Norma ${icon('send')}</button></form>`);}

function currentDecision(){const queue=pendingDecisions(state);return queue.find(t=>t.id===decisionId)||queue[0];}
function decisionView(){const queue=pendingDecisions(state),task=currentDecision();return `<div class="decision-toolbar"><p class="decision-subtitle">${queue.length?`${queue.length} 个请求，逐个交给你。`:'此刻，没有需要你确认的事。'}</p>${task?`<button class="text-button decision-skip" data-action="decision-skip" ${queue.length<2?'disabled':''}>暂时跳过 ${icon('arrow')}</button>`:''}</div>${task?`<div class="decision-deck ${queue.length>1?'has-next':''}"><article class="decision-card" id="decision-card" data-decision="${esc(task.id)}" tabindex="0" aria-roledescription="可左右滑动的确认卡片" aria-labelledby="decision-title" aria-describedby="decision-impact swipe-help"><div class="decision-agent">${providerIcon(task.agent)}<div><b>${esc(task.agent)}</b><span>${esc(task.project)}</span></div><span class="decision-tag">请求确认</span></div><h2 id="decision-title">${esc(task.request.title)}</h2><p class="decision-reason">${esc(task.request.reason)}</p><div class="decision-command"><span>将执行</span><code>${esc(task.request.command)}</code></div><p class="decision-scope">${icon('folder')}${esc(task.request.scope)}</p><p class="decision-impact" id="decision-impact">${esc(task.request.impact)}</p><button class="text-button decision-detail" data-action="decision-details">查看任务详情 ${icon('chevron')}</button><span class="decision-stamp approve-stamp" aria-hidden="true">松手允许</span><span class="decision-stamp reject-stamp" aria-hidden="true">松手拒绝</span></article></div><div class="decision-actions"><button class="decision-reject" data-action="decision-reject" ${disabled()}>${icon('close')}拒绝</button><button class="decision-approve" data-action="decision-approve" ${disabled()}>${icon('check')}允许一次</button></div><div class="swipe-help" id="swipe-help">${canControl()?'<span>← 左滑拒绝</span><span>右滑允许 →</span>':'<span>当前仅可查看，恢复连接与权限后再决策。</span>'}</div>`:`<div class="decision-empty"><span class="decision-clear">${icon('check')}</span><h2>全部处理好了</h2><p>Agent 会继续推进。<br>需要你的时候，再来这里。</p><button class="primary" data-home-view="plan">查看 Agent 待办</button></div>`}<p class="decision-footnote">${state.decisionLog.length?`本次已处理 ${state.decisionLog.length} 项 · `:''}所有确认仅作用于演示</p>`;}
function decide(id,action){if(currentDecision()?.id!==id){notify('请求状态已变化，请重新查看');render();return;}const result=transition(state,{type:action,id});if(result.ok)decisionId='';render(true);notify(result.message);}
function decisionHistory(){openSheet('处理记录',state.decisionLog.length?`<div class="list-group">${state.decisionLog.map(item=>`<button class="list-row" data-task="${esc(item.id)}">${icon(item.action==='approve'?'check':'close')}<div>${esc(item.title)}<small>${esc(item.agent)} · ${esc(item.project)}<br>${item.action==='approve'?'已允许一次':'已拒绝'} · 演示 Mac 已接收</small></div>${icon('chevron')}</button>`).join('')}</div><p class="hint">决定已由演示 Mac 接收，点击可查看任务的后续进展。</p>`:'<p>还没有处理记录。允许或拒绝后，会在这里留下回执。</p>');}

function taskMatches(t){return (project==='all'||t.project===project)&&(filter==='all'||filter==='running'&&['running','submitted'].includes(t.status)||t.status===filter)&&(`${t.title} ${t.project} ${t.agent}`.toLowerCase().includes(query.toLowerCase()));}
function taskResults(){const list=state.tasks.filter(taskMatches);return list.length?list.map(taskCard).join(''):`<div class="empty">${icon('search')}<h2>没有找到任务</h2><p>试试其他关键词或筛选条件。</p><button class="secondary wide" data-action="clear-filter">清除筛选</button></div>`;}
function tasks(){return `<div class="row between"><h1>任务</h1><button class="icon-button" data-action="new-task" aria-label="新建任务">${icon('plus')}</button></div><button class="project-select" data-action="projects">${icon('grid')}${project==='all'?'所有项目':esc(project)} ${icon('down')}</button><div class="search-wrap">${icon('search')}<input type="search" id="search" aria-label="搜索任务" placeholder="搜索任务、项目或 Agent" value="${esc(query)}"></div><div class="segments" role="tablist" aria-label="任务筛选">${[['all','全部'],['running','进行中'],['approval','待处理'],['done','已完成']].map(([k,v])=>`<button role="tab" aria-selected="${filter===k}" data-filter="${k}">${v}</button>`).join('')}</div>${state.draft?'<div class="inline-notice">有一条未发送的草稿。<button class="text-button" data-action="new-task">继续编辑</button></div>':''}<div id="task-results">${taskResults()}</div>`;}
function approvalBox(t){const request=t.request;return t.status==='approval'&&request?`<section class="inline-notice"><div class="row">${icon('shield')}<b>${esc(request.title)}</b></div><p style="margin-top:8px">执行 <code>${esc(request.command)}</code><br>${esc(request.scope)}<br>${esc(request.impact)}</p><div class="action-row"><button class="secondary" data-action="reject" ${disabled()}>拒绝</button><button class="primary" data-action="approve" ${disabled()}>允许这一次</button></div></section>`:'';}

function activity(t){return `<div class="chat-history" id="chat-history" data-task="${esc(t.id)}" role="region" aria-label="任务对话" tabindex="0"><div class="chat-date">今天 · 演示对话</div><div class="chat-turn"><div class="chat-user">${esc(t.status==='submitted'?t.title:'请'+t.title+'，完成后告诉我结果。')}</div><div class="chat-agent-label">${providerIcon(t.agent)}${esc(t.agent)}</div><div class="chat-assistant"><p>${esc(t.status==='submitted'?'任务已送达 Mac，等待 Agent 接收。':t.summary)}</p>${t.nextTitle&&t.status!=='done'?`<p>接下来：${esc(t.nextTitle)}。</p>`:''}</div><div class="chat-step"><span class="dot"></span><span>${esc(t.phase)}</span>${t.total?`<span>· ${t.step}/${t.total} 步</span>`:''}</div></div>${t.status==='done'?`<button class="chat-artifact" data-review-task="${esc(t.id)}">${icon('file')}<div><b>成果已准备好</b><small>${t.reviewed?'已验收':'查看预览 · 等待验收'}</small></div>${icon('chevron')}</button>`:''}${approvalBox(t)}${t.messages.map(m=>`<div class="chat-turn"><div class="chat-user">${esc(m)}</div><div class="chat-delivered">已送达 Mac · 模拟回执</div><div class="chat-agent-label">${providerIcon(t.agent)}${esc(t.agent)}<span>模拟回复</span></div><div class="chat-assistant">收到，这条补充已加入当前任务上下文。</div></div>`).join('')}</div><div class="chat-dock">${['done','interrupted'].includes(t.status)?`<div class="chat-resume"><span>${t.status==='done'?'这项任务已完成':'任务已中断'}</span><button class="text-button" data-action="resume" ${disabled()}>继续任务</button></div>`:''}<form id="message-form" class="chat-composer"><button type="button" class="icon-button" data-action="voice-sample" aria-label="插入语音转写示例">${icon('mic')}</button><label class="sr-only" for="message-text">消息内容</label><textarea id="message-text" rows="1" maxlength="2000" enterkeyhint="send" placeholder="发消息，或调整方向…">${esc(messageDrafts[t.id]||'')}</textarea><button id="chat-send" class="icon-button chat-send" aria-label="发送消息" disabled>${icon('send')}</button></form><p class="chat-hint">${!state.online?'离线 · 草稿已保留，重连后再发送':state.permission==='read'?'只读 · 可以编辑草稿，当前无法发送':`发给 ${esc(state.name)} · ${esc(t.agent)} · 演示`}</p></div>`;}
function updateChatInput(){const input=$('#message-text');if(!input)return;input.style.height='auto';input.style.height=Math.min(120,Math.max(44,input.scrollHeight))+'px';const task=state.tasks.find(t=>t.id===selectedTask);$('#chat-send').disabled=!canControl()||!input.value.trim()||!task||['done','interrupted','cancelled'].includes(task.status);}

function terminal(t){return `<div class="terminal"><header><span>终端输出</span><span>${state.online?'模拟快照':'离线快照'} · 09:41</span></header><pre id="terminal-output" tabindex="0" role="region" aria-label="终端输出内容"><span class="success">✓ Workspace ready</span>\nBranch: ${esc(t.branch)}\n\n${t.status==='approval'?esc(t.agent)+' requests permission:\n$ '+esc(t.request?.command||'等待请求详情')+'\n\nWaiting for your approval…':t.status==='interrupted'?'^C\nTask interrupted. Context preserved.':t.status==='done'?'✓ All checks passed.\nTask completed.':'> '+esc(t.phase)+'\n\n• Inspecting task context\n• Checking changes and tests\n\nWaiting for next event…'}\n${esc((terminalLines[t.id]||[]).join('\n'))}</pre></div><div class="terminal-controls"><div class="quickkeys"><button data-key="Tab" ${disabled()}>Tab</button><button data-key="Esc" ${disabled()}>Esc</button><button data-key="↑" ${disabled()}>↑</button><button data-key="↓" ${disabled()}>↓</button><button data-action="interrupt" ${!canControl()||!['running','submitted'].includes(t.status)?'disabled':''}>Ctrl C</button></div>${['interrupted','done'].includes(t.status)?`<button class="primary wide" data-action="resume" ${disabled()}>${icon('play')}继续任务</button>`:`<form id="terminal-form" class="row"><input aria-label="终端演示输入" id="terminal-input" placeholder="输入命令（模拟）" ${!canControl()||t.status!=='running'?'disabled':''}><button class="icon-button secondary" aria-label="发送终端输入" ${!canControl()||t.status!=='running'?'disabled':''}>${icon('send')}</button></form>`}</div>`;}

function changes(t){const login=t.id==='login';return `<div class="row between" style="font-size:12px"><span>2 个文件发生变化</span><span style="color:var(--green)">+24 <span style="color:var(--red)">−6</span></span></div><div class="diff"><header>${login?'src/connect/pair-device.ts':'src/task/connection.ts'} <span style="float:right">+18 −4</span></header><pre><span class="removed">− return connect(device);</span>+ validateDeviceScope(device);\n+ const result = await connect(device);\n+ return confirmReceipt(result);</pre></div><div class="diff"><header>tests/connection.test.ts <span style="float:right">+6 −2</span></header><pre>+ expect(offline.sent).toBe(false);\n+ expect(draft.text).toBe(input);\n+ expect(readOnly.canWrite).toBe(false);</pre></div><p class="muted" style="font-size:10px;line-height:1.7;margin-top:10px">示例 diff 摘要；真实版本将展示完整变更。</p>${approvalBox(t)}<button class="secondary wide" style="margin-top:16px" data-action="artifact">${icon('file')}查看验收预览</button>`;}
function artifactPreview(before=false,canAnnotate=false){return `<div class="artifact-preview"><div class="mini-window"><header><i></i><i></i><i></i><span>Norma OS</span></header><div class="preview-label">项目 · 快捷操作</div><div class="preview-grid ${before?'is-before':''}"><div class="preview-node">${providerIcon('Codex')}项目卡片<small>进行中</small>${before?'<div class="preview-extra">最近活动 · 09:41<br>会话 / 项目 / 上下文<br>任务进度 · 第 3 步</div>':''}</div><div class="preview-node">${providerIcon('Claude')}体验审查<small>空闲</small>${before?'<div class="preview-extra">等待任务分配<br>会话 / 项目 / 上下文</div>':`<button class="preview-pin" data-action="review-feedback" aria-label="批注项目卡片" ${canAnnotate?'':'disabled'}><span>1</span></button>`}</div></div></div><div class="artifact-caption">${icon('file')}项目快捷操作 · ${before?'修改前':'修改后'} · 示例预览</div></div>`;}
function artifact(t){const ready=t.status==='done';return `<div class="artifact-heading">${providerIcon(t.agent)}<span>${esc(t.agent)} · 成果验收</span></div><h2>${esc(t.title)}</h2><div class="segments" role="tablist" aria-label="成果对比"><button role="tab" data-artifact-version="before" aria-selected="${artifactVersion==='before'}">修改前</button><button role="tab" data-artifact-version="after" aria-selected="${artifactVersion==='after'}">修改后</button></div>${t.id==='workspace'?artifactPreview(artifactVersion==='before',ready&&canControl()):`<div class="info-summary"><b>成果正在准备</b><br>${esc(t.outcome||'Agent 会在完成后整理结果和验证说明')}<br>当前：${esc(t.phase)}</div>`}${t.reviewNote?`<p class="artifact-note">${esc(t.reviewNote)}</p>`:''}<div class="artifact-result">${t.reviewed?'已验收 · 决定已同步':ready?'Agent 已完成 · 等待你的验收':'等待 Agent 完成 · 暂不可验收'}</div><p class="muted" style="font-size:11px;line-height:1.8">${ready?'查看结果，留下调整意见，或确认这次交付。':'你可以在对话中继续补充想法。完成前不会提交验收。'}</p><div class="review-actions"><button class="secondary" data-action="review-feedback" ${!canControl()||!ready?'disabled':''}>继续调整</button><button class="primary" data-action="review-accept" ${!canControl()||!ready||t.reviewed?'disabled':''}>${icon('check')}${t.reviewed?'已验收':'验收通过'}</button></div><p class="decision-footnote">预览与验收为交互演示</p>`;}
function reviewFeedback(){const t=state.tasks.find(t=>t.id===selectedTask);if(!t)return;openSheet('留下调整意见',`<p>${esc(t.agent)} 会在当前任务中接收反馈，继续完善这份成果。</p><form id="review-feedback-form"><label><span>调整意见</span><textarea name="text" maxlength="600" required placeholder="例如：卡片间距再松一点，保留现在的信息层级。"></textarea></label><div id="sheet-error" class="sheet-error" role="alert"></div><button class="primary wide" ${disabled()}>发送调整意见 ${icon('send')}</button></form>`);}
function reviewInbox(){const ready=state.tasks.filter(t=>t.status==='done'&&!t.reviewed);openSheet('待你验收',ready.length?`<div class="list-group">${ready.map(t=>`<button class="list-row" data-review-task="${esc(t.id)}">${providerIcon(t.agent)}<div>${esc(t.title)}<small>${esc(t.project)} · Agent 已完成</small></div>${icon('chevron')}</button>`).join('')}</div>`:'<div class="empty">'+icon('check')+'<h2>暂时没有待验收成果</h2><p>Agent 完成后，成果会出现在这里。</p></div>');}
function dailyBrief(){const next=nextSteps(state)[0];openSheet('今日简报',`<div class="info-summary"><b>当前方向</b><br>${esc(state.direction.text)}</div><div class="list-group"><div class="list-row">${icon('shield')}<div>${pendingDecisions(state).length} 项等你决定<small>确认后，负责的 Agent 会继续推进。</small></div></div><div class="list-row">${icon('check')}<div>${state.tasks.filter(t=>t.status==='done'&&!t.reviewed).length} 项等你验收<small>检查成果，再决定是否继续调整。</small></div></div></div><p class="hint">下一份交付：${esc(next?.outcome||'当前工作已完成')}。<br>根据本次演示状态整理。</p><button class="primary wide" data-action="close-sheet">知道了</button>`);}
function detail(){const t=state.tasks.find(x=>x.id===selectedTask);if(!t)return '<div class="empty">任务不存在<button data-page="tasks">返回任务</button></div>';const backLabel=detailOrigin==='projects'?'项目卡片':detailOrigin==='overview'?(homeView==='plan'?'指挥台':'待你决策'):'全部任务';return `<header class="task-nav"><button class="icon-button back" data-page="${detailOrigin}" aria-label="返回${backLabel}">${icon('back')}</button><div class="task-nav-title"><h1 title="${esc(t.title)}">${esc(t.title)}</h1><div class="task-nav-meta">${providerIcon(t.agent)}<span>${esc(t.agent)} · ${esc(state.name)}</span>${badge(t.status)}</div></div><button class="icon-button" data-action="task-info" aria-label="任务信息">${icon('more')}</button></header><div class="detail-tabs" role="tablist" aria-label="任务详情视图">${[['activity','对话'],['terminal','终端'],['changes','变更'],['artifact','成果']].map(([k,v])=>`<button role="tab" aria-selected="${taskTab===k}" data-task-tab="${k}">${v}</button>`).join('')}</div><div class="detail-body ${taskTab==='terminal'?'is-terminal':taskTab==='activity'?'is-chat':''}">${taskTab==='activity'?activity(t):taskTab==='terminal'?terminal(t):taskTab==='artifact'?artifact(t):changes(t)}${taskTab!=='changes'?'':['running','submitted'].includes(t.status)?`<button class="secondary wide" style="margin-top:20px;color:var(--muted)" data-action="interrupt" ${disabled()}>${icon('pause')}中断任务</button>`:['interrupted','done'].includes(t.status)?`<button class="primary wide" style="margin-top:20px" data-action="resume" ${disabled()}>${icon('play')}继续任务</button>`:''}</div>`;}
function taskInfo(){const t=state.tasks.find(x=>x.id===selectedTask);if(!t)return;openSheet('任务信息',`<h3>${esc(t.title)}</h3><dl class="task-facts"><dt>执行 Agent</dt><dd>${esc(t.agent)}</dd><dt>项目</dt><dd>${esc(t.project)}</dd><dt>分支</dt><dd class="mono">${esc(t.branch)}</dd><dt>已用时</dt><dd>${esc(t.elapsed)}</dd><dt>设备</dt><dd>${esc(state.name)}</dd></dl><button class="secondary wide" data-action="share-progress">${icon('copy')}进展摘要</button>${['running','submitted'].includes(t.status)?`<button class="danger wide" style="margin-top:10px" data-action="interrupt" ${disabled()}>${icon('pause')}中断任务</button>`:''}<p class="hint">交互演示 · 终端输入仅显示模拟回执，不执行真实命令。</p>`);}

function devices(){return `<div class="row between"><h1>设备</h1><button class="icon-button" data-action="pair" aria-label="连接 Mac">${icon('plus')}</button></div><p class="screen-subtitle">我的电脑 · ${machines.filter(m=>m.paired).length} 台已配对</p>${machineRows()}<div class="section-head"><h2>当前电脑</h2><span>仅管理下方这台 Mac</span></div><div class="device-title"><h2>${esc(state.name)}</h2><p><span class="dot" style="color:${state.online?'var(--green)':'var(--amber)'};margin-right:5px"></span>${state.online?'在线 · 刚刚同步':'暂时离线 · 上次同步 09:41'} · 演示设备</p></div><div class="list-group"><button class="list-row" data-action="connection-info">${icon('wifi')}<div>连接方式<small>${state.online?'加密中继 · 可跨网络连接（方案演示）':'连接已中断，任务可能仍在 Mac 执行'}</small></div>${icon('chevron')}</button><button class="list-row" data-action="permission-info">${icon('shield')}<div>访问权限<small>${state.permission==='control'?'查看与控制':'仅查看'} · ${esc(Object.values(state.projects).join("、"))}</small></div>${icon('chevron')}</button><button class="list-row" data-action="device-tasks">${icon('tasks')}<div>这台 Mac 上的任务<small>${state.tasks.length} 个任务 · 点击查看</small></div>${icon('chevron')}</button></div><div class="section-head"><h2>偏好</h2></div><div class="list-group"><button class="list-row" role="switch" aria-checked="${state.notifications}" data-action="toggle-notifications">${icon('bell')}<div>关键进展通知<small>完成、失败、待确认时提醒</small></div><span class="toggle ${state.notifications?'on':''}"></span></button><button class="list-row" role="switch" aria-checked="${document.documentElement.dataset.dark==='true'}" data-action="theme">${icon('moon')}<div>深色外观</div><span class="toggle ${document.documentElement.dataset.dark==='true'?'on':''}"></span></button></div><button class="secondary wide device-connect-entry" data-action="pair">${icon('scan')}添加另一台电脑</button><button class="danger wide" data-action="revoke-confirm" style="margin-top:20px">撤销当前电脑的配对</button><div class="section-head"><h2>原型场景</h2><span>仅影响本页</span></div><div class="scenario-row"><button data-action="toggle-connection">${state.online?'模拟断线':'模拟重连'}</button><button data-action="toggle-permission">${state.permission==='control'?'切换只读':'模拟 Mac 授予控制'}</button><button data-action="reset">重置演示</button></div><p class="muted" style="font-size:10px;line-height:1.7;margin-top:16px">此页只演示连接和授权。正式版本的控制授权由 Mac 确认，手机不能自行提权。</p>`;}
function pairingIllustration(){return `<div class="pair-illustration" aria-hidden="true"><img src="assets/norma-ios-emerald/mac-still-life.png" alt="">${pairingQR()}</div>`;}

function pairingDevice(){return `<div class="connect-device">${icon('laptop')}<div><b>${esc(pairingTarget().name)}</b><p><span class="dot"></span>本地网络 · 演示设备</p></div></div>`;}
function connect(){
  const step=pairStep,stage=step==='guide'?0:['scan','code'].includes(step)?1:2;
  const nav=`<header class="connect-nav">${step==='guide'&&!state.paired?`<button class="icon-button" data-action="switch-machine" aria-label="切换电脑">${icon('laptop')}</button>`:`<button class="icon-button" data-action="pair-back" aria-label="${step==='guide'?'返回设备':'返回上一步'}">${icon('back')}</button>`}<h1>连接 Mac</h1><button class="icon-button" data-action="pair-help" aria-label="连接帮助">${icon('more')}</button></header>`;
  const progress=`<ol class="connect-progress" aria-label="连接步骤">${['准备 Mac','扫描二维码','确认连接'].map((label,i)=>`<li class="${i===stage?'is-current':i<stage?'is-complete':''}" ${i===stage?'aria-current="step"':''} aria-label="${i+1}. ${label}"></li>`).join('')}</ol>`;
  let body='';
  if(step==='guide')body=`<div class="connect-hero"><h2>${pendingMachine?'添加另一台 Mac':'连接你的 Mac'}</h2><p>把本地工作，带在身边。</p></div>${pairingIllustration()}<ol class="connect-steps"><li><span class="step-number">1</span><div><b>在 Mac 上打开 Norma</b><p>保持电脑联网，Norma 正在运行。</p></div></li><li><span class="step-number">2</span><div><b>显示连接二维码</b><p>进入「设置 → 手机连接」，点击「连接手机」。</p></div></li><li><span class="step-number">3</span><div><b>扫描并确认</b><p>首次连接时使用同一 Wi-Fi，随后在 Mac 确认授权。</p></div></li></ol><div class="connect-footer"><button class="primary wide scan-cta" data-action="pair-scan">${icon('scan')}扫描二维码 ${icon('chevron')}</button><button class="text-button" data-action="pair-manual">输入配对码</button><p class="connect-note">配对流程演示 · 不调用相机或连接真实机器</p></div>`;

  if(step==='code')body=`<div class="connect-hero"><h2>输入配对码</h2><p>无法扫码时，在 Mac 的「手机连接」<br>查看六位配对码并输入。</p></div><form id="pair-form" class="connect-manual"><label><span>配对码</span><input name="code" class="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" value="${esc(pairCode)}" required></label><p class="hint">演示配对码：<b class="mono">482619</b></p><div id="sheet-error" class="sheet-error" role="alert"></div><div class="connect-footer"><button class="primary wide">核对设备</button><button class="text-button" type="button" data-action="pair-scan">改用扫码连接</button></div></form>`;

  if(action==='artifact'){artifactVersion='after';taskTab='artifact';render(true);}
  if(action==='connection-info')openSheet('连接状态',`<div class="info-summary">设备：${esc(state.name)}<br>当前：${state.online?'在线':'离线'}<br>通道：端到端加密中继（产品方案）<br>最近同步：09:41<br>适用：Wi‑Fi / 蜂窝网络</div><p>Mac 必须联网且运行 Norma。休眠或断网时，手机显示最近快照，不会把未送达的操作显示为已执行。</p><button class="secondary wide" data-action="toggle-connection">${state.online?'模拟连接中断':'模拟恢复连接'}</button><p class="hint">通道、延迟与设备均为演示；尚未实现远程服务。</p>`);
  if(action==='permission-info')openSheet('访问权限',`<div class="info-summary">授权设备：本机 iPhone<br>范围：${esc(Object.values(state.projects).join("、"))}<br>权限：${state.permission==='control'?'查看任务、发送指令、中断与继续':'仅查看任务与产物'}</div><p>正式版本在 Mac 上授予或修改权限，也可以从任一已授权设备撤销本机连接。</p><button class="secondary wide" data-action="toggle-permission">${state.permission==='control'?'演示：切换只读':'演示：Mac 授予控制'}</button>`);
  if(action==='revoke-confirm')openSheet('撤销手机配对？',`<p>这台 iPhone 将失去对 ${esc(state.name)} 的访问权限。其他电脑的配对与所有 Mac 上的任务不受影响。</p><div class="action-row"><button class="secondary" data-action="close-sheet">取消</button><button class="danger" data-action="revoke">撤销配对</button></div>`);
  if(action==='revoke'){closeSheet();pairStep='guide';pairCode='';run({type:'revoke'});}
});
document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;$('#task-results').innerHTML=taskResults();}if(event.target.id==='message-text'){messageDrafts[selectedTask]=event.target.value;updateChatInput();}});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;
  if(form.id==='review-feedback-form'){const data=Object.fromEntries(new FormData(form));const result=transition(state,{type:'review-feedback',id:selectedTask,text:data.text});if(!result.ok){formError(result.message);return;}closeSheet();render();notify(result.message);return;}
  if(form.id==='direction-form'){const data=Object.fromEntries(new FormData(form));const result=transition(state,{type:'direction',id:data.priorityId,text:data.text});if(!result.ok){formError(result.message);return;}homeView='plan';navigate('overview');notify(result.message);}
  if(form.id==='new-card-form'){const result=transition(state,{type:'create-card',...Object.fromEntries(new FormData(form))});if(!result.ok){formError(result.message);return;}navigate('projects');notify(result.message);}
  if(form.id==='new-task-form'){const data=Object.fromEntries(new FormData(form));const result=transition(state,{type:'create',...data});if(!result.ok){formError(result.message);return;}taskTab='activity';navigate('detail',result.id);notify(result.message);}
  if(form.id==='message-form'){const result=transition(state,{type:'message',id:selectedTask,text:$('#message-text').value});if(result.ok){messageDrafts[selectedTask]='';render();$('#chat-history').scrollTop=$('#chat-history').scrollHeight;$('#message-text').focus({preventScroll:true});$('#toast').classList.remove('show');$('#toast').textContent=result.message;}else notify(result.message);}
  if(form.id==='terminal-form'){if(!canControl())return;const text=$('#terminal-input').value.trim();if(!text)return;terminalLines[selectedTask]??=[];terminalLines[selectedTask].push('$ '+text,'[模拟回执：输入已送达，未执行真实命令]');render();$('#terminal-output').scrollTop=$('#terminal-output').scrollHeight;$('#terminal-input').focus({preventScroll:true});notify('终端输入已送达（模拟）');}
  if(form.id==='pair-form'){pairCode=new FormData(form).get('code');const error=pairingCodeError(pairCode);if(error){formError(error);return;}setPairStep('confirm');}
  if(form.id==='pair-confirm-form'){const data=new FormData(form),target=pairingTarget(),name=data.get('machineName')?.trim();if(pendingMachine&&(!name||name.length>40)){formError('请填写 1–40 字的电脑名称');return;}const result=transition(target,{type:'pair',code:pairCode,confirmed:true,permission:data.get('permission')});if(!result.ok){formError(result.message);return;}if(pendingMachine){target.name=name;machines.push(target);activateMachine(target.machineId);}setPairStep('success');writeRoute('connect',true);notify(result.message);}
});

document.addEventListener('keydown',event=>{if(event.target.id==='message-text'&&event.key==='Enter'&&!event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();if(!$('#chat-send').disabled)$('#message-form').requestSubmit();}});

function resetDecisionDrag(drag){if(!drag)return;drag.card.classList.remove('dragging');drag.card.style.transition='transform 200ms ease-out';drag.card.style.transform='';drag.card.querySelectorAll('.decision-stamp').forEach(el=>el.style.opacity='0');}
document.addEventListener('pointerdown',event=>{
  const card=event.target.closest('#decision-card');
  if(!card||!event.isPrimary||event.button!==0||!canControl()||event.target.closest('button,a,input,textarea,select,code'))return;
  const x=new DOMMatrixReadOnly(getComputedStyle(card).transform).m41;
  card.style.animation='none';card.style.transition='none';card.classList.add('dragging');
  activeSwipe={card,id:card.dataset.decision,pointer:event.pointerId,x:event.clientX,y:event.clientY,baseX:x,dx:0,dy:0};
  card.setPointerCapture(event.pointerId);
});
document.addEventListener('pointermove',event=>{
  const drag=activeSwipe;if(!drag||drag.pointer!==event.pointerId)return;
  drag.dx=event.clientX-drag.x;drag.dy=event.clientY-drag.y;
  if(Math.abs(drag.dy)>8&&Math.abs(drag.dy)>Math.abs(drag.dx)*1.25){activeSwipe=null;resetDecisionDrag(drag);if(drag.card.hasPointerCapture(event.pointerId))drag.card.releasePointerCapture(event.pointerId);return;}
  if(Math.abs(drag.dx)<8)return;
  const dx=drag.dx+drag.baseX,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  drag.card.style.transform=reduced?'none':`translateX(${dx}px) rotate(${Math.max(-9,Math.min(9,dx/20))}deg)`;
  const action=swipeDecision(drag.dx,drag.dy,drag.card.clientWidth),opacity=Math.min(1,Math.abs(dx)/90);
  drag.card.querySelector('.approve-stamp').style.opacity=dx>0?String(opacity):'0';
  drag.card.querySelector('.reject-stamp').style.opacity=dx<0?String(opacity):'0';
  drag.card.querySelector('.approve-stamp').textContent=action==='approve'?'松手允许':'右滑允许';
  drag.card.querySelector('.reject-stamp').textContent=action==='reject'?'松手拒绝':'左滑拒绝';
});
document.addEventListener('pointerup',event=>{
  const drag=activeSwipe;if(!drag||drag.pointer!==event.pointerId)return;activeSwipe=null;
  if(drag.card.hasPointerCapture(event.pointerId))drag.card.releasePointerCapture(event.pointerId);
  const action=swipeDecision(event.clientX-drag.x,event.clientY-drag.y,drag.card.clientWidth);
  if(action&&canControl())decide(drag.id,action);else resetDecisionDrag(drag);
});
function cancelDecisionGesture(){const drag=activeSwipe;activeSwipe=null;resetDecisionDrag(drag);}
document.addEventListener('pointercancel',cancelDecisionGesture);
document.addEventListener('lostpointercapture',cancelDecisionGesture);
window.addEventListener('blur',cancelDecisionGesture);

$('#sheet').addEventListener('click',event=>{if(event.target!==$('#sheet'))return;const rect=$('#sheet').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeSheet();});
function routeFromHash(){const id=new URLSearchParams(location.search).get('machine')||machines[0].machineId;if(!activateMachine(id)){activateMachine(machines[0].machineId);page='devices';writeRoute('devices',true);render(true);notify('这台电脑不在当前演示中，请重新选择');return;}const hash=location.hash.slice(1);if(hash==='connect'&&page!=='connect'){pairStep='guide';pairCode='';}if(hash.startsWith('task/')){selectedTask=hash.slice(5);page='detail';}else if(hash.startsWith('project/')){boardProject=projectRoutes[hash.slice(8)]||Object.values(projectRoutes)[0];page='projects';}else if(['overview','projects','tasks','devices','connect'].includes(hash))page=hash;else{page='overview';writeRoute('overview',true);}render(true);}
document.addEventListener('visibilitychange',()=>{document.documentElement.dataset.pageHidden=document.hidden;});
window.addEventListener('popstate',()=>{closeSheet();routeFromHash();});
if(new URLSearchParams(location.search).get('scenario')==='offline')state.online=false;
if(new URLSearchParams(location.search).get('scenario')==='pairing')state.paired=false;
if(new URLSearchParams(location.search).get('scenario')==='readonly')state.permission='read';
routeFromHash();
</script>
</body>
</html>
