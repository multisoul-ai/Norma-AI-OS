function showEvidence(id){const d=decisions.find(d=>d.id===id),w=workBy(id),a=agentFor(id);dialog(t('evidenceTitle'),`<p class="dialog-copy">${t('sampleEvidence')}</p><div class="row">${avatar(a)}<b style="font-size:12px">${a.name}</b><span class="muted tiny">${esc(l(w.title))}</span></div><div class="evidence-block"><strong>${t('originalQuestion')}</strong><br>${esc(l(d.title))}</div><div class="evidence-block"><strong>${t('basis')}</strong><br>${esc(l(d.evidence))}</div><div class="evidence-block"><strong>${t('impact')}</strong><br>${esc(l(d.impact))}</div>`,`<button class="btn" data-action="close">${t('close')}</button><button class="btn primary" data-locate="${id}">${t('onCanvas')}${icon('arrow')}</button>`)}
function showEdit(id){const d=decisions.find(d=>d.id===id);dialog(t('editTitle'),`<p class="dialog-copy">${esc(l(d.title))}</p><form id="decision-form" data-form="edit" data-id="${id}" data-version="${d.version}"><label>${t('yourAnswer')}<textarea data-testid="decision-edit" name="answer" required>${esc(l(d.recommended))}</textarea></label></form><p class="dialog-copy" style="font-size:11px">${t('editHint')}</p>`,`<button class="btn" data-action="close">${t('cancel')}</button><button type="submit" form="decision-form" class="btn primary" data-testid="submit-edit">${t('submitEdit')}${icon('check')}</button>`);document.querySelector('[data-testid="decision-edit"]').focus()}

SpeechSynthesisUtterance(summary());speech.lang=lang==='zh'?'zh-CN':'en-US';speechSynthesis.speak(speech)}break}case 'takeover':{const a=agentFor(focusedWork);a.control=a.control==='human'?'agent':'human';render();center();notice(t(a.control==='human'?'heldByYou':'agentControl'));break}}});

function projectFor(id){return projects.find(p=>p.id===workMeta[id]?.project)||projects[0]}
function projectWorks(id){return work.filter(w=>workMeta[w.id]?.project===id)}
function bucket(w){if(openDecisions().some(d=>d.id===w.id))return 'attention';if(w.stage==='done')return 'done';if(['waiting','merge'].includes(w.stage))return 'waiting';return 'running'}
function nextAction(w){if(w.stage==='attention')return t('pendingAnswer');if(w.stage==='approval')return t('pendingPreview');if(w.stage==='ready')return t('pendingReview');if(w.stage==='merge')return t('nextMerge');if(w.stage==='done')return t('nextDone');if(w.stage==='waiting')return t('nextWaiting');return t('nextWorking')}
function whenUpdated(id){const n=workMeta[id]?.updated;return n===0?t('justNow'):`${n||1} ${t('minutes')}`}
function header(){return `<header class="topbar"><div class="brand"><div class="traffic"><i></i><i></i><i></i></div><span class="brand-word"><span class="brand-logo">n</span>norma</span><span class="crumb">${t('workspace')}</span></div><nav class="view-switch" aria-label="${t('workspace')}"><button data-action="norma" data-testid="nav-norma" ${route==='norma'?'aria-current="page"':''}>${icon('spark')}${t('viewNorma')}</button><button data-action="canvas" data-testid="nav-canvas" ${route==='canvas'?'aria-current="page"':''}>${icon('grid')}${t('canvas')}</button></nav><div class="top-tools"><span class="saved"><i class="dot"></i>${t('saved')}</span><button class="icon-btn" data-action="search" data-testid="search-work" aria-label="${t('searchThreads')}" title="${t('searchThreads')}">${icon('search')}</button><a class="icon-btn explain-link" href="../../research/2026-11-04-super-agent-workflow.html" target="_blank" rel="noopener" title="${t('explain')}" aria-label="${t('explain')}">${icon('bulb')}</a><button class="icon-btn" data-action="video" data-testid="video-toggle" title="${t(videoPaused?'videoPlay':'videoPause')}" aria-label="${t(videoPaused?'videoPlay':'videoPause')}">${icon(videoPaused?'play':'pause')}</button><button class="icon-btn" data-action="language" data-testid="language" title="${t('lang')}" aria-label="${t('lang')}" style="font-size:10px">${lang==='zh'?'EN':'中'}</button></div></header>`}

function threadBody(key){const isTask=viewPage==='thread',p=isTask?projectFor(scope):projects.find(p=>p.id===selectedChannel),meta=isTask?workMeta[scope]:null;const goal=isTask?l(meta.goal):viewPage==='home'?t('normaHomeGoal'):t(p.goal);const constraint=isTask?l(meta.constraint):viewPage==='home'?t('normaHomeConstraint'):t(p.constraint);return `<div class="thread-messages" data-testid="thread-messages" data-chat-scroll data-context-key="${key}"><section class="pinned-brief"><div class="pinned-label">${icon('layers')}${t('currentGoal')}</div><p>${esc(goal)}</p><small>${esc(constraint)}</small></section><div class="date-divider">${t('today')}</div>${(seedMessages[key]||[]).map(m=>messageHTML(m,key)).join('')}${messages.map((m,i)=>({m,i})).filter(({m})=>m.context===key).map(({m,i})=>messageHTML(m,key,i)).join('')}${viewPage==='channel'?`<div class="channel-goals"><div class="eyebrow" style="font-size:8px;margin-bottom:10px">${t('projectThreads')}</div>${projectWorks(selectedChannel).map(w=>`<button class="channel-thread-card" data-open-thread="${w.id}"><i class="task-dot ${w.stage}"></i><span><strong>${esc(l(w.title))}</strong><small>${agentFor(w.id).name} · ${whenUpdated(w.id)}</small></span>${phase(w)}${icon('arrow')}</button>`).join('')}</div>`:''}</div>`}
function composerHTML(key){const state=contextState(key);const label=viewPage==='thread'?l(workBy(scope).title):viewPage==='channel'?'# '+t(projects.find(p=>p.id===selectedChannel).name):t('normaHome');const placeholder=viewPage==='thread'?t('threadPlaceholder')+label:viewPage==='channel'?t('channelPlaceholder')+label:t('homePlaceholder');return `<div class="thread-composer"><div class="composer-recipient"><span>${t('sendToNorma')} · <strong>${esc(label)}</strong></span><span>${viewPage==='thread'?t('onlyThisWork'):viewPage==='channel'?t('onlyThisChannel'):t('global')}</span></div><form class="input-box" data-form="chat"><textarea data-testid="composer" data-draft-context="${key}" name="message" aria-label="${esc(placeholder)}" placeholder="${esc(placeholder)}">${esc(state.draft)}</textarea><div class="input-tools"><span class="composer-identity">${icon('layers')}${t('threadSummary')}</span><div class="composer-actions"><button type="button" class="icon-btn" data-action="info" aria-label="${t('info')}">${icon('bulb')}</button><button class="send-btn" type="submit" data-testid="send" title="${t('send')}" aria-label="${t('send')}">${icon('send')}</button></div></div></form><div class="composer-foot"><span>${t('inputHint')}</span><span>${t('localHint')}</span></div></div>`}
function progressPanel(){const w=workBy(scope),meta=workMeta[scope],a=agentFor(scope),d=decisions.find(d=>d.id===scope&&d.status==='open');activeDecision=scope;return `<aside class="thread-progress" data-testid="progress-panel"><header class="progress-header"><h2>${t('threadProgress')}</h2><button class="icon-btn progress-details" data-inspect="${scope}" title="${t('inspect')}" aria-label="${t('inspect')}">${icon('layers')}</button><button class="icon-btn progress-close" data-action="threads-progress" title="${t('hideProgress')}" aria-label="${t('hideProgress')}">${icon('close')}</button></header><div class="progress-content"><section class="status-focus"><div class="between"><span class="eyebrow">${t('phaseLabel')}</span>${phase(w)}</div><p>${esc(l(w.title))}</p><small>${t('updatedAt')} ${whenUpdated(scope)}</small></section><div class="step-heading"><span>${t('planLabel')}</span><span>${meta.completed} / ${w.plan.length} ${t('stepsComplete')}</span></div><div class="step-list">${w.plan.map((p,i)=>`<div class="step-row ${i<meta.completed?'done':i===meta.completed?'active':''}"><span class="step-number">${i<meta.completed?'✓':String(i+1)}</span><span>${esc(l(p))}</span></div>`).join('')}</div><div class="owner-strip">${avatar(a)}<span><strong>${a.name}</strong><small>${a.model}</small></span><span>${t(meta.new?'plannedOwner':'owner')}</span></div><div class="eyebrow" style="font-size:8px;margin-bottom:9px">${t('latestUpdate')}</div><p class="progress-project">${esc(l(w.last))}</p>${a.control==='human'?`<div class="human-banner">${t('heldByYou')}</div>`:''}${d?`<div class="progress-decision-label">${icon(d.kind==='question'?'bulb':d.kind==='permission'?'alert':'check')}${t('recommendationForYou')}</div>${decisionCard(d)}`:`<div class="quiet-progress">${icon('check')}<span>${t(w.stage==='merge'?'doneDecision':'noDecision')}</span></div>`}<button class="btn progress-canvas" data-locate="${w.id}">${icon('grid')}${t('onCanvas')}${icon('arrow')}</button><p class="next-step-note"><strong>${t('nextAction')}：</strong>${nextAction(w)}</p></div></aside>`}
function projectProgress(){const isHome=viewPage==='home',p=projects.find(p=>p.id===selectedChannel),items=isHome?work:projectWorks(p.id),pending=items.filter(w=>bucket(w)==='attention').length;return `<aside class="thread-progress"><header class="progress-header"><h2>${isHome?t('summaryLabel'):t('projectSummary')}</h2>${icon('layers')}</header><div class="progress-content"><p class="progress-project">${isHome?summary():t(p.goal)}</p><div class="channel-fact"><span>${t('allWork')}</span><b>${items.length}</b></div><div class="channel-fact"><span>${t('inProgress')}</span><b>${items.filter(w=>bucket(w)==='running').length}</b></div><div class="channel-fact"><span>${t('attentionInbox')}</span><b style="color:var(--warm)">${pending}</b></div><div class="channel-fact"><span>${t('deliveredState')}</span><b>${items.filter(w=>bucket(w)==='done').length}</b></div><p class="next-step-note">${t('channelProgressHint')}</p><div class="channel-progress-label">${t('projectThreads')}</div>${items.slice(0,5).map(w=>`<button class="channel-thread-card" data-open-thread="${w.id}"><i class="task-dot ${w.stage}"></i><span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l(workMeta[w.id].short))}</span>${icon('arrow')}</button>`).join('')}<button class="btn progress-canvas" data-page="overview" style="margin-top:20px">${t('overview')}${icon('arrow')}</button></div></aside>`}
function conversationView(){const isTask=viewPage==='thread',isChannel=viewPage==='channel',w=isTask?workBy(scope):null,p=isTask?projectFor(scope):projects.find(p=>p.id===selectedChannel),key=contextKey();const title=isTask?l(w.title):isChannel?'# '+t(p.name):t('normaHomeTitle');return `<section class="thread-chat"><header class="thread-header"><div class="thread-breadcrumb"><button class="icon-btn mobile-menu" data-action="threads-menu" aria-label="${t('navMenu')}">${icon('layers')}</button>${isTask?`<button data-channel="${p.id}"># ${t(p.name)}</button><span>/</span><span>${t('thread')}</span>`:isChannel?t('channel'):t('normaHomeSubtitle')}</div><div class="between"><div class="title-row">${icon(isTask?'layers':isChannel?'grid':'spark')}<h1 ${isTask?'data-testid="thread-title"':isChannel?'data-testid="channel-title"':''}>${esc(title)}</h1></div><div class="thread-head-actions">${isTask?`<button class="btn ghost" data-testid="thread-canvas" data-locate="${w.id}">${t('onCanvas')}${icon('arrow')}</button>`:''}<button class="btn progress-toggle" data-action="threads-progress">${icon('layers')}${t('viewProgress')}</button></div></div></header><div class="thread-info-bar"><div class="thread-participants"><span class="n-avatar">n</span><span>Norma</span>${isTask?`${avatar(agentFor(scope))}<span>${agentFor(scope).name}</span>`:''}</div>${isTask?phase(w):`<span>${isChannel?projectWorks(p.id).length:work.length} ${t('workCount')}</span>`}</div>${threadBody(key)}${composerHTML(key)}</section>${isTask?progressPanel():projectProgress()}`}

pan>${t('phaseColumn')}</span><span>${t('nextColumn')}</span><span style="text-align:center">${t('canvasColumn')}</span></div>${items.length?items.map(w=>`<article class="overview-work" data-overview-work="${w.id}"><div><button class="work-title-btn" data-open-thread="${w.id}">${esc(l(w.title))}</button><div class="overview-project"><span># ${t(projectFor(w.id).name)}</span><span>·</span><span>${agentFor(w.id).name}</span></div></div>${phase(w)}<div class="overview-next">${esc(l(w.last))}<small>${t('nextAction')} · ${nextAction(w)}</small></div><button class="locate-small" data-locate="${w.id}">${t('canvasColumn')}${icon('arrow')}</button></article>`).join(''):`<div class="empty overview-empty">${t('noSearchResults')}</div>`}</div><p class="overview-footnote">${t('stageNote')} · ${t('localHint')}</p></div></section>`}

function rememberContext(){const input=stage.querySelector('[data-draft-context]');if(input)contextState(input.dataset.draftContext).draft=input.value;const box=stage.querySelector('[data-chat-scroll],[data-page-scroll]');if(box)contextState(box.dataset.contextKey).scroll=box.scrollTop}

function focusDecision(id){openThread(id);progressOpen=true;render();document.querySelector(`[data-active-decision="${id}"]`)?.scrollIntoView({block:'nearest',behavior:'instant'})}
function summary(){return lang==='zh'?`当前有 ${work.length} 项工作，${openDecisions().length} 件需要你处理。各项任务的讨论和进度独立保留。`:`There are ${work.length} work items and ${openDecisions().length} decisions for you. Each work item keeps its own discussion and progress.`}
function chatReply(text){const key=contextKey();rememberContext();messages.push({role:'user',text,context:key});let answer;if(viewPage==='thread'){const w=workBy(scope);answer=[`这条补充已保留在「${lAt(w.title,'zh')}」的讨论中。\n当前进展：${lAt(w.last,'zh')}。其他任务的讨论与要求不会受影响。`,`Your message stays with “${lAt(w.title,'en')}”.\nCurrent progress: ${lAt(w.last,'en')}. Other work threads remain separate.`]}else answer=viewPage==='channel'?words.channelReply:words.homeReply;messages.push({role:'assistant',text:answer,context:key});contextState(key).draft='';draft='';const input=document.querySelector('[data-testid="composer"]');if(input)input.value='';render();const box=document.querySelector('[data-chat-scroll]');if(box){box.scrollTop=box.scrollHeight;contextState(key).scroll=box.scrollTop}}
function applyDecision(id,answer=null,version=null){const d=decisions.find(d=>d.id===id),w=workBy(id),a=agentFor(id);if(!d||d.status!=='open'||version!==null&&d.version!==version){notice(t('resolved'));closeDialog();return}if(a.control==='human'){notice(t('heldByYou'));return}d.status='resolved';d.version++;w.stage=d.kind==='review'?'merge':'working';w.last=d.kind==='review'?['本轮验收通过，尚未合并与发布','Revision accepted; not merged or released']:d.kind==='permission'?['收到本次预览部署授权，正在执行','Preview deployment allowed; work continuing']:['原问题已答复，继续修复与验证','Question answered; continuing the fix and verification'];workMeta[id].updated=0;const result=d.kind==='review'?'reviewed':d.kind==='permission'?'approved':'delivered';handledRecords.unshift({text:[`${a.name} · ${tFor(result,'zh')}`,`${a.name} · ${tFor(result,'en')}`],detail:answer||d.recommended});messages.push({role:'user',text:answer||d.recommended,context:id});messages.push({role:'assistant',text:words[result],context:id});if(!(viewPage==='thread'&&scope===id))contextState(id).unread++;closeDialog();render();notice(t(result))}
function searchResults(query=''){const q=query.trim().toLowerCase(),items=work.filter(w=>[l(w.title),t(projectFor(w.id).name),agentFor(w.id).name].join(' ').toLowerCase().includes(q));return items.length?items.map(w=>`<article class="search-work-row" data-search-work="${w.id}">${avatar(agentFor(w.id))}<button data-open-thread="${w.id}">${esc(l(w.title))}<small># ${t(projectFor(w.id).name)} · ${agentFor(w.id).name}</small></button>${phase(w)}</article>`).join(''):`<div class="empty">${t('noSearchResults')}</div>`}
function showAllWork(searchable=false){if(!searchable){openPage('overview');return}dialog(t('searchThreads'),`<p class="dialog-copy">${t('searchHint')}</p><input class="searchbox" data-testid="search-input" data-thread-search type="search" placeholder="${t('search')}" aria-label="${t('searchThreads')}"><div data-thread-search-results>${searchResults()}</div>`);document.querySelector('[data-thread-search]').focus()}
function newWorkDialog(preset='',project=null){const target=project||((viewPage==='thread'&&workMeta[scope])?workMeta[scope].project:viewPage==='channel'?selectedChannel:'desktop');dialog(t('newWork'),`<p class="dialog-copy">${t('newWorkHint')}</p><form id="new-work-form" data-form="new-work" class="new-work-fields"><label>${t('newWorkTitle')}<input name="title" data-testid="new-work-title" value="${esc(preset)}" placeholder="${t('newWorkPlaceholder')}" required maxlength="150"></label><label>${t('newWorkProject')}<select name="project" data-testid="new-work-project">${projects.map(p=>`<option value="${p.id}" ${target===p.id?'selected':''}># ${t(p.name)}</option>`).join('')}</select></label><label>${t('newWorkGoal')}<textarea name="goal" placeholder="${t('newWorkGoalPlaceholder')}"></textarea></label></form>`,`<button class="btn" data-action="close">${t('cancel')}</button><button class="btn primary" type="submit" form="new-work-form" data-testid="create-work">${t('createWork')}${icon('arrow')}</button>`);document.querySelector('[data-testid="new-work-title"]').focus()}
function createWork(data){const title=String(data.get('title')||'').trim();if(!title)return;const project=String(data.get('project')||'desktop'),goal=String(data.get('goal')||'').trim();const id='work-'+(++newWorkSequence),owner=project==='website'?'iris':'echo';work.push({id,owner,title,stage:'waiting',last:['目标已记录，等待 Norma 安排执行','Goal recorded; waiting for Norma to arrange execution'],plan:[['核对目标与边界','Review goal and scope'],['安排执行与验证','Arrange execution and verification'],['交付可验收结果','Deliver a reviewable result']]});workMeta[id]={project,short:title,goal:goal||title,constraint:['这是一项独立工作；执行安排待确认。','This is independent work; assignment is still pending.'],completed:0,updated:0,unread:0,new:true};seedMessages[id]=[{role:'user',text:goal?title+'\n'+goal:title},{role:'assistant',text:['独立讨论已经建立，目标与后续反馈会留在这里。目前等待执行安排，尚未开始工作。','This work now has its own discussion. Keep its goal and follow-ups here. Assignment is pending; execution has not started.']}];closeDialog();openThread(id);notice(t('createdNotice'))}
document.addEventListener('input',e=>{if(e.target.matches('[data-draft-context]')){const key=e.target.dataset.draftContext;contextState(key).draft=e.target.value;const nav=document.querySelector(`[data-thread="${key}"]`);if(nav){const previous=nav.querySelector('.draft-mark');if(e.target.value&&!previous)nav.insertAdjacentHTML('beforeend',`<span class="draft-mark">${t('draftSaved')}</span>`);else if(!e.target.value)previous?.remove()}}if(e.target.matches('[data-thread-search]'))document.querySelector('[data-thread-search-results]').innerHTML=searchResults(e.target.value)});
document.addEventListener('scroll',e=>{if(e.target.matches?.('[data-chat-scroll],[data-page-scroll]'))contextState(e.target.dataset.contextKey).scroll=e.target.scrollTop},true);
document.addEventListener('change',e=>{if(e.target.matches('[data-overview-project]')){overviewProject=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.dataset.form==='new-work'){e.preventDefault();createWork(new FormData(e.target))}});
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||button.disabled)return;if(button.dataset.thread){openThread(button.dataset.thread);return}if(button.dataset.openThread){closeDialog();openThread(button.dataset.openThread);return}if(button.dataset.channel){openChannel(button.dataset.channel);return}if(button.dataset.page){openPage(button.dataset.page);return}if(button.dataset.collapse){const id=button.dataset.collapse;collapsedProjects[id]=!collapsedProjects[id];render();return}if(button.dataset.statFilter){overviewFilter=button.dataset.statFilter;render();return}if(button.dataset.showProgress){focusDecision(button.dataset.showProgress);return}if(button.dataset.fromMessage!==undefined){const m=messages[Number(button.dataset.fromMessage)];newWorkDialog(l(m.text),m.context.startsWith('channel:')?m.context.slice(8):'desktop');return}if(button.dataset.action==='threads-new'){newWorkDialog();return}if(button.dataset.action==='threads-menu'){sidebarOpen=!sidebarOpen;render();return}if(button.dataset.action==='threads-progress'){progressOpen=!progressOpen;render();return}});

</script>
<script id="threads-boot">const stage=document.getElementById("stage");const current=0;render();</script></body></html>
