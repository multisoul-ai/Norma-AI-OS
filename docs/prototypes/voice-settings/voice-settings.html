<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Norma · 语音设置原型（精简版）</title>
<style>
:root{--bg:#0f141b;--surface:#171d26;--surface-2:#1e2632;--surface-3:#263040;--outline:#2f3a4b;--outline-soft:#232c39;--text:#e6ebf3;--text-2:#a5b1c4;--text-3:#7a879b;--primary:#8ab4f8;--on-primary:#0b2a57;--primary-container:#1f3a63;--on-primary-container:#d6e4ff;--ok:#81c995;--ok-container:#173a26;--warn:#f2b8a2;--warn-container:#3d2420;--shadow:0 8px 28px rgba(0,0,0,.45);--state-hover:rgba(230,235,243,.08);--state-press:rgba(230,235,243,.14)}
[data-theme=light]{--bg:#e9eef6;--surface:#fbfcff;--surface-2:#f1f4fa;--surface-3:#e4e9f2;--outline:#c3cbd8;--outline-soft:#dde3ed;--text:#1b2330;--text-2:#4b5a70;--text-3:#6b778b;--primary:#1a56d6;--on-primary:#fff;--primary-container:#d9e5ff;--on-primary-container:#0b2a57;--ok:#16784b;--ok-container:#d8f1e2;--warn:#a1352a;--warn-container:#fde4de;--shadow:0 8px 28px rgba(30,45,70,.18);--state-hover:rgba(27,35,48,.07);--state-press:rgba(27,35,48,.13)}
*{box-sizing:border-box;margin:0}
body{font:14px/1.45 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:56px 16px 40px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.stagebar{position:fixed;top:12px;right:16px;display:flex;gap:8px;font-size:12px}
.stagebar button{background:var(--surface-2);color:var(--text-2);border:1px solid var(--outline);border-radius:16px;padding:6px 12px;cursor:pointer;font-size:12px}
.win{width:640px;max-width:100%;height:fit-content;background:var(--surface);border:1px solid var(--outline);border-radius:20px;box-shadow:var(--shadow);padding-bottom:20px}
header{padding:20px 24px 12px;display:flex;justify-content:space-between;align-items:flex-start}
header small{color:var(--text-3);font-size:11px;letter-spacing:.04em}
header h1{font-size:22px;font-weight:600;line-height:1.3}
header p{color:var(--text-2);font-size:13px}
kbd{font:inherit;font-size:12px;color:var(--text-2);border:1px solid var(--outline);border-radius:6px;padding:0 5px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.icon-btn:hover,.row:hover{background:var(--state-hover)}
.icon-btn:active,.row:active{background:var(--state-press)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg{width:20px;height:20px;fill:currentColor;flex:none}
section{padding:0 24px}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden;height:36px;max-width:100%}
.seg.full{display:flex;height:40px}
.seg button{flex:1;border:0;background:none;color:var(--text-2);font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;border-left:1px solid var(--outline);white-space:nowrap;font-size:13px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--state-hover)}
.seg button[aria-checked=true]{background:var(--primary-container);color:var(--on-primary-container)}
.seg button .chk{width:16px;height:16px;display:none}
.seg button[aria-checked=true] .chk{display:block}
.mode-hint{color:var(--text-2);font-size:13px;margin:10px 4px 16px}
.status{border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:8px}
.status.todo{background:var(--warn-container)}.status.ready{background:var(--ok-container)}
.status .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.status.todo .dot{color:var(--warn)}.status.ready .dot{color:var(--ok)}
.status b{display:block;font-size:15px;font-weight:600}
.status .s{color:var(--text-2);font-size:13px}
.steps{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{height:28px;border-radius:8px;border:1px solid var(--outline);padding:0 10px;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);background:none}
.chip svg{width:16px;height:16px}
.chip.done{color:var(--ok);border-color:transparent;background:rgba(129,201,149,.14)}
.grow{flex:1;min-width:0}
.btn{height:40px;border-radius:20px;border:0;padding:0 22px;font-weight:600;cursor:pointer;background:var(--primary);color:var(--on-primary);white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.btn.text{background:none;color:var(--primary);padding:0 12px}.btn.text:hover{background:var(--state-hover)}
.btn.sm{height:32px;font-size:13px;padding:0 14px}
.btn[disabled]{opacity:.5;cursor:default;filter:none}
.grp{font-size:12px;font-weight:600;color:var(--primary);letter-spacing:.04em;padding:18px 12px 4px}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 12px;border-radius:12px;border:0;background:none;width:100%;text-align:left;color:inherit}
.row.link{cursor:pointer}.row.link:hover{background:var(--state-hover)}.row.link:active{background:var(--state-press)}
.row .ic{width:40px;height:40px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;color:var(--text-2);flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:15px}
.row .t span{color:var(--text-2);font-size:13px}
.row .v{color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:4px;flex:none}
.row .v svg{width:18px;height:18px}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surface-3);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--text-3);transition:.15s}
.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}
.sw[aria-checked=true]::after{left:22px;top:4px;width:20px;height:20px;background:var(--on-primary)}
.adv-toggle .chev{transition:.15s}
.adv.open .chev{transform:rotate(180deg)}
.adv-body{display:none;margin-top:4px;padding:4px 0 8px;border-top:1px solid var(--outline-soft)}
.adv.open .adv-body{display:block}
.sub{padding:10px 12px 4px;color:var(--text-3);font-size:12px}
.try{margin:20px 24px 0;background:var(--surface-2);border-radius:16px;padding:16px}
.try h3{font-size:15px;font-weight:600}.try p{color:var(--text-2);font-size:13px;margin:2px 0 12px}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--outline);border-radius:12px;padding:0 6px 0 14px;height:48px;background:var(--surface)}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.field input{flex:1;background:none;border:0;color:var(--text);font:inherit;outline:0;min-width:0}
.field input::placeholder{color:var(--text-3)}
.eg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.eg .chip{cursor:pointer;background:var(--surface)}
.eg .chip:hover{background:var(--state-hover)}
.result{margin-top:12px;border-radius:12px;background:var(--surface);border:1px solid var(--outline-soft);padding:12px 14px;font-size:13px}
.result .k{color:var(--text-3);font-size:11px;letter-spacing:.04em}
.result .route{display:flex;gap:8px;align-items:center;margin-top:4px;font-weight:600;flex-wrap:wrap}
.tag{font-size:11px;border-radius:6px;padding:1px 8px;font-weight:500}
.tag.local{background:rgba(129,201,149,.16);color:var(--ok)}.tag.llm{background:var(--primary-container);color:var(--on-primary-container)}
.note{color:var(--text-3);font-size:12px;margin-top:8px}
.menu{position:absolute;z-index:20;width:300px;background:var(--surface-2);border:1px solid var(--outline);border-radius:12px;box-shadow:var(--shadow);padding:8px 0;display:none}
.menu.open{display:block}
.mi{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px 6px 16px;cursor:pointer;border:0;background:none;color:var(--text);width:100%;text-align:left}
.mi:hover{background:var(--state-hover)}.mi:active{background:var(--state-press)}
.mi .l{flex:1}.mi .l small{display:block;color:var(--text-3);font-size:12px;line-height:1.2}
.mi svg{color:var(--primary);visibility:hidden;width:18px;height:18px}.mi[aria-checked=true] svg{visibility:visible}
.mi[disabled]{opacity:.45;cursor:default}
.mh{padding:8px 16px 4px;font-size:11px;color:var(--text-3);letter-spacing:.04em}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cred{padding:6px 12px 10px}
.cred .lbl{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 6px;font-size:13px;color:var(--text-2)}
.cred .lbl b{font-weight:500;color:var(--text);font-size:14px}
.cred .lbl em{font-style:normal;font-size:12px;color:var(--text-3)}
.cred .hint{font-size:12px;color:var(--text-3);margin-top:6px}
.field.sm{height:40px;border-radius:10px;padding:0 4px 0 12px}
.field .ctl{background:none;border:0;color:var(--primary);cursor:pointer;padding:0 8px;font-size:13px;height:32px;border-radius:16px}
.field .ctl:hover{background:var(--state-hover)}
.field .ctl[disabled]{opacity:.4;cursor:default}
.pill-ok{color:var(--ok);font-size:12px}
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.scrim.open{display:flex}
.sheet{width:540px;max-width:100%;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--outline);border-radius:20px;box-shadow:var(--shadow);padding:20px 20px 16px}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:2px}
.sheet .lead{color:var(--text-2);font-size:13px;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;min-height:52px;cursor:pointer}
.opt:hover{background:var(--state-hover)}
.opt .t{flex:1;min-width:0}.opt .t b{display:block;font-weight:500;font-size:14px}.opt .t span{color:var(--text-2);font-size:12px}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--outline);flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .radio{border-color:var(--primary)}
.opt[aria-checked=true] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.opt[aria-checked=true]{background:var(--primary-container)}
.sheet .foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--outline-soft)}
.sheet .foot .grow{color:var(--text-2);font-size:13px;flex:1}
.sheet .sub2{font-size:12px;color:var(--text-3);margin:14px 4px 6px;letter-spacing:.03em}
.minibtn{height:30px;border-radius:15px;border:1px solid var(--outline);background:none;color:var(--primary);font-size:12px;padding:0 12px;cursor:pointer}
.minibtn:hover{background:var(--state-hover)}
.cred{padding:6px 12px 10px}
.cred .lbl{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 6px;font-size:13px;color:var(--text-2)}
.cred .lbl b{font-weight:500;color:var(--text);font-size:14px}
.cred .lbl em{font-style:normal;font-size:12px;color:var(--text-3)}
.cred .hint{font-size:12px;color:var(--text-3);margin-top:6px}
.field.sm{height:40px;border-radius:10px;padding:0 4px 0 12px}
.field .ctl{background:none;border:0;color:var(--primary);cursor:pointer;padding:0 8px;font-size:13px;height:32px;border-radius:16px}
.field .ctl:hover{background:var(--state-hover)}
.pill-ok{color:var(--ok);font-size:12px}
.sub{padding:10px 12px 4px;color:var(--text-3);font-size:12px}
.grp{font-size:12px;font-weight:600;color:var(--primary);letter-spacing:.04em;padding:18px 12px 4px}
.adv.open .chev{transform:rotate(180deg)}
.chev{transition:.15s}
.adv-body{display:none;margin-top:4px;padding:4px 0 8px;border-top:1px solid var(--outline-soft)}
.adv.open .adv-body{display:block}
.field input{flex:1;background:none;border:0;color:var(--text);font:inherit;outline:0;min-width:0}
.field input::placeholder{color:var(--text-3)}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--outline);border-radius:12px;padding:0 6px 0 14px;height:48px;background:var(--surface)}
.field:focus-within{border-color:var(--primary)}
.btn.sm{height:32px;font-size:13px;padding:0 14px}
.btn.text{background:none;color:var(--primary);padding:0 12px}
</style>
</head>
<body>
<div class="stagebar"><button id="theme">浅色 / 深色</button><button id="reset">重置演示</button></div>

<main class="win" role="dialog" aria-label="语音设置">
  <header>
    <div><small>Norma</small><h1>语音</h1><p>让 Norma 听见你，也回应你 · <kbd>⌘E</kbd></p></div>
    <button class="icon-btn" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
  </header>
  <section>
    <div class="seg full" role="radiogroup" aria-label="对话模式" id="mode"></div>
    <p class="mode-hint" id="modeHint"></p>
    <div class="status" id="status"></div>
    <div id="body"></div>
  </section>
  <div style="height:20px"></div>
</main>

<div class="menu" id="menu" role="menu"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-label="选择语音回复声音"></div></div>
<div class="toast" id="toast"></div>

<script>
const ICON={
 mic:'<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>',
 key:'<svg viewBox="0 0 24 24"><path d="M12.65 10A6 6 0 1 0 7 16a6 6 0 0 0 5.65-6H16v4h4v-4h2v-4z"/></svg>',
 wave:'<svg viewBox="0 0 24 24"><path d="M3 10v4h2v-4zm4-4v12h2V6zm4-3v18h2V3zm4 5v8h2V8zm4 2v4h2v-4z"/></svg>',
 ai:'<svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4zM19 16l1 2.5 2.5 1L19 21.5 18 24l-1-2.5L14.5 20l2.5-1z"/></svg>',
 spk:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>',
 warn:'<svg viewBox="0 0 24 24"><path d="M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z"/></svg>',
 ok:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.4-1.4L10 14.2l7.6-7.6L19 8z"/></svg>'
};
const MODES=[['cmd','语音指令'],['doubao','豆包 2.0'],['live','GPT-Live']];
const HINTS={
 cmd:'按 ⌘E 说一句指令，Norma 在本机理解；复杂语义交给主模型。',
 doubao:'与豆包实时语音对话，识别、对话与合成都走火山方舟。',
 live:'与 GPT-Live 实时对话，可以边说话边操作当前项目。'
};
const RECOG=[['sherpa','本地 Sherpa','离线，模型需先安装'],['a1','本地精准 A1','离线，仅用于单次指令'],['azure','云端 Azure','音频发送到 Azure Speech']];
const ASR_LOCAL=[['paraformer','Paraformer Bilingual','中英双语'],['zipformer','Zipformer Bilingual','中英双语，流式']];
const LANGS={'zh-CN':'中文（zh-CN）','en-US':'English（en-US）'};
const AI_PROV=[['ollama','Ollama','本地运行的模型，基础地址指向 Ollama 服务'],['openai','OpenAI 兼容','需要 API Key；默认 https://api.openai.com/v1']];
const DOUBAO_VOICES=['Vivi 2.0','小何 2.0','云舟 2.0','小天 2.0','刘飞 2.0'];
// 本机 TTS 模型与音色（名称取自 crates/tts/src/catalog.rs；模型与音色的对应关系待核对）
const LOCAL_MODELS=[['matcha-zh','Matcha 中文'],['matcha-zh-en','Matcha 中英'],['kokoro','Kokoro 多语'],['zipvoice','ZipVoice 克隆']];
const LOCAL_VOICES={'matcha-zh':[['default','默认音色']],'matcha-zh-en':[['default','默认音色']],'kokoro':[['default','Default Bilingual Voice'],['af_heart','Heart'],['af_bella','Bella']],'zipvoice':[['cloned','克隆参考音频']]};
const MM_MODELS=[['turbo','Speech 2.8 Turbo','互动回复推荐'],['hd','Speech 2.8 HD','优先音质']];
const CANVAS=[['Grace','#422'],['Henry','#420'],['Iris','#424']];

const init=()=>({jev:{key:false,connected:false},
 mode:'cmd', mic:false,
 keys:{azure:false,minimax:false,ark:false,openai:false,agent:false},
 cmd:{recog:'sherpa',sherpaReady:false,a1Ready:false,lang:'zh-CN',asr:'paraformer',
      inter:'single',trig:'toggle',device:'系统默认',
      tts:{prov:'local',model:'matcha-zh',voice:'default',mmModel:'turbo',mmVoiceId:'',mmVerified:false,zipRef:false,zipText:''},
      models:{'matcha-zh':true,'matcha-zh-en':false,'kokoro':false,'zipvoice':false},
      aiProv:'ollama',aiBase:'',aiModel:'',aiListed:false,aiConnected:false,
      mmConnected:false,azRegion:'',azVerified:false,
      announce:true,glow:true,installing:false,adv:false},
 doubao:{trig:'realtime',device:'系统默认',voice:'Vivi 2.0'},
 live:{trig:'realtime',device:'系统默认',voice:'marin'},
 sheet:null
});
let S=init();
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const recogReady=c=>c.recog==='azure'?S.keys.azure:c.recog==='a1'?c.a1Ready:c.sherpaReady;
const grp=t=>`<div class="grp">${t}</div>`;
const sw=(k,on,label)=>`<button class="sw" role="switch" data-act="switch" data-k="${k}" aria-checked="${on}" aria-label="${label}"></button>`;
const valTxt=v=>`${esc(v)}${ICON.chev}`;
const tag=t=>`<span class="pill-ok">${t}</span>`;
const btn=(a,t,cls='tonal',extra='')=>`<button class="btn sm ${cls}" data-act="${a}" ${extra}>${t}</button>`;
const seg=(items,cur,act)=>`<div class="seg" role="radiogroup" data-act="${act}">${items.map(([v,l,dis])=>`<button role="radio" data-v="${v}" aria-checked="${cur===v}" ${dis?'disabled':''}><svg class="chk" viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>${l}</button>`).join('')}</div>`;
function row(ic,t,sub,ctl,link){
 return `<div class="row${link?' link':''}" ${link?`data-menu="${link}"`:''}><div class="ic">${ICON[ic]}</div><div class="t"><b>${t}</b>${sub?`<span>${esc(sub)}</span>`:''}</div><div class="v">${ctl}</div></div>`;
}
function keyField(k,label,hint){
 const saved=S.keys[k];
 return `<div class="cred"><div class="lbl"><b>${label}</b>${saved?tag('已保存'):'<em>未配置</em>'}</div>
  <div class="field sm"><input type="password" autocomplete="off" placeholder="${saved?'已保存，输入新值可替换':'输入 API Key'}" data-keyinput="${k}">
  ${saved?`<button class="ctl" data-act="clearkey" data-k="${k}">清除</button>`:''}<button class="btn sm tonal" data-act="savekey" data-k="${k}">保存</button></div>
  <div class="hint">${hint}</div></div>`;
}
function textField(id,label,ph,val,hint){
 return `<div class="cred"><div class="lbl"><b>${label}</b>${hint?`<em>${hint}</em>`:''}</div><div class="field sm"><input placeholder="${ph}" value="${esc(val||'')}" data-field="${id}"></div></div>`;
}

// 当前生效的语音回复描述
function ttsName(t){
 if(t.prov==='off') return '关闭语音回复';
 if(t.prov==='sys') return '系统旁白';

function nextAction(){

const menu=$('#menu');
function openMenu(anchor,key){
 const m=MENUS[key], cur=m.get();
 menu.innerHTML=`<div class="mh">${m.title}</div>`+m.items().map(([v,l,s])=>`<button class="mi" role="menuitemradio" aria-checked="${v===cur}" data-v="${v}"><span class="l">${l}${s?`<small>${s}</small>`:''}</span>${ICON.check}</button>`).join('');
 const a=anchor.getBoundingClientRect();
 menu.style.left=Math.max(8,Math.min(a.right-300,innerWidth-308))+'px';
 menu.style.top=(a.bottom+scrollY-6)+'px';
 menu.classList.add('open'); menu.dataset.key=key;
}

menu.addEventListener('click',e=>{

function install(){

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeMenu(); if(S.sheet) closeSheet(); } });

 if(f) S.cmd[f]=e.target.value;
 if(dr&&S.sheet){ S.sheet[dr]=e.target.value; if(dr==='mmVoiceId') S.sheet.mmVerified=false; }
});

document.addEventListener('click',e=>{

 if(!t.closest('.menu')&&!t.closest('[data-menu]')) closeMenu();
 const md=t.closest('[data-mode]'); if(md){ S.mode=md.dataset.mode; closeMenu(); render(); return }
 const mr=t.closest('[data-menu]');
 if(mr){ if(mr.dataset.menu==='voice'){ openSheet(); return } openMenu(mr,mr.dataset.menu); return }
 const b=t.closest('[data-act]'); if(!b||b.disabled) return;
 const c=S.cmd, a=b.dataset.act, v=b.dataset.v||t.closest('[data-v]')?.dataset.v;
 // 面板内操作
 if(S.sheet && t.closest('#sheet')){
   const d=S.sheet;
   if(a==='sprov'&&v){ d.prov=v; if(v==='local'&&!c.models[d.model]) d.model='matcha-zh'; d.voice=(LOCAL_VOICES[d.model]||[['default']])[0][0]; }
   else if(a==='smodel'&&v){ d.model=v; d.voice=(LOCAL_VOICES[v]||[['default']])[0][0]; }
   else if(a==='svoice'&&v){ d.voice=v; }
   else if(a==='dlmodel'){ c.models[v]=true; toast('模型已下载并校验'); }
   else if(a==='mmmodel'&&v){ d.mmModel=v; }
   else if(a==='mmconn'){ if(!S.keys.minimax){toast('请先在更多设置中保存 MiniMax Key');} else { c.mmConnected=true; toast('MiniMax 已连接'); } }
   else if(a==='mmverify'){ if(!c.mmConnected){toast('请先连接 MiniMax');} else if(!d.mmVoiceId){toast('请输入 Voice ID');} else { d.mmVerified=true; toast('已验证并试听'); } }
   else if(a==='zipref'){ d.zipRef=true; toast('参考音频已导入'); }
   else if(a==='preview'){ toast(`▶ ${b.dataset.v}：试听`); }
   else if(a==='sheetclose'){ closeSheet(); render(); return }
   else if(a==='apply'){
     if(d.prov==='local'&&d.model==='zipvoice'&&(!d.zipRef||!d.zipText.trim())){ toast('克隆需要参考 WAV 与准确转写'); return }
     if(d.prov==='mm'&&!d.mmVerified){ toast('请先验证 Voice ID'); return }
     c.tts={...d}; closeSheet(); toast('已切换语音回复'); render(); return;
   }
   render(); return;
 }
 if(a==='switch'){ const k=b.dataset.k; c[k]=!c[k]; }
 else if(a==='inter'&&v){ c.inter=v; if(v==='continuous'&&c.recog==='a1'){ c.recog='sherpa'; toast('已切换为本地 Sherpa，持续聆听不支持 A1'); } }
 else if(a==='trig'&&v) c.trig=v;
 else if(a==='aiprov'&&v){ c.aiProv=v; c.aiConnected=false; c.aiListed=false; }
 else if(a==='dtrig'&&v) S.doubao.trig=v;
 else if(a==='ltrig'&&v) S.live.trig=v;
 else if(a==='lvoice'&&v) S.live.voice=v;
 else if(a==='adv') c.adv=!c.adv;
 else if(a==='install') install();
 else if(a==='mic'){ S.mic=true; toast('已授权麦克风'); }
 else if(a==='savekey'){ const k=b.dataset.k; const inp=document.querySelector(`[data-keyinput="${k}"]`); if(!inp||(!inp.value.trim()&&!S.keys[k])){toast('请先输入 API Key');return} S.keys[k]=true; if(inp) inp.value=''; toast(KEY_TOAST[k]); }
 else if(a==='clearkey'){ const k=b.dataset.k; S.keys[k]=false; if(k==='minimax') c.mmConnected=false; if(k==='agent') c.aiConnected=false; toast('已清除'); }
 else if(a==='aiconn'){ if(c.aiProv==='openai'&&!S.keys.agent){toast('请先保存 API Key');return} c.aiConnected=true; c.aiListed=true; toast('已加载模型列表'); }
 else if(a==='aivalidate'){ c.aiListed=false; toast('已验证模型 ID'); }
 else if(a==='azverify'){ if(!S.keys.azure){toast('请先保存 Azure Key');return} c.azVerified=true; toast('Azure 配置已通过验证'); }
 else if(a==='aztest'){ if(!S.keys.azure){toast('请先保存 Azure Key');return} toast('测试：请说话（3 秒），不改变当前来源'); }
 else if(a==='a1cancel'){ c.installing=false; toast('已取消安装，原配置未替换'); }
 else if(a==='jevsave'){ S.jev.key=true; toast('Jev 凭据已保存'); }
 else if(a==='jevverify'){ if(!S.jev.key){toast('请先保存 Jev API Key');} else { S.jev.connected=true; toast('Jev 连接测试通过'); } }
 else if(a==='jevclear'){ S.jev.key=false; S.jev.connected=false; toast('已清除 Jev 凭据'); }
 else if(a==='jevenv'){ toast('环境变量中未找到 Jev 凭据'); }
 else if(a==='diag'){ toast(c.sherpaReady||c.a1Ready?'本地模型已安装，校验通过':'尚未安装本地模型'); }
 render();
});

$('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark'};
$('#reset').onclick=()=>{S=init();closeSheet();render()};
render();
</script>
</body>
</html>
